name: 'Supply Chain Hardening'
description: >-
  Block malicious package installs in CI at the package-manager layer. Sets
  ignore-scripts, minimum-release-age (cooldown), wheels-only, and related
  defenses for 14 ecosystems (npm, pnpm, yarn, bun, deno, pip, uv, cargo,
  go, composer, bundler, maven, gradle, nuget). Defenses apply to every
  step after this action runs.
author: 'echennells'

inputs:
  ecosystems:
    description: >-
      Comma-separated subset of package managers to harden. Supported:
      npm, pnpm, yarn, bun, deno, pip, uv, cargo, go, composer, bundler,
      maven, gradle, nuget. Default covers every supported ecosystem so
      the action is secure-by-default; specify a narrower list to opt out
      of specific ecosystems (e.g., `ecosystems: 'npm,pnpm,pip,uv'`).
    required: false
    default: 'npm,pnpm,yarn,pip,uv,bun,composer,cargo,go,bundler,deno,maven,gradle,nuget'
  release_age_hours:
    description: >-
      Reject packages newer than this many hours. The 2026 AntV / Shai-Hulud
      compromise had a < 1-hour window between malicious publish and yank;
      48h is a sensible default for CI. Set to a smaller value at your own
      risk — going below 24 leaves you exposed to fast-moving attacks.
    required: false
    default: '48'
  strict:
    description: >-
      When true, the age gate fails the install rather than silently falling
      back to whatever older version is available. Default true matches the
      role's "fail loud, not fail silent" posture.
    required: false
    default: 'true'
  intel:
    description: >-
      Optional malware-intelligence layer. `none` (default) or `sfw` (Socket
      Firewall). With `sfw`, package managers are routed through a local
      filtering proxy that blocks versions Socket has flagged as malware —
      the axis the age gate and script blocking cannot cover, since a
      known-bad package that is 30 days old and runs no install script
      passes every other control here.

      Off by default deliberately. The config layer works offline and cannot
      fail open; this one is a network dependency on a third-party service,
      is fail-open by design (if Socket is unreachable it warns and the
      install proceeds unfiltered), needs Node 20+, and costs ~10-20s of job
      time. That is the right trade for a security-critical pipeline and the
      wrong one for every build in a busy monorepo, so it is your call rather
      than ours.

      Routes npm, npx and cargo through Socket Firewall — the entry points the
      action actually invokes sfw for. The pnpm/yarn/bun/bunx/pip/uv wrappers do
      config/flag hardening only and are NOT threat-intel scanned.
    required: false
    # Empty default (not 'none') so harden.sh can distinguish an EXPLICIT
    # `intel: none` from an unset input — the former conflicts with a legacy
    # `install_sfw: true` and must error; the latter must let install_sfw win
    # for backward compatibility. harden.sh maps empty -> none.
    default: ''
  install_sfw:
    description: >-
      DEPRECATED — use `intel: sfw`. Accepted for now; `true` is treated as
      `intel: sfw`. Setting both is an error rather than a silent
      precedence rule.
    required: false
    default: ''
  write_etc:
    description: >-
      Write system-wide /etc/* configs in addition to user-home configs.
      Helps the case where a subsequent step uses `sudo npm install` or
      similar (uncommon in CI but cheap to cover). Requires passwordless
      sudo, which all stock GitHub runners have.
    required: false
    default: 'true'
  pnpm_built_dependencies:
    description: >-
      Comma-separated allowlist of package names whose build scripts ARE
      allowed to run (pnpm 11+ `onlyBuiltDependencies` semantic). Default
      empty = block all build scripts via `ignore-scripts=true`. Set to
      e.g. `esbuild,sharp` if your project legitimately needs build
      scripts for native bindings. Mirrors the role's
      `pnpm_built_dependencies` var; empty default keeps action behavior
      strictly more secure than the role's user-allowlist-by-default.
    required: false
    default: ''
  composer_allow_plugins:
    description: >-
      Allow composer Plugin class execution (e.g., composer/installers,
      phpstan/extension-installer). Default false — wrapper injects
      --no-plugins. Set to true if your workflow legitimately needs a
      composer plugin; --no-scripts injection still applies regardless.
    required: false
    default: 'false'
  cargo_socket_firewall:
    description: >-
      Route cargo's registry-touching commands through Socket Firewall for
      threat-intel blocking, mirroring the role's `cargo_socket_firewall`
      (which defaults on). Only takes effect when sfw is actually present —
      the wrapper guards on `command -v sfw`, so with `install_sfw: false`
      this is a no-op rather than a broken cargo. Set false to keep cargo
      unfiltered even when sfw is installed.
    required: false
    default: 'true'
  install_cargo_cooldown:
    description: >-
      Install the cargo-cooldown backend that ENFORCES the cargo publish-age
      gate. Off by default because it compiles from source and costs minutes
      on a cold runner (same trade-off as install_sfw). When false, the gate's
      config is still written and the cargo wrapper still injects --locked —
      but a `cargo update` can resolve a freshly published crate unchecked.
      Turn this on for security-critical pipelines that build Rust, or
      pre-install cargo-cooldown in an earlier cached step and leave this off.
    required: false
    default: 'false'

outputs:
  ecosystems-hardened:
    description: >-
      Comma-separated list of ecosystems REQUESTED and recognised. Kept for
      compatibility — despite the name it does not mean anything is in force.
      Branch on ecosystems-effective instead.
    value: ${{ steps.harden.outputs.ecosystems_hardened }}
  ecosystems-effective:
    description: >-
      Ecosystems where every layer the protection depends on is in place.
      This is the one to gate on.
    value: ${{ steps.harden.outputs.ecosystems_effective }}
  ecosystems-degraded:
    description: >-
      Ecosystems that got something but not everything — a config file written
      while the PATH wrapper it needs could not be deployed, or a setting the
      installed tool version does not implement. Partially protected.
    value: ${{ steps.harden.outputs.ecosystems_degraded }}
  ecosystems-ineffective:
    description: >-
      Ecosystems where NOTHING effective was applied. deno lands here whenever
      deno is absent at hardening time, because a PATH wrapper is its entire
      mechanism and it has no config file to fall back on.
    value: ${{ steps.harden.outputs.ecosystems_ineffective }}
  release-age-hours:
    description: 'Active minimum release age in hours.'
    value: ${{ steps.harden.outputs.release_age_hours }}
  sfw-installed:
    description: 'true if Socket Firewall was installed and the npm wrapper deployed.'
    value: ${{ steps.harden.outputs.sfw_installed }}
  env-file:
    description: >-
      Path to the canonical, sourceable env file written on every platform
      (`source $ENV_FILE` re-applies the env layer). On GitHub Actions the
      env layer already propagates via $GITHUB_ENV, so this is mainly useful
      for a step that shells into a container or re-execs a login shell.
    value: ${{ steps.harden.outputs.env_file }}
  tool-versions:
    description: >-
      JSON map of detected tool versions per ecosystem ({"npm":"10.5.0","bun":"","composer":"2.9.8"}).
      Empty string means the tool wasn't installed in this runner. Downstream
      steps can use this for conditional logic (e.g., skip a job that needs
      a specific composer version).
    value: ${{ steps.harden.outputs.tool_versions }}

runs:
  using: 'composite'
  steps:
    - id: harden
      shell: bash
      env:
        ECOSYSTEMS: ${{ inputs.ecosystems }}
        RELEASE_AGE_HOURS: ${{ inputs.release_age_hours }}
        STRICT: ${{ inputs.strict }}
        INTEL: ${{ inputs.intel }}
        INSTALL_SFW: ${{ inputs.install_sfw }}
        WRITE_ETC: ${{ inputs.write_etc }}
        COMPOSER_ALLOW_PLUGINS: ${{ inputs.composer_allow_plugins }}
        PNPM_BUILT_DEPENDENCIES: ${{ inputs.pnpm_built_dependencies }}
        INSTALL_CARGO_COOLDOWN: ${{ inputs.install_cargo_cooldown }}
        CARGO_SOCKET_FIREWALL: ${{ inputs.cargo_socket_firewall }}
        # The script auto-detects GitHub from $GITHUB_ACTIONS; pinning it
        # here means a future runner change can't silently reroute emission.
        EMIT: github
      run: ${{ github.action_path }}/harden.sh

branding:
  icon: 'package'
  color: 'blue'
