# GitLab CI
#
# GitLab has no per-step env mechanism — a job's script is one shell, and
# harden.sh runs inside it as a SUBPROCESS, so its exports do not survive.
# Source the env file it writes; that is the whole difference from GitHub.
#
# The config files and PATH wrappers it deploys need no such step.

# Where the env file goes: GitLab sets no RUNNER_TEMP, so harden.sh writes it to
# the job user's ~/.cache/supply-chain-hardening/, and the source line below
# expands to the same path (or to HARDENING_ENV_FILE, if you set one).
#
# Don't point HARDENING_ENV_FILE into $CI_PROJECT_DIR. The Docker and Kubernetes
# executors run jobs under `umask 0000` unless FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR
# (or ..._KUBERNETES_EXECUTOR) is on, so the checkout is world-writable, and
# harden.sh refuses to write a file there that any user could replace.
#
# Each script line must succeed before the next runs, so a refused or failed
# harden.sh never reaches the source line. Not tested on a real GitLab runner.

.harden: &harden
  - ./action/harden.sh --emit=gitlab
  - source "${HARDENING_ENV_FILE:-${RUNNER_TEMP:-$HOME/.cache/supply-chain-hardening}/supply-chain-hardening.env}"

build:
  image: node:22
  before_script:
    - *harden
  script:
    # Everything from here runs with scripts blocked and the age gate on.
    - npm ci
    - npm run build

test:
  image: node:22
  before_script:
    - *harden
  script:
    - npm ci
    - npm test

# Cross-JOB propagation (as opposed to within a job) uses a dotenv report.
# Only needed if a later job must inherit the env layer without re-running
# the hardening — usually it is cheaper to just harden again.
build-with-dotenv:
  image: node:22
  script:
    - ./action/harden.sh --emit=gitlab
    - cp "${HARDENING_ENV_FILE:-${RUNNER_TEMP:-$HOME/.cache/supply-chain-hardening}/supply-chain-hardening.env}" hardening.env
    - sed -i 's/^export //' hardening.env    # dotenv wants KEY=value
  artifacts:
    reports:
      dotenv: hardening.env
