---
- name: Check if socket firewall is already installed
  ansible.builtin.command: which sfw
  register: sfw_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Check if npm is available for socket install
  # Canonical-path-first detection across system + Node-manager install
  # methods. See tasks/npm.yml for the same logic explained.
  ansible.builtin.shell:
    cmd: |
      for p in /usr/bin/npm /usr/local/bin/npm "$HOME/.volta/bin/npm" "$HOME/.asdf/shims/npm" "$HOME/.nodenv/shims/npm"; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "$HOME"/.nvm/versions/node/*/bin/npm; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "$HOME"/.local/share/fnm/node-versions/*/installation/bin/npm; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v npm 2>/dev/null
    executable: /bin/bash
  register: npm_for_socket
  changed_when: false
  check_mode: false
  failed_when: false

- name: Check Node.js version (sfw requires >= 20)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      node --version | sed 's/v\([0-9]*\).*/\1/'
    executable: /bin/bash
  register: node_major_version
  changed_when: false
  check_mode: false
  failed_when: false
  when: npm_for_socket.rc == 0

- name: Install Socket Firewall Free via npm (requires Node >= 20)
  # NON-FATAL BY DESIGN. An optional scanner failing to install must never
  # abort the play: the config-file layer is the load-bearing protection and
  # every include after this one would be skipped. Measured consequence of the
  # old behavior: on stock Ubuntu 22.04 / Debian 12 the Go tool install killed
  # 11 downstream includes, including the entire env-var layer. The failure is
  # recorded below instead, so it is reported rather than fatal or silent.
  become: true
  ansible.builtin.command: npm install -g sfw@{{ sfw_version }}
  when:
    - sfw_check.rc != 0
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20
  changed_when: true
  register: sfw_install
  failed_when: false

- name: Warm the Socket Firewall binary cache at apply time
  # sfw's npm package is a SHIM: the actual firewall binary is downloaded from
  # GitHub on first invocation, not at npm-install time. Left cold, that
  # download happens during someone's first real npm or cargo command — where
  # it can hang, or fail and take the command with it.
  #
  # Doing it here makes the fetch deterministic (once, at apply, where a
  # failure is visible and recorded) instead of a surprise in a build. It also
  # replaces an accidental warm-up: a health-check task used to run `sfw --help`
  # for other reasons and pulled the binary down as a side effect. Removing that
  # check silently un-warmed every host, which surfaced as npm tests hanging on
  # a cold cache — a dependency on a side effect nobody had written down.
  #
  # NON-FATAL. If sfw cannot be prepared, MOVE IT ASIDE (sfw -> sfw.broken) so
  # `command -v sfw` fails and BOTH the npm and cargo wrappers fall through to
  # their pass-through-with-warning path. This is not a blast radius — it is the
  # correct, consistent behaviour: a genuinely non-runnable sfw would break
  # EITHER tool that routed through it, so neither should. (An earlier version
  # refused to move it aside, and separately a cargo-only quarantine used
  # `sfw --help` as its probe, which triggers the binary download and
  # false-positived on healthy hosts. `sfw /bin/true` is the right probe: it is
  # exactly what the wrappers do, so it cannot disagree with real usage.)
  #
  # Self-healing: a quarantined sfw makes the next apply's `command -v sfw` fail,
  # which re-triggers the install-and-warm above.
  become: true
  ansible.builtin.shell:
    cmd: |
      if timeout 120 sfw /bin/true >/dev/null 2>&1; then
        echo ok
      else
        P=$(command -v sfw 2>/dev/null) && mv -f "$P" "$P.broken" 2>/dev/null || true
        echo broken
      fi
    executable: /bin/bash
  register: sfw_warm
  # changed_when/check_mode go in as an ADJACENT PAIR — the invariant test in
  # 25-integration-regressions.bats requires check_mode: on the line directly
  # after changed_when: false, so a --check run gets a real answer rather than
  # a skipped task and an undefined register. A comment between them breaks it.
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20

- name: Record skipped protection — Socket Firewall binary could not be fetched
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — installed, but its runtime binary could not be fetched from GitHub (exit ' ~ (sfw_warm.rc | default("?") | string) ~ '). sfw is a shim that downloads the firewall on first use; until that succeeds every `sfw <cmd>` exits non-zero. npm calls fall back to npq where available. Re-apply once connectivity is restored.'] }}
  when:
    - sfw_warm is defined
    - sfw_warm.stdout | default('') | trim == 'broken'

- name: Record skipped protection — Socket Firewall (install failed)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — install failed. npm installs are not threat-intel filtered.'] }}
  when:
    - sfw_install is defined
    - sfw_install.rc | default(0) != 0

- name: Warn if Node too old for Socket Firewall
  ansible.builtin.debug:
    msg: "WARNING: Socket Firewall requires Node >= 20 but found Node {{ node_major_version.stdout | trim | default('<undetected>', true) }}. Skipping sfw install."
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int < 20

- name: Record skipped protection — Socket Firewall (Node too old)
  # Feeds the end-of-run "protections NOT applied" summary in main.yml, so a
  # skip is reported once at the end rather than only as a debug line buried
  # in the task stream.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall (sfw) — requires Node >= 20, found Node ' ~ (node_major_version.stdout | trim | default('<undetected>', true)) ~ '. npm installs are not threat-intel filtered.'] }}
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int < 20

- name: Re-check sfw availability after the install attempt
  # The npm PATH wrapper below execs sfw. Gating the wrapper on the ORIGINAL
  # sfw_check (taken before the install) would deploy a wrapper whose helper
  # may never have been installed — e.g. on Node 18, where the install task
  # skips. The wrapper degrades to a per-invocation warning on every npm call,
  # so the operator gets a wrapper that filters nothing. Re-check the real
  # post-install state and let the wrapper depend on it.
  #
  # DETECTION MUST BE AS ROBUST AS THE npm DETECTOR ABOVE.
  # This result gates the wrapper (jointly with the npq probe below) and drives
  # what the coverage summary reports, so a false negative here degrades a
  # protection AND emits a message asserting the opposite of the truth. A bare
  # `which sfw` is not good enough:
  #   - it runs WITHOUT become, while the install above runs WITH become
  #     (`npm install -g sfw@2` lands in root's npm prefix), and
  #   - it trusts the ambient PATH, which this very file distrusts for npm.
  # On nvm / volta / fnm / asdf hosts — the exact managers the npm detector
  # enumerates — or wherever /usr/local/bin is absent from Ansible's PATH,
  # bare `which` reports "missing" for an sfw that is installed.
  # Canonical-path-first, then an augmented-PATH fallback.
  ansible.builtin.shell:
    cmd: |
      for p in /usr/local/bin/sfw /usr/bin/sfw "$HOME/.local/bin/sfw" \
               "$HOME/.volta/bin/sfw" "$HOME/.asdf/shims/sfw" "$HOME/.nodenv/shims/sfw"; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "$HOME"/.nvm/versions/node/*/bin/sfw; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "$HOME"/.local/share/fnm/node-versions/*/installation/bin/sfw; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v sfw 2>/dev/null
    executable: /bin/bash
  register: sfw_final
  changed_when: false
  check_mode: false
  failed_when: false

- name: Ensure sfw cache directory is writable
  become: true
  ansible.builtin.file:
    path: /usr/local/lib/node_modules/sfw/.sfw-cache
    state: directory
    mode: "0755"
  failed_when: false
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20

# --- npm PATH wrapper (opt-in via npm_path_wrapper) ---
# Without this, sfw is installed but never invoked except by callers who
# explicitly type `sfw npm install ...`. The wrapper interposes at the
# PATH level so every npm call (scripts, agents, sudo, package.json
# lifecycles) is routed through sfw.

- name: Find real npm path (symlink-aware, with wrapper-recursion guard)
  # Previous logic blanket-excluded /usr/local/bin from PATH search and
  # relied on /usr/bin/npm or ~/.{volta,asdf,nodenv,nvm,fnm}/.../npm being
  # present. That misses a common sysadmin install pattern: Node tarball
  # extracted to /opt/node-X/, symlinked into /usr/local/bin/npm.
  # /opt/node-X/bin isn't in PATH and isn't in our static fallback list,
  # so npm_real_path comes back empty and the wrapper never deploys.
  #
  # Better: check whether /usr/local/bin/npm IS our wrapper (has the
  # supply-chain-hardening marker the template embeds). If yes, the
  # original anti-recursion clean-PATH search is correct. If no
  # (raw binary or symlink), readlink -f resolves through any symlink
  # chain and gives the canonical path — catches the /opt install case.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if [ -f /usr/local/bin/npm ] && grep -q "supply-chain-hardening" /usr/local/bin/npm 2>/dev/null; then
        # Wrapper already deployed — re-find the real npm to re-render
        # the wrapper. Same anti-recursion logic as before.
        CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -vFx '/usr/local/bin' | tr '\n' ':' | sed 's/:$//')
        PATH="$CLEAN_PATH" command -v npm 2>/dev/null
      elif [ -e /usr/local/bin/npm ]; then
        # Raw binary or symlink at /usr/local/bin/npm — follow to canonical
        # path. Handles /opt/node-X/bin/npm via /usr/local/bin/npm symlink.
        readlink -f /usr/local/bin/npm
      else
        # Nothing at /usr/local/bin/npm — fall back to PATH search.
        command -v npm 2>/dev/null
      fi
    executable: /bin/bash
  register: npm_real_path
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0

- name: Re-check npq availability (the wrapper's other helper)
  # The wrapper is NOT sfw-only. templates/npm-wrapper.sh.j2 has a deliberate
  # fallback ladder:
  #   TTY + npq-hero + sfw -> exec sfw npq-hero      (both layers)
  #   TTY + npq-hero, none -> exec npq-hero          (reputation prompt only)
  #   non-TTY + sfw        -> exec sfw npm           (threat intel only)
  #   neither              -> warn loudly + passthrough
  # So npq alone is still real protection for interactive callers. Gating
  # deployment on sfw ALONE (as this file briefly did) meant a Node-18 host —
  # where the sfw install is skipped — got no wrapper at all, downgrading it
  # from "npq reputation prompts" to "nothing". That traded degraded coverage
  # for none, to avoid a case the wrapper already handles explicitly.
  #
  # FUNCTIONAL, NOT PRESENT. npq fails open: on Node < 20.13.0 it prints one
  # line to stderr, passes through to the real package manager, and exits 0.
  # An earlier version of this probe used `command -v npq-hero`, which meant a
  # host with a dead npq satisfied the "at least one helper" gate below and
  # got a wrapper whose only helper vets nothing. Presence is not coverage —
  # run it and look for npq's own suppression signal. Self-contained rather
  # than reading a fact from npq.yml, because `--tags socket` runs this file
  # without running npq.yml.
  ansible.builtin.shell:
    cmd: |
      for p in /usr/local/bin/npq-hero /usr/bin/npq-hero "$HOME/.local/bin/npq-hero"; do
        if [ -x "$p" ]; then
          NPQ="$p"
          break
        fi
      done
      [ -n "${NPQ:-}" ] || NPQ=$(PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v npq-hero 2>/dev/null)
      [ -n "${NPQ:-}" ] || exit 1
      out=$("$NPQ" --version 2>&1)
      if printf '%s' "$out" | grep -qi 'npq suppressed'; then
        exit 1
      fi
      echo "$NPQ"
    executable: /bin/bash
  register: npq_final
  changed_when: false
  check_mode: false
  failed_when: false

- name: Deploy npm PATH wrapper to /usr/local/bin
  become: true
  ansible.builtin.template:
    src: npm-wrapper.sh.j2
    dest: /usr/local/bin/npm
    mode: "0755"
    owner: root
    group: root
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0
    - npm_real_path.rc == 0
    - npm_real_path.stdout | length > 0
    # At least ONE helper must exist. A wrapper with neither sfw nor npq adds
    # only a per-invocation warning, which is noise rather than protection —
    # that was the real defect behind coupling this to sfw. But either helper
    # alone is genuine coverage (see the fallback ladder above), so require
    # sfw OR npq, not sfw specifically.
    - >-
      (sfw_final.rc == 0 and sfw_final.stdout | length > 0)
      or (npq_final.rc == 0 and npq_final.stdout | length > 0)

- name: Record skipped protection — npm PATH wrapper (sfw unavailable)
  # Wording note: this says "not refreshed", not "not deployed". Nothing in
  # this role REMOVES an existing /usr/local/bin/npm wrapper, so on a re-apply
  # where sfw has since disappeared a wrapper from an earlier run is still on
  # disk. Claiming it "was NOT deployed" would be false in that case, and the
  # operator would go looking for an absent file instead of a stale one.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['npm PATH wrapper — requested (npm_path_wrapper=true) but NEITHER Socket Firewall nor npq was found, so the wrapper was not deployed or refreshed. npm calls are unfiltered. If /usr/local/bin/npm exists from an earlier run it is now stale and warns on every invocation.'] }}
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0
    - sfw_final.rc != 0 or sfw_final.stdout | length == 0
    - npq_final.rc != 0 or npq_final.stdout | length == 0

- name: Record degraded protection — npm wrapper deployed without Socket Firewall
  # Deployed and useful (npq reputation prompts for interactive callers), but
  # non-interactive callers — scripts, agents, CI, the population this role
  # most targets — get the warn-and-passthrough branch. That is a real gap and
  # should not read as full npm coverage.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall threat-intel filtering for npm — the npm PATH wrapper WAS deployed and npq covers interactive callers, but sfw is absent, so non-interactive npm calls (scripts, agents, CI) are passed through unfiltered with a warning.'] }}
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0
    - sfw_final.rc != 0 or sfw_final.stdout | length == 0
    - npq_final.rc == 0
    - npq_final.stdout | length > 0

# --- cargo coverage (sfw supports cargo upstream: `sfw cargo fetch`) ---
# These live HERE, not in tasks/cargo.yml, because sfw is installed above and
# cargo hardening runs earlier in main.yml (:96 vs :153). Checking sfw health
# from cargo.yml reported "absent" on every first apply — sfw genuinely was
# absent at that point, and installed moments later.
# NOTE: a cargo-specific sfw health-check-and-quarantine block lived here and
# was removed. It moved the SHARED /usr/bin/sfw aside when a probe failed,
# which also disarmed the npm wrapper's sfw integration — a cargo-motivated
# guard with a blast radius into another ecosystem. The probe was wrong too:
# `sfw --help` triggers the shim's runtime binary download and exits 1 whenever
# that fetch fails, which is common, so it quarantined healthy installs.
# cargo's sfw prefix now defaults off instead (see cargo_socket_firewall).
