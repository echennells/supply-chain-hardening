---
- name: Check if socket firewall is already installed
  ansible.builtin.command: which sfw
  register: sfw_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Check if npm is available for socket install
  # Canonical-path-first detection across system + Node-manager install
  # methods. See tasks/npm.yml for the same logic explained.
  ansible.builtin.shell:
    cmd: |
      for p in /usr/bin/npm /usr/local/bin/npm "$HOME/.volta/bin/npm" "$HOME/.asdf/shims/npm" "$HOME/.nodenv/shims/npm"; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "$HOME"/.nvm/versions/node/*/bin/npm; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "${FNM_DIR:-$HOME/.local/share/fnm}"/node-versions/*/installation/bin/npm "$HOME"/.local/share/fnm/node-versions/*/installation/bin/npm "$HOME"/.fnm/node-versions/*/installation/bin/npm; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v npm 2>/dev/null
    executable: /bin/bash
  register: npm_for_socket
  changed_when: false
  check_mode: false
  failed_when: false

- name: Check Node.js version (sfw requires >= 20)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      node --version | sed 's/v\([0-9]*\).*/\1/'
    executable: /bin/bash
  register: node_major_version
  changed_when: false
  check_mode: false
  failed_when: false
  when: npm_for_socket.rc == 0

- name: Reset an sfw cache that anyone but root could have written
  # sfw runs the cached firewall binary (.sfw-cache/latest) without checking its
  # digest again; the digest is checked once, when the file is downloaded
  # (sfw 2.0.6 dist/sfw.mjs, findValidCachedReleaseSync). So a cache that a
  # non-root account can write lets that account choose the binary every caller
  # runs, root included: `sudo npm install` goes through the npm wrapper and so
  # through sfw. Earlier versions of this role left the cache in exactly that
  # state: v2.0.0 through 8281a6b chowned it to the deploying user, and a host
  # hardened by an earlier version was found with it at mode 0777 and a
  # user-owned `latest`. MEASURED with 8281a6b on Debian 13
  # (Debian's npm, global prefix /usr/local): the deploying user repointed
  # `latest` at a script, and `sudo npm view is-number version` ran it as uid 0.
  #
  # Changing the owner back to root does not repair that. The binary may
  # already have been replaced, so the whole cache is removed, and the warm task
  # below downloads it again and checks the digest. This runs BEFORE the warm,
  # because the warm runs sfw as root, and before the install, because
  # replacing an old sfw (below) runs `npm install -g` as root, which goes
  # through the npm wrapper an earlier apply deployed and so through sfw. If
  # the cache cannot be removed, sfw is moved aside: root callers would
  # otherwise keep running its binary through the wrappers.
  #
  # It also reports an sfw older than 2.0.6 ("old-shim"), which the install
  # below replaces. The wrappers run sfw with SFW_SKIP_UPDATE_CHECK=1 so that a
  # non-root caller never writes the root-owned cache, and only 2.0.6 reads
  # that variable: 2.0.4's shouldCheckForUpdate() has no such test (both
  # dist/sfw.mjs read), and there is no 2.0.5. Role releases before v2.0.0
  # installed a floating `sfw@2`, which was 2.0.4 until 2026-05-22, and the
  # install below used to run only when sfw was absent, so those hosts kept
  # it. MEASURED (NodeSource, sfw 2.0.4 installed by root, this branch applied
  # by a non-root user before this check existed, next-check backdated): npm
  # as that user and as a second user, and cargo, each exited 1 with
  # "[sfw] Failed to prepare firewall binary: EACCES ... next-check", and a
  # second apply did not repair it.
  #
  # The cache is found from the sfw that root runs. sfw keeps it inside its own
  # package directory (the parent of the directory holding dist/sfw.mjs), so it
  # moves with npm's global prefix: /usr/lib/node_modules/sfw on NodeSource,
  # /usr/local/lib/node_modules/sfw on Debian's npm. The old tasks used a fixed
  # /usr/local path. On a /usr host that missed the real cache and created a
  # /usr/local/lib/node_modules/sfw/.sfw-cache instead (owned by the deploying
  # user from v2.0.0, by root before). That stray tree is removed here too. It is only removed when it holds nothing but
  # .sfw-cache: npm always writes package.json, so it is not an sfw install,
  # and nothing reads it.
  #
  # The same script also refuses to touch an sfw that root does not own. If
  # sudo keeps the applying user's PATH, root can resolve a per-user sfw, and
  # the role never runs a user-writable program as root (the npm check below
  # follows the same rule).
  #
  # check_mode: false with the dry flag below, so a --check run reports what
  # it would reset without changing anything, and the warm below knows not to
  # run sfw as root over a cache it could not reset.
  become: true
  ansible.builtin.shell:
    cmd: |
      set -u
      dry={{ '1' if ansible_check_mode else '0' }}
      s=/usr/local/lib/node_modules/sfw
      if [ -d "$s" ] && [ ! -L "$s" ] && [ ! -e "$s/package.json" ] \
         && [ "$(ls -A "$s")" = ".sfw-cache" ]; then
        if [ "$dry" = 1 ]; then
          echo "would-reset-stray $s"
        else
          rm -rf -- "$s" && echo "reset-stray $s"
          # The parent too, but only when that left it empty and it is not
          # root's: the old task created it, owned by the deploying user.
          p=${s%/*}
          if [ "$(stat -c %u "$p")" != 0 ] && rmdir -- "$p" 2>/dev/null; then
            echo "reset-stray $p"
          fi
        fi
      fi
      sfw=$(command -v sfw 2>/dev/null) || { echo absent; exit 0; }
      shim=$(readlink -f "$sfw")
      pkg=${shim%/*}; pkg=${pkg%/*}
      if [ ! -f "$pkg/package.json" ]; then echo "unresolved $sfw"; exit 0; fi
      if [ "$(stat -c %u "$shim")" != 0 ] || [ "$(stat -c %u "$pkg")" != 0 ]; then
        echo "not-root-owned $shim"
        exit 0
      fi
      if ! grep -q SFW_SKIP_UPDATE_CHECK "$shim"; then
        v=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' "$pkg/package.json" | head -n 1)
        echo "old-shim ${v:-unknown} $sfw"
      fi
      c=$pkg/.sfw-cache
      if [ ! -e "$c" ] && [ ! -L "$c" ]; then echo "cold $c"; exit 0; fi
      why=""
      if [ -L "$c" ] || [ ! -d "$c" ]; then
        why="it is not a directory"
      else
        # Symlinks are excluded from the mode test: theirs is always 0777.
        bad=$(find "$c" \( ! -uid 0 -o \( ! -type l -perm /022 \) \) -print -quit)
        if [ -n "$bad" ]; then
          why="$bad is $(stat -c '%U %a' "$bad")"
        elif [ -L "$c/latest" ]; then
          t=$(readlink -f "$c/latest")
          case "$t" in "$c"/*) ;; *) why="latest points outside the cache, at $t" ;; esac
        fi
      fi
      if [ -z "$why" ]; then echo "ok $c"; exit 0; fi
      if [ "$dry" = 1 ]; then echo "would-reset $c: $why"; exit 0; fi
      if rm -rf -- "$c"; then
        echo "reset $c: $why"
      else
        mv -f -- "$sfw" "$sfw.broken" 2>/dev/null
        echo "reset-failed $c: $why"
      fi
    executable: /bin/bash
  register: sfw_cache_reset
  changed_when: sfw_cache_reset.stdout is search('^((would-)?reset(-stray)?|reset-failed) ', multiline=True)
  check_mode: false
  failed_when: false
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20

- name: Check that root can run npm (a per-user Node is invisible to become)
  # The install below runs `npm install -g` as root, and root's PATH is sudo's
  # secure_path, not the user's shell. On a host whose only Node is per-user
  # (fnm, nvm, volta, asdf) the detection above finds the user's npm but root
  # cannot run it (MEASURED on fnm: not found under sudo), so the install failed
  # and was recorded as "install failed", which sends the reader after the wrong
  # problem. Running the user's npm as root is not the fix: root would execute
  # files the user can edit. Skip the install and say why instead.
  become: true
  ansible.builtin.shell:
    cmd: |
      # Found by root AND owned by root. Where sudoers sets no secure_path, root
      # keeps the applying user's PATH and finds the per-user npm after all;
      # running that as root would execute files the user can edit.
      npm_path=$(command -v npm) || exit 1
      for p in "$npm_path" "$(command -v node)"; do
        [ -n "$p" ] || continue
        real=$(readlink -f "$p")
        [ "$(stat -c %u "$real" 2>/dev/null)" = 0 ] || { echo "$real"; exit 3; }
      done
    executable: /bin/bash
  register: npm_root_for_socket
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - sfw_check.rc != 0 or sfw_cache_reset.stdout | default('') is search('^old-shim ', multiline=True)
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20

- name: Install Socket Firewall Free via npm (requires Node >= 20)
  # NON-FATAL BY DESIGN. An optional scanner failing to install must never
  # abort the play: the config-file layer is the load-bearing protection and
  # every include after this one would be skipped. Measured consequence of the
  # old behavior: on stock Ubuntu 22.04 / Debian 12 the Go tool install killed
  # 11 downstream includes, including the entire env-var layer. The failure is
  # recorded below instead, so it is reported rather than fatal or silent.
  become: true
  # --ignore-scripts: dogfood the script-block on the role's own install. Safe for
  # sfw despite it fetching a firewall binary: that fetch is lazy at first runtime,
  # not a postinstall — if it WERE a postinstall it would already be blocked on
  # every npm >=12 host by native allowScripts (which the role supports), so sfw
  # cannot depend on an install-time script. Universal CLI flag across npm versions.
  #
  # Also run over an sfw older than 2.0.6 (the reset above says "old-shim"):
  # the wrappers depend on SFW_SKIP_UPDATE_CHECK, which only 2.0.6 reads. npm
  # replaces the package directory, so the cache goes with it and the warm
  # below downloads the binary again (MEASURED from 2.0.4 to 2.0.6).
  ansible.builtin.command: npm install -g --ignore-scripts sfw@{{ sfw_version }}
  when:
    - sfw_check.rc != 0 or sfw_cache_reset.stdout | default('') is search('^old-shim ', multiline=True)
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20
    - npm_root_for_socket.rc | default(1) == 0
  changed_when: true
  register: sfw_install
  failed_when: false

- name: Warm the Socket Firewall binary cache at apply time
  # sfw's npm package is a SHIM: the actual firewall binary is downloaded from
  # GitHub on first invocation, not at npm-install time. Left cold, that
  # download happens during someone's first real npm or cargo command — where
  # it can hang, or fail and take the command with it.
  #
  # Doing it here makes the fetch deterministic (once, at apply, where a
  # failure is visible and recorded) instead of a surprise in a build. It also
  # replaces an accidental warm-up: a health-check task used to run `sfw --help`
  # for other reasons and pulled the binary down as a side effect. Removing that
  # check silently un-warmed every host, which surfaced as npm tests hanging on
  # a cold cache — a dependency on a side effect nobody had written down.
  #
  # NON-FATAL. If sfw cannot be prepared, MOVE IT ASIDE (sfw -> sfw.broken) so
  # `command -v sfw` fails and BOTH the npm and cargo wrappers fall through to
  # their pass-through-with-warning path. This is not a blast radius — it is the
  # correct, consistent behaviour: a genuinely non-runnable sfw would break
  # EITHER tool that routed through it, so neither should. (An earlier version
  # refused to move it aside, and separately a cargo-only quarantine used
  # `sfw --help` as its probe, which triggers the binary download and
  # false-positived on healthy hosts. `sfw /bin/true` is the right probe: it is
  # exactly what the wrappers do, so it cannot disagree with real usage.)
  #
  # Self-healing: a quarantined sfw makes the next apply's `command -v sfw` fail,
  # which re-triggers the install-and-warm above.
  become: true
  ansible.builtin.shell:
    cmd: |
      # Capture sfw's real exit code and error text. The old form
      # (`sfw /bin/true >/dev/null 2>&1 … echo broken`) discarded stderr and
      # ended on `echo`, so the shell's rc was ALWAYS 0 — a GitHub 403 while
      # fetching the firewall binary was quarantined fail-open but recorded as
      # "exit 0" with no reason. Surface both: stdout still ends in ok/broken for
      # the recorder, the diagnostic goes to stderr, and the shell exits with
      # sfw's real code so `sfw_warm.rc` is truthful.
      # Nothing to warm when root cannot see sfw: the install was skipped or
      # failed (each has its own record), or sfw exists only on the applying
      # user's PATH. Carrying on recorded "installed, but its runtime binary could
      # not be fetched from GitHub (exit 127)" for an sfw root never had.
      P=$(command -v sfw 2>/dev/null) || { echo absent; exit 0; }
      # The path root ran, for the non-root check below. The LAST line stays
      # ok/broken/old/absent for the recorders.
      echo "path=$P"
      # Still older than 2.0.6 after the install above (it failed, was
      # skipped, or sfw_version pins an older release): it ignores the
      # SFW_SKIP_UPDATE_CHECK the wrappers set, so every non-root call through
      # it would fail an hour after each update check. Move it aside, as for a
      # failed warm, and record why. Not in a --check run.
      shim=$(readlink -f "$P"); pkg=${shim%/*}; pkg=${pkg%/*}
      if [ -f "$pkg/package.json" ] && ! grep -q SFW_SKIP_UPDATE_CHECK "$shim"; then
        echo "version=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' "$pkg/package.json" | head -n 1)"
        {{ 'true' if ansible_check_mode else 'mv -f "$P" "$P.broken" 2>/dev/null' }}
        echo old
        exit 0
      fi
      # umask 022: sudo applies the union of the caller's umask and its own, so
      # a caller with umask 077 would leave the downloaded binary in a 0700
      # directory that no other account can reach.
      umask 022
      # Whichever `true` exists, as the action does (macOS has no /bin/true).
      true_bin=/usr/bin/true; [ -x "$true_bin" ] || true_bin=/bin/true
      if out=$(timeout 120 sfw "$true_bin" 2>&1); then
        echo ok
      else
        rc=$?
        mv -f "$P" "$P.broken" 2>/dev/null || true
        printf 'sfw warm failed (rc=%s): %s\n' "$rc" "$(printf '%s' "$out" | head -1)" >&2
        echo broken
        exit "$rc"
      fi
    executable: /bin/bash
  register: sfw_warm
  # changed_when/check_mode go in as an ADJACENT PAIR — the invariant test in
  # 25-integration-regressions.bats requires check_mode: on the line directly
  # after changed_when: false, so a --check run gets a real answer rather than
  # a skipped task and an undefined register. A comment between them breaks it.
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20
    # Never run sfw as root over a cache the reset above found untrusted and
    # did not remove (a --check run, or the removal failed), or over an sfw
    # root does not own.
    - sfw_cache_reset.stdout | default('') is not search('^(would-reset|reset-failed|not-root-owned) ', multiline=True)

- name: Check that a non-root caller can run the warmed sfw
  # Parity with the action (install_sfw_and_wrap in action/harden.sh): warm as
  # root, then run sfw the way the wrappers run it for an ordinary account,
  # with SFW_SKIP_UPDATE_CHECK=1 and no write access to the root-owned cache.
  # That is the state every non-root npm and cargo call through sfw is in, so
  # if it fails here it would fail in each of them, in sfw's words, not ours.
  # Skipped when the role is applied as root: the warm already ran as root.
  become: false
  ansible.builtin.shell:
    cmd: |
      true_bin=/usr/bin/true; [ -x "$true_bin" ] || true_bin=/bin/true
      if out=$(SFW_SKIP_UPDATE_CHECK=1 timeout 120 {{ sfw_warm.stdout_lines[0][5:] | quote }} "$true_bin" 2>&1); then
        echo ok
      else
        rc=$?
        printf 'sfw failed as %s (rc=%s): %s\n' "$(id -un)" "$rc" "$(printf '%s' "$out" | grep -v '^[[:space:]]*$' | tail -n 1)" >&2
        echo broken
        exit "$rc"
      fi
    executable: /bin/bash
  register: sfw_user_check
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - sfw_warm is defined
    - (sfw_warm.stdout_lines | default([], true) | last | default('')) == 'ok'
    - (sfw_warm.stdout_lines | first) is match('path=/')
    - preflight_invoking_user.stdout | default('root') | trim != 'root'

- name: Move sfw aside when a non-root caller cannot run it
  # Same degradation as a failed warm: with sfw gone from PATH, the npm and
  # cargo wrappers pass through with a warning instead of failing every call.
  become: true
  ansible.builtin.command:
    argv: [mv, -f, "{{ sfw_warm.stdout_lines[0][5:] }}", "{{ sfw_warm.stdout_lines[0][5:] }}.broken"]
  changed_when: true
  failed_when: false
  when:
    - sfw_user_check is defined
    - sfw_user_check.stdout | default('') | trim == 'broken'

- name: Record skipped protection — Socket Firewall cannot run for a non-root caller
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — prepared as root, but ' ~ (preflight_invoking_user.stdout | trim) ~ ' cannot run it (exit ' ~ (sfw_user_check.rc | default("?") | string) ~ ': ' ~ (sfw_user_check.stderr | default('') | trim) ~ '). It was moved aside so npm and cargo keep working, unfiltered. Check the permissions on ' ~ (sfw_cache_reset.stdout | default('') | regex_search('/[^ :]*\.sfw-cache') | default('the sfw cache', true)) ~ ' and its parents, then re-apply.'] }}
  when:
    - sfw_user_check is defined
    - sfw_user_check.stdout | default('') | trim == 'broken'

- name: Record skipped protection — Socket Firewall binary could not be fetched
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — installed, but its runtime binary could not be fetched from GitHub (exit ' ~ (sfw_warm.rc | default("?") | string) ~ '). sfw is a shim that downloads the firewall on first use; until that succeeds every `sfw <cmd>` exits non-zero. npm calls fall back to npq where available. Re-apply once connectivity is restored.'] }}
  when:
    - sfw_warm is defined
    - (sfw_warm.stdout_lines | default([], true) | last | default('')) == 'broken'

- name: Record skipped protection — Socket Firewall older than 2.0.6
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — sfw ' ~ (sfw_warm.stdout | regex_search('^version=(.*)$', '\1', multiline=True) | default(['unknown'], true) | first | default('unknown', true)) ~ ' at ' ~ sfw_warm.stdout_lines[0][5:] ~ ' predates 2.0.6, so it ignores SFW_SKIP_UPDATE_CHECK, which the npm and cargo wrappers set so that a non-root caller never writes its root-owned cache. With it, every non-root npm and cargo call through sfw fails from an hour after each update check ("[sfw] Failed to prepare firewall binary: EACCES ... next-check"). ' ~ (('This --check run changed nothing: a real run replaces it with sfw@' ~ sfw_version ~ ', and moves it aside only if it is still older than 2.0.6.') if ansible_check_mode else ((('Replacing it with sfw@' ~ sfw_version ~ ((' failed (exit ' ~ (sfw_install.rc | string) ~ ').') if (sfw_install.rc | default(0)) != 0 else ' left it unchanged: sfw_version must be 2.0.6 or later.')) if (sfw_install is defined and sfw_install is not skipped) else 'It was not replaced (see the other Socket Firewall entries).') ~ ' It was moved aside so npm and cargo keep working, unfiltered. Install sfw 2.0.6 or later as root and re-apply.'))] }}
  when:
    - sfw_warm is defined
    - (sfw_warm.stdout_lines | default([], true) | last | default('')) == 'old'

- name: Record skipped protection — Socket Firewall cache could not be reset
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — its cache could be written by an account other than root (' ~ (sfw_cache_reset.stdout | regex_search('^reset-failed (.*)$', '\1', multiline=True) | first) ~ '), so that account may have chosen the binary sfw runs, and removing the cache failed. sfw was moved aside and not run, so npm and cargo run unfiltered. Remove that cache as root and re-apply.'] }}
  when:
    - sfw_cache_reset is defined
    - sfw_cache_reset.stdout | default('') is search('^reset-failed ', multiline=True)

- name: Record skipped protection — Socket Firewall resolves to a program root does not own
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — root resolves sfw to ' ~ (sfw_cache_reset.stdout | regex_search('^not-root-owned (.*)$', '\1', multiline=True) | first) ~ ', which root does not own (sudo kept the PATH of whoever applied the role), so its cache was not checked or warmed: the role does not run a user-writable program as root.'] }}
  when:
    - sfw_cache_reset is defined
    - sfw_cache_reset.stdout | default('') is search('^not-root-owned ', multiline=True)

- name: Record skipped protection — Socket Firewall (install failed)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — install failed. npm installs are not threat-intel filtered.'] }}
  when:
    - sfw_install is defined
    - sfw_install.rc | default(0) != 0

- name: Record skipped protection — Socket Firewall (npm is per-user)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — not installed: ' ~ (('root would run ' ~ (npm_root_for_socket.stdout | trim) ~ ', which root does not own (sudo kept the PATH of whoever applied the role), and the role does not run a user-writable program as root') if npm_root_for_socket.rc == 3 else ('the only npm found is ' ~ (npm_for_socket.stdout | trim) ~ ', which root cannot run (a per-user Node such as fnm, nvm, volta or asdf)')) ~ '. sfw installs system-wide, so it needs a system-wide Node; while the version manager stays first on PATH the npm wrapper is shadowed anyway (docs/limitations.md). npm installs are not threat-intel filtered.'] }}
  when:
    - npm_root_for_socket is defined
    - npm_root_for_socket.rc is defined
    - npm_root_for_socket.rc != 0

- name: Warn if Node too old for Socket Firewall
  ansible.builtin.debug:
    msg: "WARNING: Socket Firewall requires Node >= 20 but found Node {{ node_major_version.stdout | trim | default('<undetected>', true) }}. Skipping sfw install."
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int < 20

- name: Record skipped protection — Socket Firewall (Node too old)
  # Feeds the end-of-run "protections NOT applied" summary in main.yml, so a
  # skip is reported once at the end rather than only as a debug line buried
  # in the task stream.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall (sfw) — requires Node >= 20, found Node ' ~ (node_major_version.stdout | trim | default('<undetected>', true)) ~ '. npm installs are not threat-intel filtered.'] }}
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int < 20

- name: Re-check sfw availability after the install attempt
  # The npm PATH wrapper below execs sfw. Gating the wrapper on the ORIGINAL
  # sfw_check (taken before the install) would deploy a wrapper whose helper
  # may never have been installed — e.g. on Node 18, where the install task
  # skips. The wrapper degrades to a per-invocation warning on every npm call,
  # so the operator gets a wrapper that filters nothing. Re-check the real
  # post-install state and let the wrapper depend on it.
  #
  # DETECTION MUST BE AS ROBUST AS THE npm DETECTOR ABOVE.
  # This result gates the wrapper (jointly with the npq probe below) and drives
  # what the coverage summary reports, so a false negative here degrades a
  # protection AND emits a message asserting the opposite of the truth. A bare
  # `which sfw` is not good enough:
  #   - it runs WITHOUT become, while the install above runs WITH become
  #     (`npm install -g sfw@2` lands in root's npm prefix), and
  #   - it trusts the ambient PATH, which this very file distrusts for npm.
  # On nvm / volta / fnm / asdf hosts — the exact managers the npm detector
  # enumerates — or wherever /usr/local/bin is absent from Ansible's PATH,
  # bare `which` reports "missing" for an sfw that is installed.
  # Canonical-path-first, then an augmented-PATH fallback.
  ansible.builtin.shell:
    cmd: |
      for p in /usr/local/bin/sfw /usr/bin/sfw "$HOME/.local/bin/sfw" \
               "$HOME/.volta/bin/sfw" "$HOME/.asdf/shims/sfw" "$HOME/.nodenv/shims/sfw"; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "$HOME"/.nvm/versions/node/*/bin/sfw; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "${FNM_DIR:-$HOME/.local/share/fnm}"/node-versions/*/installation/bin/sfw "$HOME"/.local/share/fnm/node-versions/*/installation/bin/sfw "$HOME"/.fnm/node-versions/*/installation/bin/sfw; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v sfw 2>/dev/null
    executable: /bin/bash
  register: sfw_final
  changed_when: false
  check_mode: false
  failed_when: false

# --- npm PATH wrapper (opt-in via npm_path_wrapper) ---
# Without this, sfw is installed but never invoked except by callers who
# explicitly type `sfw npm install ...`. The wrapper interposes at the
# PATH level so every npm call (scripts, agents, sudo, package.json
# lifecycles) is routed through sfw.

- name: Find real npm path (symlink-aware, with wrapper-recursion guard)
  # Previous logic blanket-excluded /usr/local/bin from PATH search and
  # relied on /usr/bin/npm or ~/.{volta,asdf,nodenv,nvm,fnm}/.../npm being
  # present. That misses a common sysadmin install pattern: Node tarball
  # extracted to /opt/node-X/, symlinked into /usr/local/bin/npm.
  # /opt/node-X/bin isn't in PATH and isn't in our static fallback list,
  # so npm_real_path comes back empty and the wrapper never deploys.
  #
  # Better: check whether /usr/local/bin/npm IS our wrapper (has the
  # supply-chain-hardening marker the template embeds). If yes, the
  # original anti-recursion clean-PATH search is correct. If no
  # (raw binary or symlink), readlink -f resolves through any symlink
  # chain and gives the canonical path — catches the /opt install case.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if [ -f /usr/local/bin/npm ] && grep -q "supply-chain-hardening" /usr/local/bin/npm 2>/dev/null; then
        # Wrapper already deployed — re-find the real npm to re-render
        # the wrapper. Same anti-recursion logic as before.
        CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -vFx '/usr/local/bin' | tr '\n' ':' | sed 's/:$//')
        PATH="$CLEAN_PATH" command -v npm 2>/dev/null
      elif [ -e /usr/local/bin/npm ]; then
        # Raw binary or symlink at /usr/local/bin/npm — follow to canonical
        # path. Handles /opt/node-X/bin/npm via /usr/local/bin/npm symlink.
        readlink -f /usr/local/bin/npm
      else
        # Nothing at /usr/local/bin/npm — fall back to PATH search.
        command -v npm 2>/dev/null
      fi
    executable: /bin/bash
  register: npm_real_path
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0

- name: Re-check npq availability (the wrapper's other helper)
  # The wrapper is NOT sfw-only. templates/npm-wrapper.sh.j2 has a deliberate
  # fallback ladder:
  #   TTY + npq-hero + sfw -> exec sfw npq-hero      (both layers)
  #   TTY + npq-hero, none -> exec npq-hero          (reputation prompt only)
  #   non-TTY + sfw        -> exec sfw npm           (threat intel only)
  #   neither              -> warn loudly + passthrough
  # So npq alone is still real protection for interactive callers. Gating
  # deployment on sfw ALONE (as this file briefly did) meant a Node-18 host —
  # where the sfw install is skipped — got no wrapper at all, downgrading it
  # from "npq reputation prompts" to "nothing". That traded degraded coverage
  # for none, to avoid a case the wrapper already handles explicitly.
  #
  # FUNCTIONAL, NOT PRESENT. npq fails open: on Node < 20.13.0 it prints one
  # line to stderr, passes through to the real package manager, and exits 0.
  # An earlier version of this probe used `command -v npq-hero`, which meant a
  # host with a dead npq satisfied the "at least one helper" gate below and
  # got a wrapper whose only helper vets nothing. Presence is not coverage —
  # run it and look for npq's own suppression signal. Self-contained rather
  # than reading a fact from npq.yml, because `--tags socket` runs this file
  # without running npq.yml.
  ansible.builtin.shell:
    cmd: |
      for p in /usr/local/bin/npq-hero /usr/bin/npq-hero "$HOME/.local/bin/npq-hero"; do
        if [ -x "$p" ]; then
          NPQ="$p"
          break
        fi
      done
      [ -n "${NPQ:-}" ] || NPQ=$(PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v npq-hero 2>/dev/null)
      [ -n "${NPQ:-}" ] || exit 1
      out=$("$NPQ" --version 2>&1)
      if printf '%s' "$out" | grep -qi 'npq suppressed'; then
        exit 1
      fi
      echo "$NPQ"
    executable: /bin/bash
  register: npq_final
  changed_when: false
  check_mode: false
  failed_when: false

- name: Deploy npm PATH wrapper to /usr/local/bin
  become: true
  ansible.builtin.template:
    src: npm-wrapper.sh.j2
    dest: /usr/local/bin/npm
    mode: "0755"
    owner: root
    group: root
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0
    - npm_real_path.rc == 0
    - npm_real_path.stdout | length > 0
    # At least ONE helper must exist. A wrapper with neither sfw nor npq adds
    # only a per-invocation warning, which is noise rather than protection —
    # that was the real defect behind coupling this to sfw. But either helper
    # alone is genuine coverage (see the fallback ladder above), so require
    # sfw OR npq, not sfw specifically.
    - >-
      (sfw_final.rc == 0 and sfw_final.stdout | length > 0)
      or (npq_final.rc == 0 and npq_final.stdout | length > 0)

- name: Record skipped protection — npm PATH wrapper (sfw unavailable)
  # Wording note: this says "not refreshed", not "not deployed". Nothing in
  # this role REMOVES an existing /usr/local/bin/npm wrapper, so on a re-apply
  # where sfw has since disappeared a wrapper from an earlier run is still on
  # disk. Claiming it "was NOT deployed" would be false in that case, and the
  # operator would go looking for an absent file instead of a stale one.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['npm PATH wrapper — requested (npm_path_wrapper=true) but NEITHER Socket Firewall nor npq was found, so the wrapper was not deployed or refreshed. npm calls are unfiltered. If /usr/local/bin/npm exists from an earlier run it is now stale and warns on every invocation.'] }}
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0
    - sfw_final.rc != 0 or sfw_final.stdout | length == 0
    - npq_final.rc != 0 or npq_final.stdout | length == 0

- name: Record degraded protection — npm wrapper deployed without Socket Firewall
  # Deployed and useful (npq reputation prompts for interactive callers), but
  # non-interactive callers — scripts, agents, CI, the population this role
  # most targets — get the warn-and-passthrough branch. That is a real gap and
  # should not read as full npm coverage.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall threat-intel filtering for npm — the npm PATH wrapper WAS deployed and npq covers interactive callers, but sfw is absent, so non-interactive npm calls (scripts, agents, CI) are passed through unfiltered with a warning.'] }}
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0
    - sfw_final.rc != 0 or sfw_final.stdout | length == 0
    - npq_final.rc == 0
    - npq_final.stdout | length > 0

# --- cargo coverage (sfw supports cargo upstream: `sfw cargo fetch`) ---
# These live HERE, not in tasks/cargo.yml, because sfw is installed above and
# cargo hardening runs earlier in main.yml (:96 vs :153). Checking sfw health
# from cargo.yml reported "absent" on every first apply — sfw genuinely was
# absent at that point, and installed moments later.
# NOTE: a cargo-specific sfw health-check-and-quarantine block lived here and
# was removed. It moved the SHARED /usr/bin/sfw aside when a probe failed,
# which also disarmed the npm wrapper's sfw integration — a cargo-motivated
# guard with a blast radius into another ecosystem. The probe was wrong too:
# `sfw --help` triggers the shim's runtime binary download and exits 1 whenever
# that fetch fails, which is common, so it quarantined healthy installs.
# cargo's sfw prefix now defaults off instead (see cargo_socket_firewall).
