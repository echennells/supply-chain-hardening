---
- name: Check if socket firewall is already installed
  ansible.builtin.command: which sfw
  register: sfw_check
  changed_when: false
  failed_when: false

- name: Check if npm is available for socket install
  # Canonical-path-first detection across system + Node-manager install
  # methods. See tasks/npm.yml for the same logic explained.
  ansible.builtin.shell:
    cmd: |
      for p in /usr/bin/npm /usr/local/bin/npm "$HOME/.volta/bin/npm" "$HOME/.asdf/shims/npm" "$HOME/.nodenv/shims/npm"; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "$HOME"/.nvm/versions/node/*/bin/npm; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "$HOME"/.local/share/fnm/node-versions/*/installation/bin/npm; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v npm 2>/dev/null
    executable: /bin/bash
  register: npm_for_socket
  changed_when: false
  failed_when: false

- name: Check Node.js version (sfw requires >= 20)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      node --version | sed 's/v\([0-9]*\).*/\1/'
    executable: /bin/bash
  register: node_major_version
  changed_when: false
  failed_when: false
  when: npm_for_socket.rc == 0

- name: Install Socket Firewall Free via npm (requires Node >= 20)
  become: true
  ansible.builtin.command: npm install -g sfw@2
  when:
    - sfw_check.rc != 0
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20
  changed_when: true

- name: Warn if Node too old for Socket Firewall
  ansible.builtin.debug:
    msg: "WARNING: Socket Firewall requires Node >= 20 but found Node {{ node_major_version.stdout }}. Skipping sfw install."
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int < 20

- name: Record skipped protection — Socket Firewall (Node too old)
  # Feeds the end-of-run "protections NOT applied" summary in main.yml, so a
  # skip is reported once at the end rather than only as a debug line buried
  # in the task stream.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall (sfw) — requires Node >= 20, found Node ' ~ node_major_version.stdout ~ '. npm installs are not threat-intel filtered.'] }}
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int < 20

- name: Re-check sfw availability after the install attempt
  # The npm PATH wrapper below execs sfw. Gating the wrapper on the ORIGINAL
  # sfw_check (taken before the install) would deploy a wrapper whose helper
  # may never have been installed — e.g. on Node 18, where the install task
  # skips. The wrapper degrades to a per-invocation warning on every npm call,
  # so the operator gets a wrapper that filters nothing. Re-check the real
  # post-install state and let the wrapper depend on it.
  ansible.builtin.command: which sfw
  register: sfw_final
  changed_when: false
  failed_when: false

- name: Ensure sfw cache directory is writable
  become: true
  ansible.builtin.file:
    path: /usr/local/lib/node_modules/sfw/.sfw-cache
    state: directory
    mode: "0755"
  failed_when: false
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20

# --- npm PATH wrapper (opt-in via npm_path_wrapper) ---
# Without this, sfw is installed but never invoked except by callers who
# explicitly type `sfw npm install ...`. The wrapper interposes at the
# PATH level so every npm call (scripts, agents, sudo, package.json
# lifecycles) is routed through sfw.

- name: Find real npm path (excluding /usr/local/bin to avoid wrapper recursion)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -vFx '/usr/local/bin' | tr '\n' ':' | sed 's/:$//')
      PATH="$CLEAN_PATH" command -v npm 2>/dev/null
    executable: /bin/bash
  register: npm_real_path
  changed_when: false
  failed_when: false
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0

- name: Deploy npm PATH wrapper to /usr/local/bin
  become: true
  ansible.builtin.template:
    src: npm-wrapper.sh.j2
    dest: /usr/local/bin/npm
    mode: "0755"
    owner: root
    group: root
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0
    - npm_real_path.rc == 0
    - npm_real_path.stdout | length > 0
    # sfw must actually exist — the wrapper's whole purpose is to route npm
    # through it. Without this, a Node-18 host got a wrapper with no helper.
    - sfw_final.rc == 0

- name: Record skipped protection — npm PATH wrapper (sfw unavailable)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['npm PATH wrapper — requested (npm_path_wrapper=true) but Socket Firewall is not installed, so the wrapper was NOT deployed. npm calls are unfiltered.'] }}
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0
    - sfw_final.rc != 0
