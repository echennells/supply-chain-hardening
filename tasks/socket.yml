---
# sfw_check, npm_for_socket, node_major_version and sfw_cache_reset come from
# tasks/sfw_cache_reset.yml, which tasks/main.yml includes before npm.yml: the
# sfw cache has to be reset before the first root `npm install -g` in the
# play, and npm.yml and npq.yml run theirs before this file. When that include
# did not run (--skip-tags always), it runs here.
- name: Find sfw and reset an sfw cache anyone but root could have written (not done earlier in this run)
  ansible.builtin.include_tasks:
    file: sfw_cache_reset.yml
    apply:
      tags: [socket, npm]
  when: sfw_cache_reset is not defined

- name: Tell whether sfw_version names one release or something only the registry resolves
  # The tasks below compare sfw_version with 2.0.6 and with the installed sfw.
  # A dist-tag or a range (latest, ^2.0.6, 2) has no version to compare, and
  # Ansible's version test raises on a non-numeric one ("Version comparison
  # failed: '<' not supported between instances of 'str' and 'int'"), which
  # failed the play at the first such task and skipped every include after
  # this file (MEASURED: sfw_version=latest and ^2.0.6 over sfw 2.0.6, rc=2).
  # Only an exact X.Y.Z is compared. Anything else is still what the install
  # asks npm for where sfw is absent or older than 2.0.6, as before the version
  # move existed, but it never replaces a working sfw: whether that sfw already
  # satisfies it is the registry's answer, not this role's. The run summary
  # says so.
  ansible.builtin.set_fact:
    sfw_pin_exact: "{{ (sfw_version | string) is match('^[0-9]+[.][0-9]+[.][0-9]+$') }}"

- name: Check that root can run npm (a per-user Node is invisible to become)
  # The install below runs `npm install -g` as root, and root's PATH is sudo's
  # secure_path, not the user's shell. On a host whose only Node is per-user
  # (fnm, nvm, volta, asdf) the detection in sfw_cache_reset.yml finds the
  # user's npm but root cannot run it (MEASURED on fnm: not found under sudo),
  # so the install failed
  # and was recorded as "install failed", which sends the reader after the wrong
  # problem. Running the user's npm as root is not the fix: root would execute
  # files the user can edit. Skip the install and say why instead.
  become: true
  ansible.builtin.shell:
    cmd: |
      # Found by root AND owned by root. Where sudoers sets no secure_path, root
      # keeps the applying user's PATH and finds the per-user npm after all;
      # running that as root would execute files the user can edit.
      npm_path=$(command -v npm) || exit 1
      for p in "$npm_path" "$(command -v node)"; do
        [ -n "$p" ] || continue
        real=$(readlink -f "$p")
        [ "$(stat -c %u "$real" 2>/dev/null)" = 0 ] || { echo "$real"; exit 3; }
      done
    executable: /bin/bash
  register: npm_root_for_socket
  changed_when: false
  check_mode: false
  failed_when: false
  # Also when sfw is present: the version probe below runs root's npm too.
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20

- name: Detect the sfw the install below would replace (reinstall when sfw_version moves)
  # The install used to run only when sfw was absent (or older than 2.0.6), so
  # bumping sfw_version never reached a host that already had sfw (MEASURED on
  # 6c77f4e: an installed sfw whose version differed from sfw_version, in either
  # direction, was left as it was, changed=0). This reads the version of the
  # sfw root runs, the one the wrappers and the warm below use.
  #
  # The install replaces that sfw WHERE IT IS. MEASURED 2026-11-20 on a live
  # Ubuntu 24.04 host with NodeSource Node 24: sfw 2.0.4 sat under /usr/local
  # (installed by an earlier role run with Ubuntu's apt npm, whose prefix is
  # /usr/local), and root's npm, now NodeSource's, has prefix /usr. The
  # replacement went to npm's own prefix, /usr/lib/node_modules and
  # /usr/bin/sfw; root's PATH still found /usr/local/bin/sfw 2.0.4 first, so
  # the warm moved it aside as still too old, the run summary said the
  # replacement "left it unchanged: sfw_version must be 2.0.6 or later" (false),
  # and the 2.0.6 was neither warmed nor checked until the next apply. So the
  # probe prints the npm prefix that sfw lives under (npm's global layout is
  # <prefix>/lib/node_modules/sfw) when it is not root's npm's own, and the
  # install passes it to npm. It passes the globalconfig root's npm reads by
  # default with it: npm derives that file from the prefix, so --prefix alone
  # would install without the role's global npmrc (MEASURED, npm 10.9.9 on
  # NodeSource: `--prefix /usr/local` moves globalconfig from /usr/etc/npmrc
  # to /usr/local/etc/npmrc).
  #
  # `aside=` is an sfw an earlier apply moved aside (sfw -> sfw.broken, in the
  # directory root found it in) because its firewall binary could not be
  # fetched or run. With no sfw on root's PATH, that is the one the install
  # replaces. The install still runs over it, to retry with a fresh package
  # directory, but it only counts as a change when that retry leaves a working
  # sfw (see the warm). MEASURED on 6c77f4e with GitHub unreachable: every
  # re-apply reinstalled, failed the warm, moved sfw aside again and reported
  # changed=1, ending where it began.
  #
  # Only an sfw root owns, as the cache reset requires of the one it runs:
  # root's npm writes the replacement into its directory. Anything else prints
  # nothing here, and the install (when sfw is absent for the applying user)
  # goes to npm's own prefix, as before.
  become: true
  ansible.builtin.shell:
    cmd: |
      set -u
      d=$(mktemp -d) && cd "$d" || exit 0
      trap 'cd / && rm -rf -- "$d"' EXIT
      p=$(command -v sfw 2>/dev/null) || p=""
      aside=""
      if [ -z "$p" ]; then
        IFS=:
        for dir in $PATH; do
          if [ -e "$dir/sfw.broken" ] || [ -L "$dir/sfw.broken" ]; then
            p=$dir/sfw.broken; aside=1; break
          fi
        done
        unset IFS
      fi
      [ -n "$p" ] || exit 0
      shim=$(readlink -f "$p") || exit 0
      pkg=${shim%/*}; pkg=${pkg%/*}
      [ -f "$pkg/package.json" ] || exit 0
      # The npm package's own manifest, not any package.json that happens to
      # sit two levels above some other program called sfw.
      grep -Eq '^ *"name": *"sfw"' "$pkg/package.json" || exit 0
      [ "$(stat -c %u "$shim")" = 0 ] && [ "$(stat -c %u "$pkg")" = 0 ] || exit 0
      echo "version=$(sed -nE 's/^ *"version": *"([^"]+)".*/\1/p' "$pkg/package.json" | head -n 1)"
      [ -z "$aside" ] || echo "aside=$p"
      own=$(npm prefix -g 2>/dev/null) || own=""
      # target= is where the install below really goes: the old sfw's prefix
      # only when the prefix= and globalconfig= lines it passes to npm were
      # printed, npm's own prefix otherwise.
      target=$own
      case "$pkg" in
        */lib/node_modules/sfw)
          prefix=${pkg%/lib/node_modules/sfw}
          if [ -n "$prefix" ] && [ -n "$own" ] && [ "$(readlink -f "$prefix")" != "$(readlink -f "$own")" ]; then
            gc=$(npm config get globalconfig 2>/dev/null) || gc=""
            if [ -n "$gc" ]; then
              echo "prefix=$prefix"; echo "globalconfig=$gc"; target=$prefix
            fi
          fi
          ;;
      esac
      echo "target=$target"
    executable: /bin/bash
  register: sfw_installed
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20
    - npm_root_for_socket.rc | default(1) == 0

- name: Work out whether this run installs sfw, and whether that only retries one moved aside
  ansible.builtin.set_fact:
    sfw_installed_version: >-
      {{ sfw_installed.stdout | default('') | regex_search('^version=(.*)$', '\1', multiline=True)
         | default([''], true) | first | default('', true) | trim }}
    # A bump or a pin-down. Never to a version below 2.0.6, which the wrappers
    # cannot use (the old-shim path below handles an sfw_version that low), and
    # never over an sfw the reset did not trust: the install runs root's npm,
    # which on a hardened host is the npm wrapper, which runs sfw. Only for an
    # exact sfw_version (sfw_pin_exact): Jinja's `and` stops at the first false
    # operand, so the version test never sees a dist-tag or a range.
    sfw_version_moved: >-
      {{ sfw_pin_exact | bool
         and (sfw_installed.stdout | default('') | regex_search('^version=(.*)$', '\1', multiline=True)
          | default([''], true) | first | default('', true) | trim) not in ['', sfw_version | string]
         and sfw_version is version('2.0.6', '>=')
         and sfw_cache_reset.stdout | default('') is not search('^(would-reset|reset-failed|not-root-owned) ', multiline=True) }}
    # sfw_version is installed, only moved aside by an earlier apply. For a
    # dist-tag or a range, any sfw moved aside counts: the role cannot tell
    # whether it satisfies the pin, and a retry that fails again changes nothing.
    sfw_retry_aside: >-
      {{ sfw_installed.stdout | default('') is search('^aside=', multiline=True)
         and (not (sfw_pin_exact | bool)
              or (sfw_installed.stdout | default('') | regex_search('^version=(.*)$', '\1', multiline=True)
                  | default([''], true) | first | default('', true) | trim) == sfw_version | string) }}
    # Where the install puts sfw: the prefix of the sfw it replaces, when that is
    # not root's npm's own (see the probe), with the globalconfig npm would
    # otherwise read. Empty: npm's own prefix, as for a fresh install.
    sfw_install_target: >-
      {{ sfw_installed.stdout | default('') | regex_search('^target=(.*)$', '\1', multiline=True)
         | default([''], true) | first | default('', true) | trim }}
    sfw_install_argv: >-
      {{ ['npm', 'install', '-g', '--ignore-scripts']
         + ((['--prefix', sfw_installed.stdout | regex_search('^prefix=(.*)$', '\1', multiline=True) | first | trim,
              '--globalconfig', sfw_installed.stdout | regex_search('^globalconfig=(.*)$', '\1', multiline=True) | first | trim])
            if (sfw_installed.stdout | default('') is search('^prefix=.', multiline=True)
                and sfw_installed.stdout | default('') is search('^globalconfig=.', multiline=True)) else [])
         + ['sfw@' ~ sfw_version] }}
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20

# The records up to the install are not protections that were skipped: a
# working sfw is in use in each case. They go to sch_apply_notes, which the run
# summary lists apart from the NOT-applied count (tasks/main.yml), so the
# operator sees that sfw_version was not honoured without being told a
# protection is missing.
- name: Record that an sfw_version below 2.0.6 left a newer sfw in place
  ansible.builtin.set_fact:
    sch_apply_notes: >-
      {{ (sch_apply_notes | default([])) + ['Socket Firewall — sfw_version=' ~ sfw_version ~ ' is below 2.0.6, which the npm and cargo wrappers need, so the installed sfw ' ~ sfw_installed_version ~ ' was left in place rather than replaced with it, and is in use.'] }}
  when:
    - sfw_pin_exact | bool
    # Starts with X.Y.Z, so the loose comparison below decides on those three
    # numbers and never meets a string where the other side has a number.
    - sfw_installed_version | default('') is match('[0-9]+[.][0-9]+[.][0-9]+')
    - sfw_installed_version | default('') != sfw_version | string
    - sfw_version is version('2.0.6', '<')
    - sfw_installed_version is version('2.0.6', '>=')

- name: Record that an sfw_version naming no single release left the installed sfw in place
  ansible.builtin.set_fact:
    sch_apply_notes: >-
      {{ (sch_apply_notes | default([])) + ['Socket Firewall — sfw_version=' ~ sfw_version ~ ' is not a plain X.Y.Z version (it is, say, a dist-tag or a range, which only the registry resolves), so the role cannot tell whether the installed sfw ' ~ sfw_installed_version ~ ' already satisfies it; that sfw was kept and is in use. A re-apply installs sfw_version only where sfw is absent or older than 2.0.6; pin an X.Y.Z version to move a working sfw to it.'] }}
  when:
    - not (sfw_pin_exact | bool)
    - sfw_installed_version | default('') | length > 0
    # Not when the install runs anyway (sfw absent for the applying user, or
    # older than 2.0.6): then this pin is what it installs.
    - sfw_check.rc == 0
    - sfw_cache_reset.stdout | default('') is not search('^old-shim ', multiline=True)

- name: Record what a real run would install over a working sfw (a --check run does not)
  # The install below is a command, which --check skips (changed=0), so a dry
  # run over an sfw at another version than sfw_version looked converged.
  ansible.builtin.set_fact:
    sch_apply_notes: >-
      {{ (sch_apply_notes | default([])) + ['Socket Firewall — this --check run did not replace the installed sfw ' ~ sfw_installed_version ~ ' with sfw_version ' ~ sfw_version ~ '; a real run would.'] }}
  when:
    - ansible_check_mode
    - sfw_version_moved | default(false) | bool
    - sfw_check.rc == 0
    - sfw_cache_reset.stdout | default('') is not search('^old-shim ', multiline=True)
    - npm_root_for_socket.rc | default(1) == 0

- name: Install Socket Firewall Free via npm (requires Node >= 20)
  # NON-FATAL BY DESIGN. An optional scanner failing to install must never
  # abort the play: the config-file layer is the load-bearing protection and
  # every include after this one would be skipped. Measured consequence of the
  # old behavior: on stock Ubuntu 22.04 / Debian 12 the Go tool install killed
  # 11 downstream includes, including the entire env-var layer. The failure is
  # recorded below instead, so it is reported rather than fatal or silent.
  become: true
  # --ignore-scripts: dogfood the script-block on the role's own install. Safe for
  # sfw despite it fetching a firewall binary: that fetch is lazy at first runtime,
  # not a postinstall — if it WERE a postinstall it would already be blocked on
  # every npm >=12 host by native allowScripts (which the role supports), so sfw
  # cannot depend on an install-time script. Universal CLI flag across npm versions.
  #
  # Also run over an sfw older than 2.0.6 (the reset says "old-shim"):
  # the wrappers depend on SFW_SKIP_UPDATE_CHECK, which only 2.0.6 reads. npm
  # replaces the package directory, so the cache goes with it and the warm
  # below downloads the binary again (MEASURED from 2.0.4 to 2.0.6).
  #
  # And over an sfw whose version is not sfw_version, either way (see the
  # version probe above). A retry over one an earlier apply moved aside, at the
  # same version, is reported by the warm instead: it changed something only if
  # sfw works afterwards.
  #
  # Into the prefix of the sfw it replaces (sfw_install_argv, from the probe).
  #
  # umask 022: see "Install lockfile-lint globally" in tasks/npm.yml. A 0777
  # package directory here undoes the cache reset above: whoever can write it
  # can rename .sfw-cache and put their own in its place.
  ansible.builtin.command:
    argv: "{{ ['sh', '-c', 'umask 022 && exec \"$@\"', 'sch-umask'] + (sfw_install_argv | default(['npm', 'install', '-g', '--ignore-scripts', 'sfw@' ~ sfw_version], true)) }}"
  when:
    - >-
      sfw_check.rc != 0
      or sfw_cache_reset.stdout | default('') is search('^old-shim ', multiline=True)
      or sfw_version_moved | default(false) | bool
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20
    - npm_root_for_socket.rc | default(1) == 0
  changed_when:
    - sfw_install.rc | default(1) == 0
    - not (sfw_retry_aside | default(false) | bool)
  register: sfw_install
  failed_when: false

- name: Include the pinned firewall binary (for an sfw that has none cached)
  # Before the warm, so that a first install runs the pin and needs no GitHub
  # API call. Not over a cache the reset did not trust or an sfw root does not
  # own (the warm's rule), only where root runs a Node it owns, and never in a
  # --check run.
  ansible.builtin.include_tasks:
    file: sfw_seed.yml
    apply:
      tags: [socket, npm]
  when:
    - sfw_binary_pin | bool
    - not ansible_check_mode
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20
    - npm_root_for_socket.rc | default(1) == 0
    - sfw_cache_reset.stdout | default('') is not search('^(would-reset|reset-failed|not-root-owned) ', multiline=True)

- name: Move sfw aside when its pinned firewall binary did not match
  # sfw has nothing cached here, so left in place it would fetch a binary itself
  # on root's next npm or cargo call (see sfw_seed.yml). Not run, not warmed. The
  # next apply reinstalls it and downloads the pin again; that retry counts as no
  # change, because it ends where it began.
  become: true
  ansible.builtin.shell:
    cmd: P=$(command -v sfw 2>/dev/null) || exit 0; mv -f "$P" "$P.broken"
    executable: /bin/bash
  register: sfw_refused_aside
  changed_when:
    - sfw_refused_aside.rc == 0
    - not (sfw_retry_aside | default(false) | bool)
  failed_when: false
  when:
    - not ansible_check_mode
    - sfw_seed_refused | default('', true) | length > 0

- name: Record skipped protection — the pinned Socket Firewall binary was refused
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — REFUSED: the pinned firewall binary (sfw_binary_version ' ~ sfw_binary_version ~ ') is not the file its checksum names: ' ~ sfw_seed_refused ~ '. It was not run, and sfw was ' ~ ('moved aside' if sfw_refused_aside.rc | default(1) == 0 else 'NOT moved aside (exit ' ~ (sfw_refused_aside.rc | default('?') | string) ~ '), so do that by hand') ~ ' rather than left to fetch another one, so npm and cargo run unfiltered. A damaged download looks the same: re-apply once. If it happens again and you did not change sfw_binary_version or sfw_binary_checksums, the release may have been replaced; ask before you use it. sfw_binary_pin=false goes back to the download sfw does itself.'] }}
  when: sfw_seed_refused | default('', true) | length > 0

- name: Warm the Socket Firewall binary cache at apply time
  # sfw's npm package is a SHIM: the actual firewall binary is downloaded from
  # GitHub on first invocation, not at npm-install time. Left cold, that
  # download happens during someone's first real npm or cargo command — where
  # it can hang, or fail and take the command with it.
  #
  # Doing it here makes the fetch deterministic (once, at apply, where a
  # failure is visible and recorded) instead of a surprise in a build. It also
  # replaces an accidental warm-up: a health-check task used to run `sfw --help`
  # for other reasons and pulled the binary down as a side effect. Removing that
  # check silently un-warmed every host, which surfaced as npm tests hanging on
  # a cold cache — a dependency on a side effect nobody had written down.
  #
  # NON-FATAL. If sfw cannot be prepared, MOVE IT ASIDE (sfw -> sfw.broken) so
  # `command -v sfw` fails and BOTH the npm and cargo wrappers fall through to
  # their pass-through-with-warning path. This is not a blast radius — it is the
  # correct, consistent behaviour: a genuinely non-runnable sfw would break
  # EITHER tool that routed through it, so neither should. (An earlier version
  # refused to move it aside, and separately a cargo-only quarantine used
  # `sfw --help` as its probe, which triggers the binary download and
  # false-positived on healthy hosts. `sfw /bin/true` is the right probe: it is
  # exactly what the wrappers do, so it cannot disagree with real usage.)
  #
  # Self-healing: a quarantined sfw makes the next apply's `command -v sfw` fail,
  # which re-triggers the install-and-warm above.
  become: true
  ansible.builtin.shell:
    cmd: |
      # Capture sfw's real exit code and error text. The old form
      # (`sfw /bin/true >/dev/null 2>&1 … echo broken`) discarded stderr and
      # ended on `echo`, so the shell's rc was ALWAYS 0 — a GitHub 403 while
      # fetching the firewall binary was quarantined fail-open but recorded as
      # "exit 0" with no reason. Surface both: stdout still ends in ok/broken for
      # the recorder, the diagnostic goes to stderr, and the shell exits with
      # sfw's real code so `sfw_warm.rc` is truthful.
      # Nothing to warm when root cannot see sfw: the install was skipped or
      # failed (each has its own record), or sfw exists only on the applying
      # user's PATH. Carrying on recorded "installed, but its runtime binary could
      # not be fetched from GitHub (exit 127)" for an sfw root never had.
      P=$(command -v sfw 2>/dev/null) || { echo absent; exit 0; }
      # The path root ran, for the non-root check below. The LAST line stays
      # ok/broken/old/absent for the recorders.
      echo "path=$P"
      # Still older than 2.0.6 after the install above (it failed, was
      # skipped, or sfw_version pins an older release): it ignores the
      # SFW_SKIP_UPDATE_CHECK the wrappers set, so every non-root call through
      # it would fail an hour after each update check. Move it aside, as for a
      # failed warm, and record why. Not in a --check run. `next=` is the sfw
      # root finds once it is aside (the one the install above put elsewhere,
      # when this one shadowed it), which this run does not warm.
      shim=$(readlink -f "$P"); pkg=${shim%/*}; pkg=${pkg%/*}
      if [ -f "$pkg/package.json" ] && ! grep -q SFW_SKIP_UPDATE_CHECK "$shim"; then
        echo "version=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' "$pkg/package.json" | head -n 1)"
        {{ 'true' if ansible_check_mode else 'mv -f "$P" "$P.broken" 2>/dev/null && { n=$(command -v sfw 2>/dev/null) && echo "next=$n"; }' }}
        echo old
        exit 0
      fi
      {% if ansible_check_mode %}
      # A --check run changes nothing. With nothing cached sfw would download
      # 137 MB to answer, and one that could not was moved aside (MEASURED with
      # the API refused: a working sfw was gone and the recap said changed=0).
      if [ ! -e "$pkg/.sfw-cache/latest" ]; then echo cold; exit 0; fi
      {% endif %}
      # umask 022: sudo applies the union of the caller's umask and its own, so
      # a caller with umask 077 would leave the downloaded binary in a 0700
      # directory that no other account can reach.
      umask 022
      # Whichever `true` exists, as the action does (macOS has no /bin/true).
      true_bin=/usr/bin/true; [ -x "$true_bin" ] || true_bin=/bin/true
      # 600 s, as supply-chain-age-gate-refresh --sfw allows for the same
      # download. The binary is 137 MB; MEASURED from one test host the
      # download alone took 81.6 s (1.68 MB/s), and with other downloads
      # running at the same time it ran out at 120 s four times and at 180 s
      # once (rc=124). Each time a working sfw was moved aside until the next
      # apply. Waiting longer costs only time when GitHub hangs.
      #
      # SFW_SKIP_UPDATE_CHECK=1 only over the pinned binary this run put in the
      # cache: an update check would move it to whatever is newest at once, so
      # the host's first install would not be the pin. The refresh timer and a
      # later apply make that check. And in a --check run, because it writes.
      if out=$({{ 'SFW_SKIP_UPDATE_CHECK=1 ' if (sfw_seeded | default(false) | bool or ansible_check_mode) else '' }}timeout 600 sfw "$true_bin" 2>&1); then
        echo ok
      else
        rc=$?
        {{ ':' if ansible_check_mode else 'mv -f "$P" "$P.broken" 2>/dev/null || true' }}
        # The LAST non-blank line is sfw's own error; a spinner can come first.
        printf '%s\n' "$(printf '%s' "$out" | grep -v '^[[:space:]]*$' | tail -n 1 | tr -cd '[:print:]' | cut -c1-300)" >&2
        echo broken
        exit "$rc"
      fi
    executable: /bin/bash
  register: sfw_warm
  # Changed only when it brings back an sfw an earlier apply moved aside (the
  # install above reinstalled it without counting that as a change), or runs the
  # pinned binary sfw_seed.yml put in the cache (nor does that count one).
  # check_mode: false so a --check run gets a real answer rather than a skipped
  # task and an undefined register.
  changed_when: >-
    (sfw_warm.stdout_lines | default([], true) | last | default('')) == 'ok'
    and (sfw_seeded | default(false) | bool
         or (sfw_retry_aside | default(false) | bool
             and sfw_install is defined and sfw_install is not skipped
             and sfw_install.rc | default(1) == 0))
  check_mode: false
  failed_when: false
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int >= 20
    # Never run sfw as root over a cache the reset found untrusted and
    # did not remove (a --check run, or the removal failed), or over an sfw
    # root does not own.
    - sfw_cache_reset.stdout | default('') is not search('^(would-reset|reset-failed|not-root-owned) ', multiline=True)
    # Nor let it fetch a binary itself after the pinned one was refused.
    - sfw_seed_refused | default('', true) | length == 0

- name: Record that a --check run left an empty sfw cache alone
  ansible.builtin.set_fact:
    sch_apply_notes: >-
      {{ (sch_apply_notes | default([])) + ['Socket Firewall — sfw has no firewall binary cached; this --check run downloaded none. A real run would.'] }}
  when:
    - ansible_check_mode
    - sfw_warm is defined
    - (sfw_warm.stdout_lines | default([], true) | last | default('')) == 'cold'

- name: Check that a non-root caller can run the warmed sfw
  # Parity with the action (install_sfw_and_wrap in action/harden.sh): warm as
  # root, then run sfw the way the wrappers run it for an ordinary account,
  # with SFW_SKIP_UPDATE_CHECK=1 and no write access to the root-owned cache.
  # That is the state every non-root npm and cargo call through sfw is in, so
  # if it fails here it would fail in each of them, in sfw's words, not ours.
  # Skipped when the role is applied as root: the warm already ran as root.
  become: false
  ansible.builtin.shell:
    cmd: |
      true_bin=/usr/bin/true; [ -x "$true_bin" ] || true_bin=/bin/true
      if out=$(SFW_SKIP_UPDATE_CHECK=1 timeout 120 {{ sfw_warm.stdout_lines[0][5:] | quote }} "$true_bin" 2>&1); then
        echo ok
      else
        rc=$?
        printf 'sfw failed as %s (rc=%s): %s\n' "$(id -un)" "$rc" "$(printf '%s' "$out" | grep -v '^[[:space:]]*$' | tail -n 1)" >&2
        echo broken
        exit "$rc"
      fi
    executable: /bin/bash
  register: sfw_user_check
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - sfw_warm is defined
    - (sfw_warm.stdout_lines | default([], true) | last | default('')) == 'ok'
    - (sfw_warm.stdout_lines | first) is match('path=/')
    - preflight_invoking_user.stdout | default('root') | trim != 'root'

- name: Move sfw aside when a non-root caller cannot run it
  # Same degradation as a failed warm: with sfw gone from PATH, the npm and
  # cargo wrappers pass through with a warning instead of failing every call.
  become: true
  ansible.builtin.command:
    argv: [mv, -f, "{{ sfw_warm.stdout_lines[0][5:] }}", "{{ sfw_warm.stdout_lines[0][5:] }}.broken"]
  changed_when: true
  failed_when: false
  when:
    - sfw_user_check is defined
    - sfw_user_check.stdout | default('') | trim == 'broken'

- name: Record skipped protection — Socket Firewall cannot run for a non-root caller
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — prepared as root, but ' ~ (preflight_invoking_user.stdout | trim) ~ ' cannot run it (exit ' ~ (sfw_user_check.rc | default("?") | string) ~ ': ' ~ (sfw_user_check.stderr | default('') | trim) ~ '). It was moved aside so npm and cargo keep working, unfiltered. Check the permissions on ' ~ (sfw_cache_reset.stdout | default('') | regex_search('/[^ :]*\.sfw-cache') | default('the sfw cache', true)) ~ ' and its parents, then re-apply.'] }}
  when:
    - sfw_user_check is defined
    - sfw_user_check.stdout | default('') | trim == 'broken'

- name: Record skipped protection — Socket Firewall binary could not be fetched
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — installed, but its runtime binary could not be fetched from GitHub (exit ' ~ (sfw_warm.rc | default("?") | string) ~ ((': ' ~ (sfw_warm.stderr | trim)) if (sfw_warm.stderr | default('', true) | trim | length > 0) else '') ~ '). ' ~ (('The pinned ' ~ sfw_binary_version ~ ' was not used either: ' ~ sfw_seed_why ~ '. ') if (sfw_seed_why | default('', true) | length > 0) else '') ~ 'sfw is a shim that downloads the firewall on first use; until that succeeds every `sfw <cmd>` exits non-zero. npm calls fall back to npq where available. Re-apply once connectivity is restored.'] }}
  when:
    - sfw_warm is defined
    - (sfw_warm.stdout_lines | default([], true) | last | default('')) == 'broken'
    - not (sfw_seeded | default(false) | bool)

- name: Record skipped protection — the pinned Socket Firewall binary does not run
  # Nothing was fetched from GitHub by sfw here, and reachability is not the
  # problem: the pinned file arrived and its SHA-256 matched.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — installed, with the pinned firewall binary ' ~ sfw_binary_version ~ ' in its cache, but sfw could not run it (exit ' ~ (sfw_warm.rc | default("?") | string) ~ ((': ' ~ (sfw_warm.stderr | trim)) if (sfw_warm.stderr | default('', true) | trim | length > 0) else '') ~ '). sfw was moved aside so npm and cargo keep working, unfiltered. npm calls fall back to npq where available.'] }}
  when:
    - sfw_warm is defined
    - (sfw_warm.stdout_lines | default([], true) | last | default('')) == 'broken'
    - sfw_seeded | default(false) | bool

# sfw works, so this is not a missing protection (see sch_apply_notes in
# tasks/main.yml): the host runs the release sfw fetched, not the pinned one.
- name: Record that the pinned Socket Firewall binary was not used
  ansible.builtin.set_fact:
    sch_apply_notes: >-
      {{ (sch_apply_notes | default([])) + ['Socket Firewall — the pinned firewall binary (sfw_binary_version ' ~ sfw_binary_version ~ ') was not used: ' ~ sfw_seed_why ~ '. sfw downloaded its current release itself, and that one is in use.'] }}
  when:
    - sfw_warm is defined
    - (sfw_warm.stdout_lines | default([], true) | last | default('')) == 'ok'
    - not (sfw_seeded | default(false) | bool)
    - sfw_seed_why | default('', true) | length > 0

- name: Record skipped protection — Socket Firewall older than 2.0.6
  vars:
    sfw_old_path: "{{ sfw_warm.stdout_lines[0][5:] }}"
    sfw_old_version: >-
      {{ sfw_warm.stdout | regex_search('^version=(.*)$', '\1', multiline=True) | default(['unknown'], true) | first | default('unknown', true) }}
    # The sfw root finds now that this one is aside (see the warm).
    sfw_next_path: >-
      {{ sfw_warm.stdout | regex_search('^next=(.*)$', '\1', multiline=True) | default([''], true) | first | default('', true) | trim }}
    sfw_install_where: "{{ sfw_install_target | default('', true) | default(\"root's npm prefix\", true) }}"
    # What happened to the replacement, and what to do. Only an exact
    # sfw_version is compared with 2.0.6 (sfw_pin_exact): a dist-tag or a
    # range may have resolved to anything.
    sfw_old_outcome: >-
      {%- if ansible_check_mode -%}
      This --check run changed nothing: a real run replaces it with sfw@{{ sfw_version }}, and moves it aside only if it is still older than 2.0.6.
      {%- elif sfw_install is not defined or sfw_install is skipped -%}
      It was not replaced (see the other Socket Firewall entries). It was moved aside so npm and cargo keep working, unfiltered. Install sfw 2.0.6 or later as root and re-apply.
      {%- elif (sfw_install.rc | default(0)) != 0 -%}
      Replacing it with sfw@{{ sfw_version }} failed (exit {{ sfw_install.rc }}). It was moved aside so npm and cargo keep working, unfiltered. Install sfw 2.0.6 or later as root and re-apply.
      {%- elif sfw_pin_exact | bool and sfw_version is version('2.0.6', '<') -%}
      Replacing it with sfw@{{ sfw_version }} left it unchanged: sfw_version must be 2.0.6 or later. It was moved aside so npm and cargo keep working, unfiltered. Set sfw_version to 2.0.6 or later, or install sfw 2.0.6 or later as root, and re-apply.
      {%- else -%}
      {%- if sfw_pin_exact | bool -%}
      sfw@{{ sfw_version }} was installed under {{ sfw_install_where }}, but root still found this older sfw first on its PATH.
      {%- else -%}
      sfw@{{ sfw_version }} was installed under {{ sfw_install_where }}, but root still found this older sfw first on its PATH: {{ sfw_version }} resolved to a release below 2.0.6, or the new copy is behind this one on root's PATH.
      {%- endif %} It was moved aside to {{ sfw_old_path }}.broken
      {%- if sfw_next_path | length > 0 -%}
      , and root now runs {{ sfw_next_path }}, which this run did not warm: until a re-apply warms and checks it, other accounts' npm and cargo calls through sfw run unfiltered with a warning, and root's first one downloads its firewall binary. Re-apply to finish.
      {%- elif sfw_pin_exact | bool -%}
      , so npm and cargo keep working, unfiltered, and root's PATH reaches no other sfw. Install sfw {{ sfw_version }} where the old one was, as root, or put the new copy on root's PATH, and re-apply.
      {%- else -%}
      , so npm and cargo keep working, unfiltered. Pin sfw_version to 2.0.6 or later and re-apply.
      {%- endif -%}
      {%- endif -%}
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — sfw ' ~ sfw_old_version ~ ' at ' ~ sfw_old_path ~ ' predates 2.0.6, so it ignores SFW_SKIP_UPDATE_CHECK, which the npm and cargo wrappers set so that a non-root caller never writes its root-owned cache. With it, every non-root npm and cargo call through sfw fails from an hour after each update check ("[sfw] Failed to prepare firewall binary: EACCES ... next-check"). ' ~ sfw_old_outcome] }}
  when:
    - sfw_warm is defined
    - (sfw_warm.stdout_lines | default([], true) | last | default('')) == 'old'

# The install runs over a working sfw whenever sfw_version moves. When that
# install fails (a version that is not published, the registry unreachable),
# npm leaves the old package where it was: MEASURED with sfw 2.0.6 installed
# and sfw_version=2.0.99, the warm ran the old /usr/bin/sfw (ok) and another
# account's npm install still went through it. "install failed. npm installs
# are not threat-intel filtered" was then false on every apply. So a failed
# install counts as a lost protection only when no working sfw is left: the
# warm did not end ok, or a non-root caller could not run it.
- name: Work out whether a failed sfw install left a working sfw in use
  ansible.builtin.set_fact:
    sfw_failed_install_kept: >-
      {{ sfw_install is defined and sfw_install is not skipped
         and (sfw_install.rc | default(0)) != 0
         and (sfw_warm.stdout_lines | default([], true) | last | default('')) == 'ok'
         and (sfw_warm.stdout_lines | default([''], true) | first) is match('path=/')
         and (sfw_user_check.stdout | default('') | trim) != 'broken' }}

- name: Record skipped protection — Socket Firewall (install failed)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — install failed. npm installs are not threat-intel filtered.'] }}
  when:
    - sfw_install is defined
    - sfw_install.rc | default(0) != 0
    - not (sfw_failed_install_kept | bool)

- name: Record that a failed sfw install left the sfw it was replacing in use
  ansible.builtin.set_fact:
    sch_apply_notes: >-
      {{ (sch_apply_notes | default([])) + ['Socket Firewall — ' ~ (('replacing sfw ' ~ sfw_installed_version ~ ' with sfw_version ' ~ sfw_version) if (sfw_version_moved | default(false) | bool) else ('installing sfw@' ~ sfw_version)) ~ ' failed (exit ' ~ (sfw_install.rc | string) ~ '); ' ~ (('sfw ' ~ sfw_installed_version) if (sfw_installed_version | default('') | length > 0) else 'the sfw already there') ~ ' at ' ~ sfw_warm.stdout_lines[0][5:] ~ ' is still installed and in use. Check that sfw_version names a published release and that root can reach the registry, then re-apply.'] }}
  when: sfw_failed_install_kept | bool

- name: Record skipped protection — Socket Firewall (npm is per-user)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall — not installed: ' ~ (('root would run ' ~ (npm_root_for_socket.stdout | trim) ~ ', which root does not own (sudo kept the PATH of whoever applied the role), and the role does not run a user-writable program as root') if npm_root_for_socket.rc == 3 else ('the only npm found is ' ~ (npm_for_socket.stdout | trim) ~ ', which root cannot run (a per-user Node such as fnm, nvm, volta or asdf)')) ~ '. sfw installs system-wide, so it needs a system-wide Node; while the version manager stays first on PATH the npm wrapper is shadowed anyway (docs/limitations.md). npm installs are not threat-intel filtered.'] }}
  when:
    - npm_root_for_socket is defined
    - npm_root_for_socket.rc is defined
    - npm_root_for_socket.rc != 0
    # The check now runs with sfw present too (for the version probe); this
    # entry says "not installed", so only when sfw is absent or must be replaced.
    - sfw_check.rc != 0 or sfw_cache_reset.stdout | default('') is search('^old-shim ', multiline=True)

- name: Warn if Node too old for Socket Firewall
  ansible.builtin.debug:
    msg: "WARNING: Socket Firewall requires Node >= 20 but found Node {{ node_major_version.stdout | trim | default('<undetected>', true) }}. Skipping sfw install."
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int < 20

- name: Record skipped protection — Socket Firewall (Node too old)
  # Feeds the end-of-run "protections NOT applied" summary in main.yml, so a
  # skip is reported once at the end rather than only as a debug line buried
  # in the task stream.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall (sfw) — requires Node >= 20, found Node ' ~ (node_major_version.stdout | trim | default('<undetected>', true)) ~ '. npm installs are not threat-intel filtered.'] }}
  when:
    - npm_for_socket.rc == 0
    - node_major_version.stdout | int < 20

- name: Re-check sfw availability after the install attempt
  # The npm PATH wrapper below execs sfw. Gating the wrapper on the ORIGINAL
  # sfw_check (taken before the install) would deploy a wrapper whose helper
  # may never have been installed — e.g. on Node 18, where the install task
  # skips. The wrapper degrades to a per-invocation warning on every npm call,
  # so the operator gets a wrapper that filters nothing. Re-check the real
  # post-install state and let the wrapper depend on it.
  #
  # DETECTION MUST BE AS ROBUST AS THE npm DETECTOR ABOVE.
  # This result gates the wrapper (jointly with the npq probe below) and drives
  # what the coverage summary reports, so a false negative here degrades a
  # protection AND emits a message asserting the opposite of the truth. A bare
  # `which sfw` is not good enough:
  #   - it runs WITHOUT become, while the install above runs WITH become
  #     (`npm install -g sfw@2` lands in root's npm prefix), and
  #   - it trusts the ambient PATH, which this very file distrusts for npm.
  # On nvm / volta / fnm / asdf hosts — the exact managers the npm detector
  # enumerates — or wherever /usr/local/bin is absent from Ansible's PATH,
  # bare `which` reports "missing" for an sfw that is installed.
  # Canonical-path-first, then an augmented-PATH fallback.
  ansible.builtin.shell:
    cmd: |
      for p in /usr/local/bin/sfw /usr/bin/sfw "$HOME/.local/bin/sfw" \
               "$HOME/.volta/bin/sfw" "$HOME/.asdf/shims/sfw" "$HOME/.nodenv/shims/sfw"; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "$HOME"/.nvm/versions/node/*/bin/sfw; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "${FNM_DIR:-$HOME/.local/share/fnm}"/node-versions/*/installation/bin/sfw "$HOME"/.local/share/fnm/node-versions/*/installation/bin/sfw "$HOME"/.fnm/node-versions/*/installation/bin/sfw; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v sfw 2>/dev/null
    executable: /bin/bash
  register: sfw_final
  changed_when: false
  check_mode: false
  failed_when: false

# --- npm PATH wrapper (opt-in via npm_path_wrapper) ---
# Without this, sfw is installed but never invoked except by callers who
# explicitly type `sfw npm install ...`. The wrapper interposes at the
# PATH level so every npm call (scripts, agents, sudo, package.json
# lifecycles) is routed through sfw.

- name: Find real npm path (symlink-aware, with wrapper-recursion guard)
  # Previous logic blanket-excluded /usr/local/bin from PATH search and
  # relied on /usr/bin/npm or ~/.{volta,asdf,nodenv,nvm,fnm}/.../npm being
  # present. That misses a common sysadmin install pattern: Node tarball
  # extracted to /opt/node-X/, symlinked into /usr/local/bin/npm.
  # /opt/node-X/bin isn't in PATH and isn't in our static fallback list,
  # so npm_real_path comes back empty and the wrapper never deploys.
  #
  # Better: check whether /usr/local/bin/npm IS a wrapper this project wrote
  # (sch_is_wrapper_sh in defaults/main.yml reads its marker line). If yes, the
  # original anti-recursion clean-PATH search is correct, and npm-real beside it
  # is the fallback: that is where action/harden.sh puts the npm it wraps. If no
  # (raw binary or symlink), readlink -f resolves through any symlink
  # chain and gives the canonical path — catches the /opt install case.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if [ -f /usr/local/bin/npm ] && {{ sch_is_wrapper_sh }} /usr/local/bin/npm 2>/dev/null; then
        # Wrapper already deployed: the npm it wraps, by the rule of the block
        # marked "wrapped npm" (the same in tasks/npm.yml, tasks/npm_versions.yml and
        # ucf_npm in files/user-config.sh, where the reasons are; tests/ci/14 compares
        # them): an npm installed globally into /usr/local, whose link the wrapper
        # took, then the npm the wrapper names while it is there. Searching PATH
        # without /usr/local/bin re-pointed it: where the first apply had wrapped an
        # `npm install -g npm@latest` symlinked here, the second found the distro's
        # /usr/bin/npm and swapped the newer npm for it, age gate and all (MEASURED:
        # RHEL 9.9, RHEL 10.3, SLES 16, 2026-11-28: the second apply changed it from
        # npm 12.2.3 to 10.9.9, and later ones kept 10.9.9, with REAL_NPM='/usr/bin/npm'
        # in the wrapper; the npm@latest in /usr/local/lib/node_modules/npm is what heals
        # those). That search is the fallback, with the same anti-recursion logic as
        # before.
        # >>> wrapped npm
        npm=/usr/local/lib/node_modules/npm/bin/npm-cli.js
        if [ ! -x "$npm" ] || {{ sch_is_wrapper_sh }} "$npm" 2>/dev/null; then
          npm=$(sed -n "s/^REAL_NPM='\(.*\)'\$/\1/p" /usr/local/bin/npm | head -n 1)
          if [ -z "$npm" ] || [ ! -x "$npm" ] || {{ sch_is_wrapper_sh }} "$npm" 2>/dev/null; then npm=""; fi
        fi
        # <<< wrapped npm
        if [ -n "$npm" ]; then
          echo "$npm"
        else
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -vFx '/usr/local/bin' | tr '\n' ':' | sed 's/:$//')
          PATH="$CLEAN_PATH" command -v npm 2>/dev/null \
            || { [ -x /usr/local/bin/npm-real ] && echo /usr/local/bin/npm-real; }
        fi
      elif [ -e /usr/local/bin/npm ]; then
        # Raw binary or symlink at /usr/local/bin/npm — follow to canonical
        # path. Handles /opt/node-X/bin/npm via /usr/local/bin/npm symlink.
        readlink -f /usr/local/bin/npm
      else
        # Nothing at /usr/local/bin/npm — fall back to PATH search.
        command -v npm 2>/dev/null
      fi
    executable: /bin/bash
  register: npm_real_path
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0

- name: Re-check npq availability (the wrapper's other helper)
  # The wrapper is NOT sfw-only. templates/npm-wrapper.sh.j2 has a deliberate
  # fallback ladder:
  #   TTY + npq-hero + sfw -> exec sfw npq-hero      (both layers)
  #   TTY + npq-hero, none -> exec npq-hero          (reputation prompt only)
  #   non-TTY + sfw        -> exec sfw npm           (threat intel only)
  #   neither              -> warn loudly + passthrough
  # So npq alone is still real protection for interactive callers. Gating
  # deployment on sfw ALONE (as this file briefly did) meant a Node-18 host —
  # where the sfw install is skipped — got no wrapper at all, downgrading it
  # from "npq reputation prompts" to "nothing". That traded degraded coverage
  # for none, to avoid a case the wrapper already handles explicitly.
  #
  # FUNCTIONAL, NOT PRESENT. npq fails open: on Node < 20.13.0 it prints one
  # line to stderr, passes through to the real package manager, and exits 0.
  # An earlier version of this probe used `command -v npq-hero`, which meant a
  # host with a dead npq satisfied the "at least one helper" gate below and
  # got a wrapper whose only helper vets nothing. Presence is not coverage —
  # run it and look for npq's own suppression signal. Self-contained rather
  # than reading a fact from npq.yml, because `--tags socket` runs this file
  # without running npq.yml.
  ansible.builtin.shell:
    cmd: |
      for p in /usr/local/bin/npq-hero /usr/bin/npq-hero "$HOME/.local/bin/npq-hero"; do
        if [ -x "$p" ]; then
          NPQ="$p"
          break
        fi
      done
      [ -n "${NPQ:-}" ] || NPQ=$(PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v npq-hero 2>/dev/null)
      [ -n "${NPQ:-}" ] || exit 1
      out=$("$NPQ" --version 2>&1)
      if printf '%s' "$out" | grep -qi 'npq suppressed'; then
        exit 1
      fi
      echo "$NPQ"
    executable: /bin/bash
  register: npq_final
  changed_when: false
  check_mode: false
  failed_when: false

- name: Deploy npm PATH wrapper to /usr/local/bin
  become: true
  ansible.builtin.template:
    src: npm-wrapper.sh.j2
    dest: /usr/local/bin/npm
    mode: "0755"
    owner: root
    group: root
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0
    - npm_real_path.rc == 0
    - npm_real_path.stdout | length > 0
    # At least ONE helper must exist. A wrapper with neither sfw nor npq adds
    # only a per-invocation warning, which is noise rather than protection —
    # that was the real defect behind coupling this to sfw. But either helper
    # alone is genuine coverage (see the fallback ladder above), so require
    # sfw OR npq, not sfw specifically.
    - >-
      (sfw_final.rc == 0 and sfw_final.stdout | length > 0)
      or (npq_final.rc == 0 and npq_final.stdout | length > 0)

- name: Record skipped protection — npm PATH wrapper (sfw unavailable)
  # Wording note: this says "not refreshed", not "not deployed". Nothing in
  # this role REMOVES an existing /usr/local/bin/npm wrapper, so on a re-apply
  # where sfw has since disappeared a wrapper from an earlier run is still on
  # disk. Claiming it "was NOT deployed" would be false in that case, and the
  # operator would go looking for an absent file instead of a stale one.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['npm PATH wrapper — requested (npm_path_wrapper=true) but NEITHER Socket Firewall nor npq was found, so the wrapper was not deployed or refreshed. npm calls are unfiltered. If /usr/local/bin/npm exists from an earlier run it is now stale and warns on every invocation.'] }}
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0
    - sfw_final.rc != 0 or sfw_final.stdout | length == 0
    - npq_final.rc != 0 or npq_final.stdout | length == 0

- name: Record degraded protection — npm wrapper deployed without Socket Firewall
  # Deployed and useful (npq reputation prompts for interactive callers), but
  # non-interactive callers — scripts, agents, CI, the population this role
  # most targets — get the warn-and-passthrough branch. That is a real gap and
  # should not read as full npm coverage.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Socket Firewall threat-intel filtering for npm — the npm PATH wrapper WAS deployed and npq covers interactive callers, but sfw is absent, so non-interactive npm calls (scripts, agents, CI) are passed through unfiltered with a warning.'] }}
  when:
    - npm_path_wrapper | bool
    - npm_for_socket.rc == 0
    - sfw_final.rc != 0 or sfw_final.stdout | length == 0
    - npq_final.rc == 0
    - npq_final.stdout | length > 0

# --- cargo coverage (sfw supports cargo upstream: `sfw cargo fetch`) ---
# These live HERE, not in tasks/cargo.yml, because sfw is installed above and
# cargo hardening runs earlier in main.yml (:96 vs :153). Checking sfw health
# from cargo.yml reported "absent" on every first apply — sfw genuinely was
# absent at that point, and installed moments later.
# NOTE: a cargo-specific sfw health-check-and-quarantine block lived here and
# was removed. It moved the SHARED /usr/bin/sfw aside when a probe failed,
# which also disarmed the npm wrapper's sfw integration — a cargo-motivated
