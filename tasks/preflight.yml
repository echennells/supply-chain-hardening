---
# Pre-flight validation that runs before any ecosystem task.
# Tagged `always` in tasks/main.yml so it executes regardless of which
# ecosystem tag the operator chose; we want input validation even on
# narrow runs like `--tags npm`.

- name: Refuse a macOS target before anything is written
  # The TARGET, from its gathered facts: a Mac as the controller of a Linux host
  # is fine. First, so it comes before the sudo prompt of the checks below.
  #
  # MEASURED on GitHub's macos-15 (GNU date on PATH, so nothing else stopped it):
  # the play replaced ~/.npmrc, wrote /etc/npmrc, then failed on its owner with
  # "chgrp failed: failed to look up group root" (macOS calls gid 0 wheel), and
  # nothing after that file ran. A group name is not the whole of it: the env
  # layer goes to /etc/profile.d and /etc/environment, which macOS shells do not
  # read, and the refresh timer is a systemd unit.
  ansible.builtin.fail:
    msg: |
      [supply-chain-hardening] preflight: this role supports Linux, and
      {{ inventory_hostname }} is macOS. Nothing has been changed.

      On a Mac, use the script instead. It hardens the same package managers for
      your user, and is what CI runs on macOS:

          ./action/harden.sh --emit=plain     # see AGENTS.md, "Apply without Ansible"

      Applying this role from a Mac to a Linux host works: give the Linux host in
      your inventory.
  when: ansible_system | default('') == 'Darwin'

- name: Validate release_age_hours is at least 1
  ansible.builtin.assert:
    that:
      - release_age_hours | int >= 1
    fail_msg: >-
      release_age_hours must be >= 1 (got {{ release_age_hours }}).
      Setting to 0 or negative silently disables the age gate across
      npm, pnpm, bun, yarn, uv, and deno — that's one of the role's
      load-bearing protections. If you need to install a fresh
      package, override per invocation (e.g. `npm install --foreground-scripts
      --ignore-scripts=false`) rather than disabling globally.

- name: Determine the unescalated invoking user
  # `become: false` pins this to the account that actually launched ansible,
  # regardless of what the play escalates to afterwards. This is what makes
  # the guard below escalation-METHOD agnostic — see its DETECTION note.
  become: false
  ansible.builtin.command: id -un
  register: preflight_invoking_user
  changed_when: false
  check_mode: false

- name: Refuse to run when privilege escalation would mis-target per-user config
  # THE FAILURE THIS PREVENTS
  # Per-user destinations are "{{ ansible_env.HOME }}/.npmrc" and friends.
  # Facts are gathered under the play's become settings, so running the role
  # with `--become` (or `sudo ansible-playbook`) from a non-root account makes
  # ansible_env.HOME = /root. Every per-user config then lands in root's home
  # instead of the operator's, and $HOME-relative tool detection (cargo, uv)
  # looks in /root, finds nothing, and skips every tool install — while the
  # recap still reports failed=0. A clean success on an unhardened machine is
  # the worst outcome for a security role, so this fails loudly instead.
  #
  # DETECTION
  # The invariant is "per-user config is about to land in /root, and root is
  # not who invoked us". Two independent signals, because neither alone covers
  # the space:
  #   1. `id -un` under become:false — the real invoking account. Catches
  #      escalation by ANY method (sudo, su, doas, pbrun, ansible_become_*).
  #   2. SUDO_USER — catches the case where the ansible PROCESS is already
  #      root because it was launched under sudo, so signal 1 reports root.
  #
  #   dev, no become        -> HOME=/home/dev, id=dev,  SUDO_USER unset  (intended)
  #   dev + --become        -> HOME=/root,     id=dev,  SUDO_USER unset  (BUG, sig 1)
  #   dev + become_method su-> HOME=/root,     id=dev,  SUDO_USER unset  (BUG, sig 1)
  #   sudo ansible-playbook -> HOME=/root,     id=root, SUDO_USER=dev    (BUG, sig 2)
  #   sudo -i, then run     -> HOME=/root,     id=root, SUDO_USER=dev    (BUG, sig 2)
  #   root login directly   -> HOME=/root,     id=root, SUDO_USER unset  (legitimate)
  #   root + --become       -> HOME=/root,     id=root, SUDO_USER unset  (legitimate)
  #
  # NOTE on the two sudo-derived rows: `sudo ansible-playbook` and a `sudo -i`
  # shell are indistinguishable from each other by environment, and both write
  # to /root. They are therefore treated identically — refused, with the
  # documented opt-in below. A previous revision of this comment claimed a
  # `sudo -i` root shell left SUDO_USER unset; it does not, and the old test
  # covered only a genuine root login, so that claim was never exercised.
  #
  # Everything is additionally conditioned on HOME being /root: if per-user
  # config is landing somewhere sane, there is nothing to refuse.
  ansible.builtin.assert:
    that:
      - >-
        ansible_env.HOME != '/root'
        or (
          preflight_invoking_user.stdout | trim == 'root'
          and (ansible_env.SUDO_USER is not defined or ansible_env.SUDO_USER == 'root')
        )
    fail_msg: |
      Refusing to run: privilege escalation would write per-user config to the
      wrong home directory.

      Detected: ansible was invoked by '{{ preflight_invoking_user.stdout | trim }}'
      {% if ansible_env.SUDO_USER is defined %}(under sudo from '{{ ansible_env.SUDO_USER }}'){% endif %}
      but ansible_env.HOME is '{{ ansible_env.HOME }}'.

      Every per-user file (~/.npmrc, ~/.config/pnpm/rc, ~/.yarnrc.yml,
      ~/.bunfig.toml, ~/.cargo/config.toml, ~/.config/uv/uv.toml, ...) would be
      written under '{{ ansible_env.HOME }}' rather than the intended user's
      home, and $HOME-relative tool detection would skip every tool install —
      with no error and a failed=0 recap.

      Run the role WITHOUT global escalation:

          ansible-playbook site.yml                  # not: --become
          ansible-playbook site.yml --connection=local --limit localhost

      The role already escalates per task (become: true) exactly where root is
      required — /etc/npmrc, /etc/profile.d, /etc/environment, the PATH wrappers
      — so system-wide hardening still applies in full.

      If you genuinely intend to harden root's home directory, opt in:

          ansible-playbook site.yml -e accept_root_home_targeting=true
    success_msg: "Privilege context OK — per-user config targets {{ ansible_env.HOME }}."
  when: not (accept_root_home_targeting | default(false) | bool)

# --- sudo-rs vs ansible-core's become prompt ---------------------------------
# MEASURED on Ubuntu 26.04 (sudo-rs 0.2.13, the default /usr/bin/sudo there),
# with a user whose sudo needs a password and ansible run with -K (or
# --become-password-file, the same code path): every become task stops with
#   "Timed out waiting for become success or become password prompt"
# and rc=4, after 10s and having changed nothing. sudo-rs wraps the prompt
# ansible asks for (`-p "[sudo via ansible, key=...] password:"`) as
# "[sudo: <that>] Password:", so ansible never sees the exact string it is
# waiting for. Measured per ansible-core release, same container:
#   FAIL: 2.19.9, 2.19.14, 2.19.15, 2.20.0, 2.20.1 (apt on 26.04), 2.20.2,
#         2.20.5, 2.20.8, 2.20.10, 2.21.0, 2.21.1, 2.21.3, 2.21.5
#   HANG: 2.16.14, 2.17.14, 2.18.12 (Python 3.12 venvs): no timeout message,
#         still running when killed at 90s; 2.16.14 and 2.18.12 escalate
#         with NOPASSWD sudo, so it is the prompt again
#   OK:   2.20.11, 2.21.6, 2.22.0
# NOPASSWD sudo has no prompt to answer: on 2.20.1 it worked both with and
# without a become password supplied. So the refusal needs all three: sudo-rs,
# a password prompt, and an affected ansible-core. It runs before the first `become: true` task below;
# without it the operator gets ansible's timeout, which names neither sudo-rs
# nor this role. `sudo -n true` never prompts and never attempts a password,
# so the probe cannot count as a failed login.
- name: Probe for sudo-rs with a password prompt (affected ansible-core cannot answer it)
  become: false
  ansible.builtin.shell:
    cmd: |
      v=$(sudo --version 2>/dev/null | head -1)
      case "$v" in sudo-rs*) ;; *) exit 0 ;; esac
      if sudo -n true >/dev/null 2>&1; then exit 0; fi
      printf '%s\n' "$v"
    executable: /bin/sh
  register: preflight_sudo_rs
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - (ansible_become_method | default(lookup('ansible.builtin.config', 'DEFAULT_BECOME_METHOD'))) == 'sudo'
    - >-
      ansible_version.full is version('2.20.11', '<')
      or (ansible_version.full is version('2.21.0', '>=')
          and ansible_version.full is version('2.21.6', '<'))

- name: Refuse sudo-rs password prompts on an ansible-core that cannot answer them
  ansible.builtin.fail:
    msg: |
      [supply-chain-hardening] preflight: ansible-core {{ ansible_version.full }} cannot answer the sudo-rs password prompt.

      This host's sudo is {{ preflight_sudo_rs.stdout | trim }} and `sudo -n true` fails for this user,
      so it would ask for a password. Every task that needs root would either stop
      with "Timed out waiting for become success or become password prompt"
      (measured on 2.19.9 to 2.20.10 and 2.21.0 to 2.21.5) or hang (measured on
      2.16 to 2.18), and change nothing.

      Fix, either one:
        - Run a fixed ansible-core (2.20.11+, 2.21.6+ or 2.22+) for your user,
          leaving the system package alone (`sudo apt install pipx` first if needed):
              pipx install 'ansible-core>=2.21.6'
              ~/.local/bin/ansible-playbook site.yml --limit localhost -K
        - Or give this user NOPASSWD sudo for the duration of the apply and
          drop -K (with no prompt to answer, the become succeeds; measured on 2.20.1).

      If this user has no sudo rights on this host at all, `sudo -n true` fails the
      same way and neither fix helps: the role needs an account that can use sudo.

      Measured on Ubuntu 26.04 (sudo-rs 0.2.13, apt ansible-core 2.20.1).
  when:
    - preflight_sudo_rs.stdout is defined
    - preflight_sudo_rs.stdout | trim | length > 0

- name: Probe GNU date on the controller for the rolling uv/pip cutoff
  # defaults/main.yml computes the rolling cutoff (sch_uv_cutoff, sch_pip_cutoff) via
  #   lookup('pipe', 'date -u -d @<epoch> +%Y-%m-%dT00:00:00Z')
  # which requires GNU date. BSD date (a Mac as the controller) lacks the
  # `-d @<epoch>` syntax, and the lookup then
  # aborts the play with only "lookup_plugin.pipe(...) returned 1".
  # The lookup runs on the CONTROLLER, so the probe goes through the same
  # lookup: a command task here would probe the target instead, passing a
  # controller that cannot render the cutoff and blocking a target that never
  # needs to. Only a `rolling` cutoff evaluates the lookup; a pinned one needs
  # no GNU date anywhere, so the probe is skipped. The defaults keep this safe
  # when preflight.yml is imported on its own (tests/bats/38 does), where the
  # role's defaults are not loaded; they match defaults/main.yml.
  ansible.builtin.set_fact:
    gnu_date_probe: >-
      {{ lookup('pipe', 'date -u -d @0 +%Y-%m-%dT%H:%M:%SZ 2>&1 || echo "rc=$?"') }}
  when: >-
    (uv_exclude_newer | default('rolling')) == 'rolling'
    or (pip_uploaded_prior_to | default(uv_exclude_newer | default('rolling'))) == 'rolling'

- name: Fail when GNU date is unavailable on the controller
  ansible.builtin.fail:
    msg: |
      The role's rolling uv/pip cutoff uses `lookup('pipe', 'date -u -d @<epoch>')`
      which requires GNU date. Your controller's date refused the probe:

        $ date -u -d @0 +%Y-%m-%dT%H:%M:%SZ
        {{ gnu_date_probe | indent(2) }}

      Fix:
        - Install GNU coreutils on the controller (`apt install coreutils`;
          usually already present on Linux) and put its `date` first on PATH for
          the shell you run Ansible from.
        - OR pin the cutoff to an instant, which needs no GNU date:
          `-e 'uv_exclude_newer=2026-05-24T12:00:00Z'`
        - To skip this check (the cutoff lookup then fails or renders a bad
          value instead): `-e skip_gnu_date_check=true` — not recommended.
  when:
    - gnu_date_probe is defined
    - gnu_date_probe != "1970-01-01T00:00:00Z"
    - not (skip_gnu_date_check | default(false) | bool)

- name: Detect non-managed existing system config files
  # Each /etc/* file we deploy has a marker comment line. If a file
  # already exists without the marker, it was placed by someone or
  # something else (corporate registry config, sysadmin override,
  # distribution package, etc.). Refuse to overwrite without explicit
  # operator opt-in — silently clobbering a /etc/npmrc with corporate
  # registry settings is the worst-case scenario (dependency confusion).
  ansible.builtin.shell:
    cmd: |
      set -e
      missing_marker=0
      conflict=""
      # No /etc/yarnrc.yml: Yarn never reads it, and the role no longer writes it
      # (tasks/yarn.yml).
      for f in /etc/npmrc /etc/pip.conf /etc/uv/uv.toml; do
        # Recognize files placed by EITHER supply-chain surface — the role
        # ("ansible-supply-chain-security") OR the GitHub Action
        # ("supply-chain-harden action"). Same project; before this, a host
        # hardened by the action tripped the role's guard on re-apply because
        # each surface only knew its own marker (#351).
        if [ -f "$f" ] && ! grep -qE "Managed by (ansible-supply-chain-security|supply-chain-harden)" "$f" 2>/dev/null; then
          missing_marker=1
          conflict="${conflict}${f}\n"
        fi
      done
      if [ "$missing_marker" -eq 1 ]; then
        printf "%b" "$conflict"
        exit 42
      fi
    executable: /bin/bash
  register: etc_preflight
  changed_when: false
  check_mode: false
  failed_when: false
  become: true

- name: Fail when /etc config files exist without the role's marker
  ansible.builtin.fail:
    msg: |
      Refusing to overwrite existing system config files that were not
      placed by this role:

      {{ etc_preflight.stdout }}

      These files are commonly used for corporate registry / proxy /
      auth settings; overwriting them blindly can cause registry-takeover
      vulnerabilities (dependency confusion) or break installs entirely.

      To proceed, either:
        1. Back up the existing files and remove them, then re-run; or
        2. Set `accept_etc_overwrite=true` to overwrite anyway (e.g.
           `ansible-playbook site.yml -e accept_etc_overwrite=true`).
  when:
    - etc_preflight.rc == 42
    - not (accept_etc_overwrite | default(false) | bool)

# npm reads its global config from {prefix}/etc/npmrc on every layout but Debian's,
# and tasks/npm.yml writes it there too. MEASURED (d738db8, NodeSource's
# /usr/etc/npmrc): a registry and a token in it were gone after an apply, with no
# copy, and --diff printed them. Resolved here, as the user, before anything is
# changed, and judged like the files above: one that is not exactly what this project
# last wrote, which a token added since makes it, stops the play. Where neither the user
# nor root may write it (ucf_no_root in files/user-config.sh), tasks/npm.yml leaves it
# alone and the summary says so; that stops nothing.
- name: Resolve npm's global config path (before anything is changed)
  ansible.builtin.script: ../files/user-config.sh path npm-global
  args:
    executable: /bin/bash
  register: npm_global_preflight
  changed_when: false
  check_mode: false
  when:
    - "'all' in (ansible_run_tags | default(['all'])) or 'npm' in (ansible_run_tags | default(['all']))"
    - "'npm' not in (ansible_skip_tags | default([]))"

- name: Detect a global npmrc this project did not write
  become: "{{ 'as root' in (npm_global_preflight.stdout_lines | default([])) }}"
  ansible.builtin.script: ../files/user-config.sh classify npm-global
  args:
    executable: /bin/bash
  environment:
    SCH_UCF_PATH: "{{ npm_global_preflight.stdout_lines | first }}"
    SCH_UCF_ROOT: "{{ ('as root' in npm_global_preflight.stdout_lines) | ternary('1', '0') }}"
  register: npm_global_class
  changed_when: false
  check_mode: false
  failed_when: npm_global_class.rc | default(1) not in [0, 42]
  when: npm_global_preflight.stdout_lines | default([]) | length > 0

- name: Fail when npm's global config exists and this project did not write it
  ansible.builtin.fail:
    msg: |
      [supply-chain-hardening] Refusing to overwrite npm's global config, which is
      not exactly what this project wrote:

        {{ npm_global_preflight.stdout_lines | first }}

      It commonly holds a corporate registry and its token; overwriting it blindly
      can cause dependency confusion or break installs entirely. Nothing has been
      changed yet.

      To proceed, either:
        1. Move the file aside, then re-run; or
        2. Set `accept_etc_overwrite=true` to overwrite it anyway (e.g.
           `ansible-playbook site.yml -e accept_etc_overwrite=true`). It is copied
           next to itself first (0600), as <file>.<pid>.<YYYY-MM-DD@HH:MM:SS>~.
  when:
    - npm_global_class.stdout_lines is defined
    - npm_global_class.stdout_lines | select('match', 'foreign ') | list | length > 0
    - not (accept_etc_overwrite | default(false) | bool)

- name: Detect per-user config files this run would replace that this project did not write
  # The same refusal as the /etc check above, for the per-user files the role
  # REPLACES wholesale: pnpm's config.yaml and rc, ~/.yarnrc.yml, pip.conf,
  # uv.toml, bunfig, ~/.bundle/config, $CARGO_HOME/config.toml, ~/.m2/settings.xml,
  # NuGet's user NuGet.Config and Composer's config.json. Each is where a private
  # registry or mirror lives, next to its credentials. MEASURED (8281a6b for cargo,
  # maven and nuget, d738db8 for the rest): an apply replaced them, left no copy, and
  # reported nothing; the corporate mirror and the credentials were gone. With the
  # mirror gone, an internal package name resolves against the public registry
  # instead: dependency confusion, the case the /etc check exists for.
  #
  # ~/.npmrc is merged (tasks/npm.yml), so nothing of the user's stops the play
  # there. It is in the list only for the check that it can be written at all.
  #
  # What counts as this project's own is user_cfg_class in files/user-config.sh,
  # which action/harden.sh carries too: the file exactly as it was last written, or
  # as a version from before the checksum wrote it. A marker alone is not enough,
  # because a token added after hardening sits in a file that carries it (MEASURED).
  # dotnet's own first-run NuGet.Config, which lists nuget.org and nothing else, is
  # not a choice anyone made and is replaced too, after a copy.
  #
  # Only the files THIS run would write are checked: each one's tag must be
  # selected, and each one's tool gate (tasks/maven.yml, tasks/nuget.yml) must
  # pass. ucf_path and ucf_applies in files/user-config.sh resolve the path and the
  # gate the way those task files do. Keep them in step.
  #
  # ../files/, not the bare name the other tasks use: tests/bats/38 and 50 import
  # this file on its own, where the role's files/ is not on the search path and
  # only the directory of this file is.
  ansible.builtin.script: "../files/user-config.sh classify {{ sch_user_cfg_kinds }}"
  args:
    executable: /bin/bash
  vars:
    # Would this run reach the task file that writes each one? `--tags npm`
    # must not stop on a ~/.m2/settings.xml it will never touch. The tags are
    # those of each file's include in tasks/main.yml.
    sch_run_tags: "{{ ansible_run_tags | default(['all']) }}"
    sch_skip_tags: "{{ ansible_skip_tags | default([]) }}"
    sch_user_cfg_tags:
      npmrc: [npm]
      pnpm-yaml: [pnpm]
      pnpm-rc: [pnpm]
      yarn: [yarn]
      bun: [bun]
      pip: [pip, python]
      uv: [uv, python, pip]
      bundler: [bundler, ruby]
      cargo: [cargo, rust]
      maven: [maven, java]
      nuget: [nuget, dotnet]
      composer: [composer, php]
      composer-home: [composer, php]
    sch_user_cfg_kinds: >-
      {%- set kinds = [] -%}
      {%- for k, t in sch_user_cfg_tags.items() -%}
      {%- if ('all' in sch_run_tags or (sch_run_tags | intersect(t) | length > 0)) and (sch_skip_tags | intersect(t) | length == 0) -%}
      {%- set _ = kinds.append(k) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ kinds | join(' ') }}
  register: user_cfg_preflight
  changed_when: false
  check_mode: false
  # Fail closed: a check that could not run must not read as "no conflict".
  failed_when: user_cfg_preflight.rc | default(1) not in [0, 42]

- name: Fail when a per-user config file cannot be written as it has to be
  # Before anything is changed: one the role cannot read, does not own or cannot
  # replace would otherwise stop the play half way through.
  ansible.builtin.fail:
    msg: |
      [supply-chain-hardening] These per-user config files cannot be written:

      {% for l in user_cfg_preflight.stdout_lines if l is match('blocked ') %}
        {{ l | regex_replace('^blocked ', '') }}
      {% endfor %}

      Fix or move each one, then re-run. Nothing has been changed yet.
  when: user_cfg_preflight.stdout_lines | select('match', 'blocked ') | list | length > 0

- name: Fail when per-user config files exist that this project did not write
  ansible.builtin.fail:
    msg: |
      [supply-chain-hardening] Refusing to overwrite existing per-user config
      files that are not exactly what this project wrote:

      {% for l in user_cfg_preflight.stdout_lines if l is match('foreign ') %}
        {{ l | regex_replace('^foreign ', '') }}
      {% endfor %}

      The role replaces each of these files whole; it does not merge into
      them. They commonly hold a private registry or mirror and its
      credentials, or a login token added since the last apply. Replacing them
      drops both, and an internal package name then resolves against the public
      registry (dependency confusion). Nothing has been changed yet.

      To proceed, either:
        1. Move the files aside, then re-run; or
        2. Set `accept_user_config_overwrite=true` to replace them anyway
           (e.g. `ansible-playbook site.yml -e accept_user_config_overwrite=true`).
           Each is backed up next to itself first (0600), as
           <file>.<pid>.<YYYY-MM-DD@HH:MM:SS>~; re-add anything you still
           need by hand.
      (~/.npmrc is not one of them: the role merges into it.)
  when:
    - user_cfg_preflight.stdout_lines | select('match', 'foreign ') | list | length > 0
    - not (accept_user_config_overwrite | default(false) | bool)

- name: Assert the pip age-gate cutoff is an absolute Z-suffixed RFC 3339 instant
  # A MALFORMED value makes pip >= 26 exit 2 on every install / download / list
  # and even `pip install --help` -- host-wide and for every account, because
  # this lands in /etc/pip.conf and /etc/environment. Two shapes are rejected
  # deliberately: the relative `P<n>D` form (pip 26.1+, hard error on 26.0) and
  # any value without a literal Z (read in the host's LOCAL time -- 26h of
  # spread measured across TZ=UTC / Pacific/Kiritimati / Etc/GMT+12).
  #
  # This lives in preflight, not pip.yml, because preflight carries
  # `tags: always` -- so `--tags npm` or `--skip-tags pip` cannot deploy the
  # higher-precedence env layer without this check having run.
  ansible.builtin.assert:
    that:
      - sch_pip_cutoff is string
      - sch_pip_cutoff is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]+)?Z$')
    fail_msg: >-
      pip_uploaded_prior_to must be `rolling` or an absolute RFC 3339 instant
      ending in a literal Z (e.g. 2026-10-19T00:00:00Z); it resolved to
      '{{ sch_pip_cutoff | default("<undefined>") }}'. A malformed value
      makes pip >= 26 exit 2 on every install for every user on this host. The
      relative P<n>D form needs pip 26.1+ and is a hard error on 26.0.
    quiet: true
  # `default(false)`, not a bare reference: tests/bats/38-preflight-become-guard.bats
  # imports THIS FILE into a bare playbook that supplies only release_age_hours,
  # so defaults/main.yml is never loaded and a bare `pip_age_gate | bool` raises
  # an undefined-variable error that fails the play. Preflight has to stand on
  # its own. In a real apply the role's defaults make this true.
  when: pip_age_gate | default(false) | bool

- name: Validate the uv cutoff shape (a malformed value breaks every uv on the host)
  # sch_uv_cutoff lands in /etc/uv/uv.toml, which every interpreter on the host
  # reads, and uv refuses to start on a value it cannot parse. The pip check above
  # only covers uv incidentally (pip inherits uv's value by default), so a bad
  # uv-only pin got through with no preflight catch.
  #
  # Deliberately LOOSER than the pip check: uv accepts forms pip does not. It
  # accepts every form defaults/main.yml documents for uv_exclude_newer: an
  # absolute RFC 3339 instant, a local date, and the span forms uv 0.9.17+ accepts
  # (which supply-chain-verify grades WEAK). This catches empty, garbage and
  # malformed values; it does NOT prove the host's uv is new enough for a span.
  # `is defined` keeps it skipped when preflight.yml is imported on its own
  # (tests/bats/38), where the role defaults are not loaded.
  ansible.builtin.assert:
    that:
      - sch_uv_cutoff is string
      - >-
        sch_uv_cutoff is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$')
        or sch_uv_cutoff is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
        or sch_uv_cutoff is match('^[0-9]+ ?(second|minute|hour|day|week)s?$')
        or sch_uv_cutoff is match('^P(T[0-9]+[HMS]|[0-9]+[DW])$')
    fail_msg: >-
      uv_exclude_newer must be `rolling`, an absolute RFC 3339 instant
      (e.g. 2026-10-19T00:00:00Z), a date (2026-10-19), or a span uv 0.9.17+
      accepts (e.g. "2 days", P2D); it resolved to
      '{{ sch_uv_cutoff | default("<undefined>") }}'. A value uv cannot parse
      is written to /etc/uv/uv.toml and stops uv from starting for every user.
    quiet: true
  when: sch_uv_cutoff is defined
