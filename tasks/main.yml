---
# IMPORTANT — every include below uses the `apply: tags:` pattern, not just
# bare `tags:` on the include itself. Reason: `include_tasks` is DYNAMIC,
# which means tags on the include statement apply ONLY to the include
# statement itself — NOT to the tasks inside the included file. With bare
# `tags: [composer]` on the include, `ansible-playbook --tags composer`
# would fire the include statement but then filter every included task out
# (none have a `composer` tag, so they don't match the filter). The whole
# role becomes a no-op under any `--tags` invocation.
#
# `apply: tags: [composer]` propagates the tags to every task inside the
# included file (Ansible applies them as if each task had been written
# with that tag). The outer `tags: [composer]` is still needed so the
# include statement itself responds to the filter — without it, the
# include runs unconditionally even when the user wanted only composer.
#
# Both layers are required. See:
#   https://docs.ansible.com/ansible/latest/user_guide/playbooks_tags.html#adding-tags-to-includes
#
# This was a latent role bug — any user running `ansible-playbook site.yml
# --tags <ecosystem>` was silently getting nothing applied. Surfaced by
# the matrix's per-cell tag-scoped apply optimization (commit 1107963):
# every cell ran the include but skipped every task inside, so wrappers
# weren't deployed and config.json wasn't rendered, which made every
# behavioral test fail or pass tautologically. Without the matrix this
# would have stayed invisible.

- name: Pre-flight input validation and conflict detection
  ansible.builtin.include_tasks:
    file: preflight.yml
    apply:
      tags: always
  tags: always

- name: Include the sfw cache reset (before the first root npm install)
  # npm.yml, npq.yml and socket.yml each run `npm install -g` as root, and on a
  # host an earlier version hardened that goes through its npm wrapper and so
  # through sfw. A cache another account could write therefore has to be reset
  # here, before npm.yml, and not in socket.yml, which runs after the other two.
  # See the top of sfw_cache_reset.yml for the measurement.
  #
  # Tagged `always`, not [socket, npm, npq]: Ansible skips a task when ANY of
  # its tags is skipped, so `--skip-tags npq` would drop the reset while npm.yml
  # still installed as root. socket.yml includes the file itself if this did
  # not run. Same `when` as the socket.yml include: with
  # socket_firewall_install=false the role leaves sfw alone.
  ansible.builtin.include_tasks:
    file: sfw_cache_reset.yml
    apply:
      tags: always
  when: socket_firewall_install | bool
  tags: always

- name: Include npm hardening
  ansible.builtin.include_tasks:
    file: npm.yml
    apply:
      tags: [npm]
  tags: [npm]

- name: Include pnpm hardening
  ansible.builtin.include_tasks:
    file: pnpm.yml
    apply:
      tags: [pnpm]
  tags: [pnpm]

- name: Include yarn hardening
  ansible.builtin.include_tasks:
    file: yarn.yml
    apply:
      tags: [yarn]
  tags: [yarn]

- name: Include bun hardening
  ansible.builtin.include_tasks:
    file: bun.yml
    apply:
      tags: [bun]
  tags: [bun]

- name: Include pip/python hardening
  ansible.builtin.include_tasks:
    file: pip.yml
    apply:
      tags: [pip, python]
  tags: [pip, python]

- name: Include uv hardening
  # NOTE: pip tag is intentional. uv.yml deploys the pip→uv path wrapper
  # at /usr/local/bin/pip and /usr/local/bin/pip3. Without `pip` in the
  # tag list, `--tags pip` would deploy /etc/pip.conf but not the wrapper,
  # leaving pip-the-binary unhardened. Production users following
  # --tags pip would get partial hardening with no error signal.
  ansible.builtin.include_tasks:
    file: uv.yml
    apply:
      tags: [uv, python, pip]
  tags: [uv, python, pip]

- name: Include the age-gate refresh (keeps the uv/pip cutoff rolling)
  # After uv.yml, which sets the uv_config_dir fact the refresher targets.
  ansible.builtin.include_tasks:
    file: age_gate_refresh.yml
    apply:
      tags: [uv, python, pip]
  tags: [uv, python, pip]

- name: Include deno hardening
  ansible.builtin.include_tasks:
    file: deno.yml
    apply:
      tags: [deno]
  tags: [deno]

- name: Include cargo/rust hardening
  ansible.builtin.include_tasks:
    file: cargo.yml
    apply:
      tags: [cargo, rust]
  tags: [cargo, rust]

- name: Include go hardening
  ansible.builtin.include_tasks:
    file: go.yml
    apply:
      tags: [go]
  tags: [go]

- name: Include composer/PHP hardening
  ansible.builtin.include_tasks:
    file: composer.yml
    apply:
      tags: [composer, php]
  tags: [composer, php]

- name: Include bundler/Ruby hardening
  ansible.builtin.include_tasks:
    file: bundler.yml
    apply:
      tags: [bundler, ruby]
  tags: [bundler, ruby]

- name: Include Maven hardening
  ansible.builtin.include_tasks:
    file: maven.yml
    apply:
      tags: [maven, java]
  tags: [maven, java]

- name: Include Gradle hardening
  ansible.builtin.include_tasks:
    file: gradle.yml
    apply:
      tags: [gradle, java]
  tags: [gradle, java]

- name: Include NuGet/.NET hardening
  ansible.builtin.include_tasks:
    file: nuget.yml
    apply:
      tags: [nuget, dotnet]
  tags: [nuget, dotnet]

- name: Include podman/container hardening
  ansible.builtin.include_tasks:
    file: podman.yml
    apply:
      tags: [podman, container]
  when: podman_enabled | bool
  tags: [podman, container]

- name: Include npq pre-install auditing
  ansible.builtin.include_tasks:
    file: npq.yml
    apply:
      tags: [npq, npm]
  tags: [npq, npm]

- name: Include socket firewall
  # NOTE: npm tag is intentional. socket.yml installs sfw (Socket
  # Firewall) AND deploys the npm PATH wrapper at /usr/local/bin/npm
  # that routes registry-fetching subcommands through sfw. The npm
  # wrapper is the role's marquee npm protection — without `npm` in
  # the tag list, `--tags npm` would deploy ~/.npmrc and /etc/npmrc
  # but never install the wrapper, leaving the documented npm
  # protection partially deployed.
  ansible.builtin.include_tasks:
    file: socket.yml
    apply:
      tags: [socket, npm]
  when: socket_firewall_install | bool
  tags: [socket, npm]

- name: Include GitHub Actions workflow auditing tools
  # Tagged `github` ONLY, deliberately. This include is genuinely
  # GitHub-specific — zizmor and pinact audit GitHub Actions workflow YAML —
  # and it is detection-only. It used to also carry a `ci` tag, which reads as
  # "generic CI hardening" and is the opposite of what it does; the CI-runner
  # hardening is a separate deliverable (see action/). Nothing invoked
  # `--tags ci`, so dropping it breaks no caller.
  ansible.builtin.include_tasks:
    file: github.yml
    apply:
      tags: [github]
  tags: [github]

- name: Include shell environment hardening
  # NOTE: `always` tag is intentional. shell_env.yml deploys
  # /etc/profile.d/supply-chain-hardening.sh and /etc/environment with
  # env vars for every major ecosystem (NPM_CONFIG_*, PYTHONDONTWRITEBYTECODE,
  # PIP_DISABLE_*, UV_*, GO*, COMPOSER_SKIP_SCRIPTS, etc.). These are
  # baseline hardening that applies regardless of which ecosystem is
  # being scoped via --tags. The COMPOSER_SKIP_SCRIPTS env var is the
  # "belt-and-suspenders backup layer" that catches `php composer.phar`
  # callers bypassing the wrapper — under the previous `tags: [shell]`,
  # --tags composer deployed the wrapper but not the env-var backup,
  # silently breaking the documented layered defense. Use --skip-tags
  # always to opt out explicitly.
  ansible.builtin.include_tasks:
    file: shell_env.yml
    apply:
      tags: always
  tags: always

# --- End-of-run coverage summary -------------------------------------------
# For an agent-facing hardening role the single most valuable output is
# "here is what did NOT get applied, and why". Without this, a protection
# that skipped (Node too old for sfw, Go missing for govulncheck/pinact)
# is visible only as one `skipping: [host]` line buried in the task stream,
# while the recap still prints failed=0 — reading as full success.
# Ecosystem tasks append to `skipped_protections`; this reports the total.
# Generalizes the pattern already used by "Report active pnpm allowlist
# exemptions".

# Does a supply-chain-verify report follow in this run? verify.yml skips the
# run under --check, and the include is skipped with --skip-tags verify or
# always. Saying "the report that follows" when none does sends the operator
# looking for output that is not there.
- name: Work out whether the verifier runs after this summary
  ansible.builtin.set_fact:
    sch_verify_follows: >-
      {{ (verify_protections | default(true) | bool)
         and not ansible_check_mode
         and 'verify' not in (ansible_skip_tags | default([]))
         and 'always' not in (ansible_skip_tags | default([])) }}
  tags: always

- name: Report protections that were NOT applied
  # The optional audit tools (zizmor, pinact, govulncheck, uv-secure,
  # pip-audit, lockfile-lint) are not protections: nothing in the role runs
  # them. Their entries say so, and the header counts them apart.
  vars:
    sch_tool_entries: "{{ skipped_protections | select('search', '[(]optional audit tools?;') | list | length }}"
  ansible.builtin.debug:
    msg: |-
      ⚠ {{ skipped_protections | length - sch_tool_entries | int }} protection(s) were NOT applied on this host{% if sch_tool_entries | int > 0 %}, plus {{ sch_tool_entries }} optional audit tool entr{{ 'y' if sch_tool_entries | int == 1 else 'ies' }} (not protections: nothing in the role runs them){% endif %}:
      {% for item in skipped_protections %}
        {{ loop.index }}. {{ item }}
      {% endfor %}
      This list is only what the role knew it skipped while applying; it does
      not show that everything else is in effect.
      {% if sch_verify_follows | bool %}The supply-chain-verify report that follows asks each tool: read its GAP and WEAK rows.{% else %}Run supply-chain-verify, which asks each tool, and read its GAP and WEAK rows.{% endif %}

      Install the missing prerequisite and re-run to close the gaps listed here.
  when: skipped_protections | default([]) | length > 0
  tags: always

- name: Confirm full coverage (no protections skipped)
  # SCOPE-QUALIFIED ON PURPOSE.
  #
  # The tasks that append to `skipped_protections` live in tag-scoped includes
  # (go.yml -> [go], github.yml -> [github], socket.yml -> [socket, npm]
  # plus `when: socket_firewall_install`). These two summary tasks are
  # `tags: always`. So a scoped run — `--tags npm`, `--tags shell`, or any run
  # with socket_firewall_install=false — never executes the producers, leaving
  # the list empty and printing an unqualified all-clear for a run that applied
  # a fraction of the role.
  #
  # That is the exact failure this summary was added to eliminate, in a worse
  # form: an operator or agent can cite an affirmative ✓ as evidence of
  # coverage. Only claim full coverage when the run was actually full.
  # Worded as what the role recorded, not as coverage: "All applicable
  # protections were applied" overclaimed the same way the old "Everything
  # else in the role applied normally" did. Only the verifier asks the tools.
  ansible.builtin.debug:
    msg: >-
      ✓ No protection was skipped and no prerequisite was missing, as far as
      the role could tell while applying. That is not proof that every
      protection is in effect: {{ 'the supply-chain-verify report that follows
      asks each tool.' if sch_verify_follows | bool else 'run supply-chain-verify,
      which asks each tool.' }}
  when:
    - skipped_protections | default([]) | length == 0
    - ansible_run_tags | default(['all']) == ['all']
    - ansible_skip_tags | default([]) | length == 0
    - socket_firewall_install | bool
  tags: always

- name: Report coverage for a scope-limited run
  ansible.builtin.debug:
    msg: |-
      ✓ No missing prerequisites within this run's scope.
      ⚠ This was NOT a full run, so this is not a statement of full coverage:
      {% if ansible_run_tags | default(['all']) != ['all'] %}
        - limited to tags: {{ ansible_run_tags | sort | join(', ') }}
      {% endif %}
      {% if ansible_skip_tags | default([]) | length > 0 %}
        - skipping tags: {{ ansible_skip_tags | sort | join(', ') }}
      {% endif %}
      {% if not (socket_firewall_install | bool) %}
        - socket_firewall_install=false — Socket Firewall and the npm PATH
          wrapper were not evaluated.
      {% endif %}
      Protections outside that scope were never evaluated and may be absent.
      Re-run without the restriction for a full coverage report.
  when:
    - skipped_protections | default([]) | length == 0
    - >-
      ansible_run_tags | default(['all']) != ['all']
      or ansible_skip_tags | default([]) | length > 0
      or not (socket_firewall_install | bool)
  tags: always

# Settings the run did not honour while the protection they feed stayed in
# place: an sfw_version that was not installed over a working sfw (below
# 2.0.6, a dist-tag or range, or an install that failed and left the old sfw
# in use). Listed apart, so the NOT-applied count above never claims a
# protection is missing because of them, and the operator still learns that
# the setting was not applied.
- name: Report settings this run did not apply as configured
  ansible.builtin.debug:
    msg: |-
      {{ sch_apply_notes | length }} setting(s) were not applied as configured. No protection is missing because of them; each entry names what is in use instead:
      {% for item in sch_apply_notes %}
        {{ loop.index }}. {{ item }}
      {% endfor %}
  when: sch_apply_notes | default([]) | length > 0
  tags: always

# What the run did to anything of the user's in the per-user files it writes
# (files/user-config.sh). Paths, key names from this project's own list and line
# numbers only: these files hold tokens. A copy appears here only with
# accept_user_config_overwrite=true, or when a line was taken out of ~/.npmrc.
- name: Report what this run did to your own config files
  vars:
    sch_ucf_files:
      - { path: "{{ ansible_env.HOME }}/.npmrc", lines: "{{ sch_ucf_npmrc.stdout_lines | default([]) }}" }
      - { path: "{{ pnpm_config_dir | default('') }}/rc", lines: "{{ sch_ucf_pnpm_rc.stdout_lines | default([]) }}" }
      - { path: "{{ pnpm_config_dir | default('') }}/config.yaml", lines: "{{ sch_ucf_pnpm_yaml.stdout_lines | default([]) }}" }
      - { path: "{{ ansible_env.HOME }}/.yarnrc.yml", lines: "{{ sch_ucf_yarn.stdout_lines | default([]) }}" }
      - { path: "{{ ansible_env.HOME }}/.config/pip/pip.conf", lines: "{{ sch_ucf_pip.stdout_lines | default([]) }}" }
      - { path: "{{ uv_config_dir | default('') }}/uv.toml", lines: "{{ sch_ucf_uv.stdout_lines | default([]) }}" }
      - { path: "{{ bun_bunfig_path | default('') }}", lines: "{{ sch_ucf_bun.stdout_lines | default([]) }}" }
      - { path: "{{ ansible_env.HOME }}/.bundle/config", lines: "{{ sch_ucf_bundler.stdout_lines | default([]) }}" }
    sch_ucf_said: "{{ sch_ucf_files | map(attribute='lines') | flatten | select('match', '(copy|removed|unsure|mode) ') | list }}"
  ansible.builtin.debug:
    msg: |-
      In your own config files{{ ' (a dry run: nothing was written)' if ansible_check_mode else '' }}:
      {% for f in sch_ucf_files %}
      {% for l in f.lines %}
      {% if l is match('removed ') %}
        - {{ f.path }}: your own setting of {{ l | regex_replace('^removed ', '') }} {{ 'would be' if ansible_check_mode else 'was' }} taken out; a line after the block this project writes would win over it
      {% elif l is match('unsure ') %}
        - {{ f.path }}: kept, but it may set or defeat a setting this project writes there: {{ l | regex_replace('^unsure ', '') }}
      {% elif l is match('mode ') %}
        - {{ f.path }}: other accounts could read it ({{ l | regex_replace('^mode ', '') }}); it {{ 'would become' if ansible_check_mode else 'is now' }} 0600
      {% elif l == 'copy -' %}
        - {{ f.path }}: would be copied next to itself (0600) first
      {% elif l is match('copy ') %}
        - {{ f.path }}: the file as it was is at {{ l | regex_replace('^copy ', '') }}
      {% endif %}
      {% endfor %}
      {% endfor %}
  when: sch_ucf_said | length > 0
  tags: always

# Before the verifier: with agent_host, verify_fail_on_gap can end the play
# there, and the profile has to be in the log either way.
- name: Report the agent host profile
  ansible.builtin.include_tasks:
    file: agent_profile.yml
    apply:
      tags: always
  tags: always

# Runs last, after every ecosystem has been applied, because it inspects the
# resulting state of the host rather than the role's own bookkeeping.
- name: Verify protections are actually in effect
  ansible.builtin.include_tasks:
    file: verify.yml
    apply:
      tags: [verify]
  tags: [verify, always]
