---
- name: Pre-flight input validation and conflict detection
  ansible.builtin.include_tasks: preflight.yml
  tags: always

- name: Include npm hardening
  ansible.builtin.include_tasks: npm.yml
  tags: [npm]

- name: Include pnpm hardening
  ansible.builtin.include_tasks: pnpm.yml
  tags: [pnpm]

- name: Include yarn hardening
  ansible.builtin.include_tasks: yarn.yml
  tags: [yarn]

- name: Include bun hardening
  ansible.builtin.include_tasks: bun.yml
  tags: [bun]

- name: Include pip/python hardening
  ansible.builtin.include_tasks: pip.yml
  tags: [pip, python]

- name: Include uv hardening
  ansible.builtin.include_tasks: uv.yml
  tags: [uv, python]

- name: Include deno hardening
  ansible.builtin.include_tasks: deno.yml
  tags: [deno]

- name: Include cargo/rust hardening
  ansible.builtin.include_tasks: cargo.yml
  tags: [cargo, rust]

- name: Include go hardening
  ansible.builtin.include_tasks: go.yml
  tags: [go]

- name: Include composer/PHP hardening
  ansible.builtin.include_tasks: composer.yml
  tags: [composer, php]

- name: Include bundler/Ruby hardening
  ansible.builtin.include_tasks: bundler.yml
  tags: [bundler, ruby]

- name: Include Maven hardening
  ansible.builtin.include_tasks: maven.yml
  tags: [maven, java]

- name: Include Gradle hardening
  ansible.builtin.include_tasks: gradle.yml
  tags: [gradle, java]

- name: Include NuGet/.NET hardening
  ansible.builtin.include_tasks: nuget.yml
  tags: [nuget, dotnet]

- name: Include podman/container hardening
  ansible.builtin.include_tasks: podman.yml
  when: podman_enabled | bool
  tags: [podman, container]

- name: Include npq pre-install auditing
  ansible.builtin.include_tasks: npq.yml
  tags: [npq, npm]

- name: Include socket firewall
  ansible.builtin.include_tasks: socket.yml
  when: socket_firewall_install | bool
  tags: [socket]

- name: Include GitHub Actions hardening tools
  ansible.builtin.include_tasks: github.yml
  tags: [github, ci]

- name: Include shell environment hardening
  ansible.builtin.include_tasks: shell_env.yml
  tags: [shell]

# --- End-of-run coverage summary -------------------------------------------
# For an agent-facing hardening role the single most valuable output is
# "here is what did NOT get applied, and why". Without this, a protection
# that skipped (Node too old for sfw, Go missing for govulncheck/pinact)
# is visible only as one `skipping: [host]` line buried in the task stream,
# while the recap still prints failed=0 — reading as full success.
# Ecosystem tasks append to `skipped_protections`; this reports the total.
# Generalizes the pattern already used by "Report active pnpm allowlist
# exemptions".
- name: Report protections that were NOT applied
  ansible.builtin.debug:
    msg: |-
      ⚠ {{ skipped_protections | length }} protection(s) were NOT applied on this host:
      {% for item in skipped_protections %}
        {{ loop.index }}. {{ item }}
      {% endfor %}
      Everything else in the role applied normally. Install the missing
      prerequisite and re-run to close these gaps.
  when: skipped_protections | default([]) | length > 0
  tags: always

- name: Confirm full coverage (no protections skipped)
  ansible.builtin.debug:
    msg: "✓ All applicable protections were applied — no prerequisites missing."
  when: skipped_protections | default([]) | length == 0
  tags: always
