---
# Yarn supply chain hardening
# Config deployed unconditionally; one setting (enableHardenedMode) is
# tiered based on detected Yarn version — see template comment for the
# version gate. The role uses the same detect-and-template pattern that
# composer uses for its audit-block tier (see tasks/composer.yml).

- name: Detect installed Yarn version (empty if not installed or fails)
  # Yarn typically comes via corepack which dynamically resolves the
  # version from package.json's packageManager field — without a project
  # context (and no globally-activated yarn), `yarn --version` may error.
  # The `|| exit 0` swallows that case; template treats empty as
  # "assume modern (4.0+)" since modern Yarn is overwhelmingly the
  # common case when Yarn is installed at all. Older Yarn 3.x just gets
  # a warning if `enableHardenedMode` is emitted — not a hard error —
  # but omitting it on detected <4.0 keeps logs clean.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      command -v yarn >/dev/null 2>&1 || exit 0
      yarn --version 2>/dev/null | head -1
    executable: /bin/bash
  register: yarn_version_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Set yarn_detected_version fact
  ansible.builtin.set_fact:
    yarn_detected_version: "{{ yarn_version_check.stdout | default('') | trim }}"

# The template below is written whatever the version, so it is ready when Yarn
# is upgraded. This record stops the summary from reading as coverage on a Yarn
# that ignores it. The verifier's yarn rows are the runtime check.
- name: Record skipped protection — this Yarn does not implement the age gate
  # npmMinimalAgeGate arrived in Yarn 4.10.0. Older Berry ignores the key in
  # ~/.yarnrc.yml without a word (MEASURED: 4.1.0, the apt yarnpkg on Debian 13
  # and Ubuntu 26.04, and 4.9.4; via corepack, `yarn config get
  # npmMinimalAgeGate` is a usage error on 4.9.4 and reports the value on 4.10.0
  # and 4.10.3). Yarn 1.x never reads .yarnrc.yml at all: MEASURED (yarn 1.22.22
  # via corepack, node 24), a dependency postinstall RAN with ~/.yarnrc.yml
  # enableScripts: false, ~/.npmrc ignore-scripts=true,
  # NPM_CONFIG_IGNORE_SCRIPTS=true and npm_config_ignore_scripts=true each in
  # place; only `yarn install --ignore-scripts` stopped it. The verifier reports
  # both as a GAP; the end-of-play summary used to leave yarn out entirely
  # (VM#10). One task, not one per case: tests/bats/32-yarn-tier-rendering.bats
  # runs it alone, by name.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + [
           ('Yarn hardening — yarn ' ~ yarn_detected_version ~ ' is Yarn classic, which never reads .yarnrc.yml, so none of the yarn settings this role writes apply: dependency install scripts run and there is no age gate. The npm-side layers do not reach it either (MEASURED on 1.22.22: a postinstall ran with ~/.npmrc ignore-scripts=true and NPM_CONFIG_IGNORE_SCRIPTS=true; only `yarn install --ignore-scripts` stopped it). Move the project to Yarn >= 4.10 (corepack) and re-apply.')
           if yarn_detected_version is version('2.0.0', '<') else
           ('Yarn publish-age gate — yarn ' ~ yarn_detected_version ~ ' does not implement npmMinimalAgeGate (added in Yarn 4.10.0), so `yarn install` accepts a release published seconds ago. enableScripts: false still applies, and the key is written so it takes effect once Yarn is upgraded.')
         ] }}
  when:
    - yarn_detected_version is match('^[0-9]+[.][0-9]+')
    - yarn_detected_version is version('4.10.0', '<')

- name: Deploy hardened global .yarnrc.yml
  ansible.builtin.template:
    src: yarnrc.yml.j2
    dest: "{{ ansible_env.HOME }}/.yarnrc.yml"
    mode: "0644"

# Yarn Berry has NO system-wide config file. It reads a .yarnrc.yml in the
# working directory and each parent up to /, then the one in $HOME, and the
# YARN_* environment above both. MEASURED (Yarn 4.9.4, 4.10.3, 4.11.0 and
# 4.18.1 via corepack, as root and as a second user): with /etc/yarnrc.yml
# setting enableScripts: false and npmMinimalAgeGate: 4321, `yarn config get`
# still reported the defaults, an unknown key added to it raised nothing, a
# file: dependency's postinstall ran (4.9.4 to 4.11.0), and the bundles
# contain no "/etc/" string at all. This role used to write /etc/yarnrc.yml
# "for sudo and other users"; it protected neither.
# sudo sets HOME=/root (MEASURED: sudo 1.9.13p3 on Debian 12, 1.9.15p5 on
# Ubuntu 24.04), so root's own ~/.yarnrc.yml is what `sudo yarn` reads
# (MEASURED, Yarn 4.11.0: enableScripts went from true to false and the gate
# from 0 to 2880 once /root/.yarnrc.yml existed). Same approach as composer's
# /root config. Other accounts get only Yarn's own defaults: see
# docs/limitations.md. Root's home is asked of the passwd database (macOS:
# /var/root), not assumed.
- name: Resolve root's home directory (yarn sudo coverage)
  ansible.builtin.shell:
    cmd: 'h=~root; case "$h" in /*) printf "%s" "$h" ;; esac'
    executable: /bin/bash
  register: yarn_root_home
  changed_when: false
  check_mode: false
  failed_when: false

# Unlike /etc/yarnrc.yml, root's ~/.yarnrc.yml is a file Yarn really reads, so
# one already there is root's own `sudo yarn` configuration and may hold a
# registry and its npmAuthToken. The preflight refused to overwrite an
# unmanaged /etc/yarnrc.yml; this keeps that promise for the file that replaced
# it: one this project did not write is left alone, and the summary says so.
# When the role runs as root, root's home IS the deploying user's, written
# above as it always was.
- name: Check root's ~/.yarnrc.yml before writing it (sudo coverage)
  become: true
  ansible.builtin.shell:
    cmd: |
      f={{ ((yarn_root_home.stdout | trim) ~ '/.yarnrc.yml') | quote }}
      [ -e "$f" ] || { echo absent; exit 0; }
      grep -qE "Managed by (ansible-supply-chain-security|supply-chain-harden)" "$f" && { echo ours; exit 0; }
      echo foreign
    executable: /bin/bash
  register: yarn_root_rc
  changed_when: false
  check_mode: false
  when:
    - (yarn_root_home.stdout | default('') | trim) is match('^/')
    - (yarn_root_home.stdout | trim) != ansible_env.HOME

- name: Deploy hardened .yarnrc.yml to root's home (sudo coverage)
  become: true
  ansible.builtin.template:
    src: yarnrc.yml.j2
    dest: "{{ yarn_root_home.stdout | trim }}/.yarnrc.yml"
    owner: root
    mode: "0644"
  when:
    - yarn_root_rc is not skipped
    - (yarn_root_rc.stdout | default('') | trim) in ['absent', 'ours']

# Named apart from "Record skipped protection": tests/bats/32-yarn-tier-rendering.bats
# lifts the one task with that prefix by name.
- name: Add root's own ~/.yarnrc.yml to the not-applied summary (sudo coverage)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + [
           ('Yarn sudo coverage — ' ~ (yarn_root_home.stdout | trim) ~ '/.yarnrc.yml exists and this project did not write it, so it was left alone (it may hold a registry and its token). `sudo yarn` reads that file, not the yarn settings this role writes. Move it aside, or add the settings from ~/.yarnrc.yml to it, and re-apply.')
         ] }}
  when:
    - yarn_root_rc is not skipped
    - (yarn_root_rc.stdout | default('') | trim) == 'foreign'

- name: Remove the /etc/yarnrc.yml an earlier version wrote (Yarn never reads it)
  # Only a file carrying one of this project's markers; anyone else's is left
  # alone, as the preflight used to protect it.
  become: true
  ansible.builtin.shell:
    cmd: |
      f=/etc/yarnrc.yml
      [ -f "$f" ] || exit 0
      grep -qE "Managed by (ansible-supply-chain-security|supply-chain-harden)" "$f" || exit 0
      rm -f "$f" && echo removed
    executable: /bin/bash
  register: yarn_etc_cleanup
  changed_when: "'removed' in yarn_etc_cleanup.stdout"
