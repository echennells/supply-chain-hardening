---
# Go supply chain hardening
# Env vars deployed system-wide via /etc/profile.d/ and /etc/environment
# (see shell_env.yml). This task handles tool installs only.

- name: Check if go is installed
  # Check canonical install locations first. /usr/local/go/bin/go is where
  # the official tarball installer puts go, but many users don't add it to
  # PATH globally — they source it via .profile or .bashrc, which ansible's
  # connection may not see on automated runs. Plain `which go` then misses
  # the installed binary entirely.
  ansible.builtin.shell:
    cmd: |
      for p in /usr/local/go/bin/go /usr/bin/go /usr/local/bin/go "$HOME/sdk/go/bin/go"; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      PATH="/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin:$PATH" command -v go 2>/dev/null
    executable: /bin/bash
  register: go_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Detect Go version (GOTOOLCHAIN below only exists in Go >= 1.21)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      "{{ go_check.stdout }}" version 2>/dev/null | sed -nE 's/.*go([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p'
    executable: /bin/bash
  register: go_version
  changed_when: false
  check_mode: false
  failed_when: false
  when: go_check.rc == 0

- name: Install govulncheck (with toolchain auto-fetch for this install only)
  # Three things collide here without this fix:
  #   1. `go install golang.org/x/vuln/cmd/govulncheck@latest` requires a
  #      toolchain new enough to build the latest govulncheck (currently
  #      go 1.24+). Ubuntu 24.04's stock go is 1.22.
  #   2. The role just set GOTOOLCHAIN=local system-wide (correctly — that's
  #      part of the hardening). With local, go refuses to auto-download a
  #      newer toolchain even when go.mod requires one.
  #   3. With (1) + (2), `go install` aborts with a toolchain error, which
  #      fails the play and skips every downstream task.
  # GOTOOLCHAIN=auto scoped to JUST this command lets go download whatever
  # toolchain govulncheck needs, without changing the system-wide GOTOOLCHAIN
  # value that protects user `go install` calls. Also uses the absolute go
  # path we already discovered — bare `go` wouldn't be reachable on hosts
  # where ansible's connection PATH lacks /usr/local/go/bin.
  #
  # ...AND THAT FIX ONLY WORKS ON GO >= 1.21.
  # GOTOOLCHAIN was introduced in Go 1.21. On older Go it is simply an unknown
  # environment variable: go ignores it, cannot fetch a newer toolchain, and
  # `go install ...@latest` fails — which is collision (3) above, unmitigated.
  # This task had no failed_when, so that aborted the play.
  #
  # Measured on stock distros: Ubuntu 22.04 ships Go 1.18.1 and Debian 12 ships
  # 1.19.8, so the role DIED HERE on two of its three declared supported
  # platforms, taking 11 downstream includes with it — composer, bundler,
  # maven, gradle, nuget, podman, npq, socket (sfw + the npm wrapper), github,
  # shell_env (the ENTIRE env-var layer), and verify. The host was left half
  # hardened by a run that reported a failure nobody connected to those
  # ecosystems.
  #
  # Two independent fixes, because either alone leaves a hole:
  #   1. gate on Go >= 1.21 so we do not attempt an install that cannot work
  #   2. failed_when: false so a future govulncheck/toolchain problem degrades
  #      to a reported gap instead of taking out half the role. An optional
  #      vulnerability scanner must never cost the load-bearing config layer.
  ansible.builtin.command:
    cmd: "{{ go_check.stdout }} install golang.org/x/vuln/cmd/govulncheck@latest"
    creates: "{{ omit if refresh_tools | bool else ansible_env.HOME + '/go/bin/govulncheck' }}"
  environment:
    GOTOOLCHAIN: auto
  register: govulncheck_install
  failed_when: false
  when:
    - go_check.rc == 0
    - go_version.stdout | default('') | trim | length > 0
    - go_version.stdout | trim is version('1.21', '>=')

- name: Record skipped protection — govulncheck (Go too old for toolchain fetch)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['govulncheck — Go ' ~ (go_version.stdout | default('') | trim | default('<undetected>', true)) ~ ' is older than 1.21, so GOTOOLCHAIN auto-fetch is unavailable and govulncheck cannot be installed. Go vulnerability scanning is not set up. Stock Ubuntu 22.04 (1.18) and Debian 12 (1.19) are both below this floor.'] }}
  when:
    - go_check.rc == 0
    - go_version.stdout | default('') | trim | length == 0
      or go_version.stdout | trim is version('1.21', '<')

- name: Record skipped protection — govulncheck (install failed)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['govulncheck — install failed on Go ' ~ (go_version.stdout | default('') | trim) ~ '. Go vulnerability scanning is not set up. The rest of the role still applied.'] }}
  when:
    - govulncheck_install is defined
    - govulncheck_install.rc | default(0) != 0

- name: Record skipped protection — govulncheck (Go absent)
  # Feeds the end-of-run summary in main.yml so the skip is surfaced once at
  # the end instead of only as `skipping: [localhost]` inside the task stream.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['govulncheck — Go is not installed, so Go vulnerability scanning was not set up.'] }}
  when: go_check.rc != 0
