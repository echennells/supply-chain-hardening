---
# Post-apply verification: prove protections are IN EFFECT, not merely written.
#
# WHY THIS EXISTS
#
# Every protection failure this project has shipped had the same shape: the
# config file was exactly what we intended, the tool ignored it, and the run
# reported success. yarn's "2d" parsing to NaN, npm's MINIMUM_RELEASE_AGE key,
# pnpm 11 dropping the ini files, pnpm 10 accepting block-exotic-subdeps and
# ignoring it, bun not loading bunfig for `bun run`, npq passing through to npm
# and exiting 0 on old Node. Six instances, six one-off fixes.
#
# The end-of-run coverage summary added in d82df2e reports which TASKS skipped.
# That is a different question from whether the protections that did not skip
# are actually doing anything — and it is the wrong question, because five of
# the six failures above happened in tasks that completed successfully.
#
# So this asks the tools instead of asking ourselves, on the real host, against
# the real installed versions, after everything has been applied.
#
# HOW THE COMMAND IS BUILT
#
# /usr/local/bin/supply-chain-verify is assembled from three fragments rather
# than rendered from one template:
#
#   00-context.sh   templates/verify.sh.j2         host context + host-only probes
#   50-probes.sh    files/verify-probes.sh         SHARED with the CI surface
#   90-report.sh    templates/verify-report.sh.j2  renderer + exit code
#
# `copy` (not `template`) for the middle fragment is the whole point: it
# guarantees the bytes running on this host are the same bytes action/verify.sh
# runs in CI. A probe is a question about a tool and has no business differing
# between a VM and a runner; only the CONTEXT — what this surface promised —
# is allowed to differ, and that is what fragment 00 carries.
#
# `assemble` rather than a shell `cat`: no shell module, idempotent,
# check-mode-aware, and `validate` refuses to install a verifier that does not
# parse. The single `template` task this replaced had no such guard.

- name: Create the verifier fragment directory
  become: true
  ansible.builtin.file:
    path: /usr/local/lib/supply-chain-verify
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render this host's verification context
  # Fragment 00. The ONLY Jinja in the verifier, and the only place the role's
  # intent (which wrappers were requested, which tools, the age window) crosses
  # into the deployed artifact. See the preamble's own header for the rule that
  # governs what may be frozen here.
  become: true
  ansible.builtin.template:
    src: verify.sh.j2
    dest: /usr/local/lib/supply-chain-verify/00-context.sh
    owner: root
    group: root
    mode: "0644"

- name: Install the shared probe body
  # Fragment 50. Jinja-free on purpose so it can be copied verbatim; if a
  # `{{` ever appears in it, this task starts shipping it literally, which is
  # the failure mode to watch for.
  become: true
  ansible.builtin.copy:
    src: verify-probes.sh
    dest: /usr/local/lib/supply-chain-verify/50-probes.sh
    owner: root
    group: root
    mode: "0644"

- name: Render the verification report and exit logic
  # Fragment 90. Last because it consumes what every probe produced.
  become: true
  ansible.builtin.template:
    src: verify-report.sh.j2
    dest: /usr/local/lib/supply-chain-verify/90-report.sh
    owner: root
    group: root
    mode: "0644"

- name: Assemble the verification command
  # Shipped as a standalone binary, not just an end-of-play step, so operators
  # and agents can answer "what is actually protecting this box right now?"
  # at any time — including long after the apply, when versions have drifted
  # underneath us. That drift is how several of these bugs arrived.
  #
  # Fragments are concatenated in lexical order, which is what the 00/50/90
  # prefixes buy: ordering is a property of the filenames rather than of this
  # task, and a future local override can slot in at 10- without editing here.
  #
  # `not ansible_check_mode`: assemble reads the fragments off the REMOTE host,
  # and under --check on a host that has never been applied they do not exist
  # yet, so the task would fail on a run that is supposed to change nothing.
  become: true
  ansible.builtin.assemble:
    src: /usr/local/lib/supply-chain-verify
    dest: /usr/local/bin/supply-chain-verify
    remote_src: true
    owner: root
    group: root
    mode: "0755"
    validate: /bin/bash -n %s
  when: not ansible_check_mode

- name: Verify which protections are actually in effect
  # Read-only: nothing here installs, fetches, or writes outside a temporary
  # directory it removes again. rc 1 means gaps were found, which is
  # information rather than a task failure, so it is captured instead of
  # raised.
  #
  # `not ansible_check_mode` replaces the previous `check_mode: false`. Forcing
  # the command to run while the deploy tasks above are skipped is the same
  # class of error this whole file exists to catch, in the consumer: under
  # --check on a fresh host the binary does not exist, rc is 2, and
  # verify_fail_on_gap=true would fail the play with "a protection this role
  # reports as applied is not actually doing anything" — about a protection
  # that was never deployed because the operator asked for a dry run.
  ansible.builtin.command: /usr/local/bin/supply-chain-verify
  register: verification
  changed_when: false
  failed_when: false
  when:
    - verify_protections | bool
    - not ansible_check_mode

- name: Report what is actually enforcing
  ansible.builtin.debug:
    msg: "{{ verification.stdout_lines }}"
  when:
    - verify_protections | bool
    - verification.stdout_lines is defined

- name: Fail when protections are not in effect
  # Off by default. See defaults/main.yml:verify_fail_on_gap for what a gap
  # now means: with the context preamble in place it is measured against what
  # THIS host declared, not against an ideal host.
  ansible.builtin.fail:
    msg: |
      Verification found protections that are NOT in effect on this host.

      This is not a warning about missing prerequisites — it means a
      protection this host's own configuration asked for is not actually
      doing anything. Protections this host never asked for are reported as
      "N/A BYDESIGN" and do not reach this message.

      See the table above; each row states how it was established:

        FUNCTIONAL  we ran it and watched what happened
        PARSED      the tool reported the setting back to us
        PRESENT     a file exists and nothing more — not evidence

      Re-run `/usr/local/bin/supply-chain-verify` at any time.
      Set verify_fail_on_gap=false to make this advisory.
  when:
    - verify_protections | bool
    - verify_fail_on_gap | bool
    # `rc is defined` rather than `rc | default(0)`: when the run task was
    # skipped (--check, or verify_protections=false) there is no rc, and
    # defaulting it to 0 hid that behind a value that reads as success.
    - verification.rc is defined
    - verification.rc != 0
