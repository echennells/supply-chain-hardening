---
# pnpm supply chain hardening
# Config deployed unconditionally

- name: Determine pnpm global config path
  # pnpm's resolution order, per https://pnpm.io/npmrc :
  #   1. $XDG_CONFIG_HOME/pnpm  (if XDG_CONFIG_HOME is set, regardless of OS)
  #   2. ~/Library/Preferences/pnpm  (macOS default, env-paths convention)
  #   3. ~/.config/pnpm  (Linux/other default)
  # Many developer macOS environments set XDG_CONFIG_HOME to ~/.config for
  # cross-platform consistency, in which case pnpm reads from there rather
  # than the native macOS location. Writing to the wrong location is silent
  # failure — pnpm just doesn't see our hardening — so mirror pnpm's logic.
  ansible.builtin.set_fact:
    pnpm_config_dir: >-
      {{
        ansible_env.XDG_CONFIG_HOME ~ '/pnpm'
        if ansible_env.XDG_CONFIG_HOME is defined and ansible_env.XDG_CONFIG_HOME | length > 0
        else (
          ansible_env.HOME ~ '/Library/Preferences/pnpm'
          if ansible_os_family == 'Darwin'
          else ansible_env.HOME ~ '/.config/pnpm'
        )
      }}

- name: Validate pnpm package-name lists (defense against npmrc injection)
  # pnpm_built_dependencies and pnpm_minimum_release_age_exclude are
  # interpolated into the rc file as `key[]=<value>` lines. A value
  # containing a newline could inject additional npmrc directives — most
  # severely, `ignore-scripts=false` to undo hardening. Reject any value
  # that isn't a plausible package name. npm/pnpm package names are
  # lowercase alphanumeric + ._-, optionally scoped (@scope/name).
  ansible.builtin.assert:
    that:
      - item is match("^@?[a-zA-Z0-9_./-]+$")
    fail_msg: >-
      Invalid pnpm package name '{{ item }}': contains characters that could
      inject npmrc directives. Allowed: alphanumeric, hyphen, underscore,
      dot, @, /.
  loop: "{{ pnpm_built_dependencies + pnpm_minimum_release_age_exclude }}"
  when: (pnpm_built_dependencies | length + pnpm_minimum_release_age_exclude | length) > 0

- name: Validate pnpm_allowlist_conflict_action
  # Guard against a typo silently mis-routing the doubly-exempt check below:
  # an unrecognized value would make neither the assert (== 'fail') nor the
  # warn (== 'warn') branch fire, so a genuinely dangerous config would pass
  # unchecked. Constrain to the two supported modes up front.
  ansible.builtin.assert:
    that:
      - pnpm_allowlist_conflict_action in ['fail', 'warn']
    fail_msg: >-
      pnpm_allowlist_conflict_action must be 'fail' or 'warn', got
      '{{ pnpm_allowlist_conflict_action }}'.

- name: Detect packages exempt from BOTH script-blocking and the age gate
  # A package on pnpm_built_dependencies may run build scripts; a package on
  # pnpm_minimum_release_age_exclude skips the age gate. A package on BOTH has
  # zero supply-chain gates — a compromised release runs on install with no
  # cooldown. This is the trusted-package-takeover hole (Shai-Hulud / keyv,
  # 2026-08). Compute the intersection so we can refuse or warn.
  ansible.builtin.set_fact:
    pnpm_doubly_exempt: "{{ pnpm_built_dependencies | intersect(pnpm_minimum_release_age_exclude) }}"

- name: Fail when a package is exempt from both script-blocking and the age gate
  ansible.builtin.assert:
    that:
      - pnpm_doubly_exempt | length == 0
    fail_msg: >-
      These packages are on BOTH pnpm_built_dependencies (may run build
      scripts) and pnpm_minimum_release_age_exclude (skip the age gate):
      {{ pnpm_doubly_exempt | join(', ') }}. That removes every supply-chain
      gate for them — a compromised release runs immediately, no cooldown.
      Remove each from one of the two lists, or set
      pnpm_allowlist_conflict_action=warn to override deliberately.
    success_msg: "pnpm allowlists: no package is exempt from both gates."
  when: pnpm_allowlist_conflict_action == 'fail'

- name: Warn when a package is exempt from both gates (override mode)
  ansible.builtin.debug:
    msg: >-
      WARNING (pnpm_allowlist_conflict_action=warn):
      {{ pnpm_doubly_exempt | join(', ') }}
      {{ 'is' if pnpm_doubly_exempt | length == 1 else 'are' }}
      exempt from BOTH script-blocking and the age gate — no supply-chain
      gate remains for {{ 'it' if pnpm_doubly_exempt | length == 1 else 'them' }}.
  when:
    - pnpm_allowlist_conflict_action == 'warn'
    - pnpm_doubly_exempt | length > 0

- name: Report active pnpm allowlist exemptions
  # Surfaces what the operator has exempted and by which mechanism, so a
  # committed exemption is a visible, reviewable decision rather than a silent
  # config line. Only shown when something is actually exempted, so the
  # default (fully-locked) apply stays quiet — the default path is unchanged.
  ansible.builtin.debug:
    msg: |-
      pnpm allowlist exemptions active on this host:
        build scripts allowed (flips ignore-scripts=false on pnpm <= 10) for:
          {{ pnpm_built_dependencies | join(', ') if pnpm_built_dependencies | length > 0 else '(none — all build scripts blocked)' }}
        age gate skipped for:
          {{ pnpm_minimum_release_age_exclude | join(', ') if pnpm_minimum_release_age_exclude | length > 0 else '(none — all packages age-gated)' }}
  when: (pnpm_built_dependencies | length + pnpm_minimum_release_age_exclude | length) > 0

- name: Create pnpm config directory
  ansible.builtin.file:
    path: "{{ pnpm_config_dir }}"
    state: directory
    mode: "0755"

- name: Deploy hardened pnpm rc (ini format — for pnpm 10 and earlier)
  ansible.builtin.template:
    src: pnpm-rc.j2
    dest: "{{ pnpm_config_dir }}/rc"
    mode: "0644"

- name: Detect pnpm major version (for exotic-subdep enforcement reporting)
  # blockExoticSubdeps is a pnpm 11+ control. The role emits it to config.yaml
  # unconditionally so the protection is live the moment a host upgrades, but
  # on pnpm 10 nothing enforces it and the ini-format files cannot carry it
  # either (see the note in templates/pnpm-rc.j2). Rather than leave that as a
  # silent gap, detect the version and report it.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for p in /usr/local/bin/pnpm /usr/bin/pnpm "$HOME/.local/share/pnpm/pnpm"; do
        if [ -x "$p" ]; then
          "$p" --version 2>/dev/null | sed -nE 's/^([0-9]+)\..*/\1/p'
          exit 0
        fi
      done
      PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" \
        command -v pnpm >/dev/null 2>&1 && pnpm --version 2>/dev/null | sed -nE 's/^([0-9]+)\..*/\1/p'
    executable: /bin/bash
  register: pnpm_major_version
  changed_when: false
  check_mode: false
  failed_when: false

- name: Record skipped protection — exotic-subdep blocking (pnpm < 11)
  # Fires only when pnpm is actually installed AND older than 11. An absent
  # pnpm is not a gap worth reporting: nothing on the host can use it.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['pnpm exotic-dependency blocking (blockExoticSubdeps) — requires pnpm >= 11, found pnpm ' ~ (pnpm_major_version.stdout | trim) ~ '. git / http(s) / tarball-URL dependencies are NOT refused on this host; no pnpm 10 config key can enforce it.'] }}
  when:
    - pnpm_major_version.stdout | trim | length > 0
    - pnpm_major_version.stdout | trim | int > 0
    - pnpm_major_version.stdout | trim | int < 11

- name: Deploy hardened pnpm config.yaml (YAML format — required for pnpm 11+)
  # pnpm 11 stopped reading ~/.npmrc, ~/.config/pnpm/rc, /etc/npmrc,
  # and NPM_CONFIG_* env vars for non-auth settings. Without this file,
  # the entire pnpm hardening layer is inert on pnpm 11. Verified
  # empirically: pnpm 11.1.3 ignores all four legacy sources and only
  # reads config.yaml for ignoreScripts, minimumReleaseAge, etc.
  ansible.builtin.template:
    src: pnpm-config.yaml.j2
    dest: "{{ pnpm_config_dir }}/config.yaml"
    mode: "0644"
