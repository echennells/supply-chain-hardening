---
# Maven supply chain hardening

- name: Check for mvn, or a JDK a ./mvnw build would run on
  # Many maven builds run the project's ./mvnw instead of an `mvn` on PATH. The
  # wrapper downloads a maven distribution and runs it on the host's java, and
  # that maven reads the same ~/.m2/settings.xml. Gating on `which mvn` alone
  # (CMP 4.5) left such hosts with no settings at all. MEASURED (8281a6b, JDK
  # 21 on PATH, no mvn): nothing was deployed and nothing was recorded, and
  # maven 3.9.11 then read "user settings from ~/.m2/settings.xml", which did
  # not exist. A wrapper cannot start without java, so java on PATH or
  # $JAVA_HOME/bin/java is the trigger.
  ansible.builtin.shell:
    cmd: |
      for t in mvn java; do command -v "$t" && exit 0; done
      if [ -n "${JAVA_HOME:-}" ] && [ -x "$JAVA_HOME/bin/java" ]; then
        echo "$JAVA_HOME/bin/java"; exit 0
      fi
      exit 1
    executable: /bin/bash
  register: mvn_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Look up the passwd home, which maven reads its settings.xml from
  ansible.builtin.import_tasks: passwd_home.yml

- name: Resolve the home maven reads ~/.m2/settings.xml from
  # Maven reads <user.home>/.m2/settings.xml, and the JVM takes user.home from
  # the passwd entry, not from $HOME (tasks/passwd_home.yml). MEASURED (maven
  # 3.10.2 on temurin 21.0.13.1): as root with HOME=/tmp/h, `mvn -X` said
  # "Reading user settings from /root/.m2/settings.xml", with a settings.xml in
  # both homes. This task used to write $HOME/.m2, which maven did not read
  # wherever the two homes differ. Maven has no variable like GRADLE_USER_HOME
  # to point it elsewhere. $HOME when this uid has no passwd home it can write,
  # recorded below. $HOME too for a root that sudo or doas reached with another
  # account's HOME (tasks/passwd_home.yml): the preflight then refuses it, as
  # for the other per-user files. tasks/preflight.yml judges the same file.
  ansible.builtin.set_fact:
    maven_user_home_resolved: "{{ ansible_facts.env.HOME if sch_passwd_kept_out | length > 0 else (sch_passwd_home | default('', true) or ansible_facts.env.HOME) }}"
  when: mvn_check.rc == 0

- name: Deploy Maven settings.xml with HTTPS-only mirror and strict checksums
  # Replaced whole, but only a file that is exactly what this project last wrote
  # (files/user-config.sh, user_cfg_class): a marker is not enough, because a
  # credential added after hardening sits in a file that carries one. Anything else
  # stopped the play in preflight, unless accept_user_config_overwrite=true, which
  # copies it first. No diff is produced here, so --diff prints none of it.
  ansible.builtin.script: user-config.sh replace maven
  args:
    executable: /bin/bash
  environment:
    SCH_UCF_PATH: "{{ maven_user_home_resolved }}/.m2/settings.xml"
    SCH_UCF_BODY: |
      <!-- Managed by ansible-supply-chain-security -->
      <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0
                https://maven.apache.org/xsd/settings-1.2.0.xsd">
        <!-- Force all repositories through HTTPS -->
        <mirrors>
          <mirror>
            <id>central-https</id>
            <url>https://repo.maven.apache.org/maven2</url>
            <mirrorOf>*</mirrorOf>
          </mirror>
        </mirrors>
        <!-- Refuse an artifact whose content does not match its published
             checksum (Maven's default is 'warn', which installs it anyway).
             Maven keeps TWO repository lists: <repositories> for dependencies
             and <pluginRepositories> for plugins. The super POM declares
             'central' in both, so redefining it only under <repositories>
             left plugin jars - code that runs inside the build - on 'warn'.
             MEASURED (maven 3.9.11, a plugin jar served with a wrong .sha1
             through this file's mirror): two checksum WARNINGs and BUILD
             SUCCESS; a dependency jar with a wrong .sha1 failed the build.
             A mirror does not close that: it inherits the policy of the
             repository it replaces, per list.
             Both entries also restore the super POM's
             <snapshots><enabled>false</enabled>: a redefinition without it
             turned snapshot lookups on Central back on (MEASURED: a
             1.0-SNAPSHOT dependency resolved from Central with this file and
             was not looked up there with no settings at all). The plugin
             entry keeps the super POM's releases updatePolicy=never. -->
        <profiles>
          <profile>
            <id>strict-checksums</id>
            <repositories>
              <repository>
                <id>central</id>
                <url>https://repo.maven.apache.org/maven2</url>
                <releases>
                  <checksumPolicy>fail</checksumPolicy>
                </releases>
                <snapshots>
                  <enabled>false</enabled>
                </snapshots>
              </repository>
            </repositories>
            <pluginRepositories>
              <pluginRepository>
                <id>central</id>
                <url>https://repo.maven.apache.org/maven2</url>
                <releases>
                  <updatePolicy>never</updatePolicy>
                  <checksumPolicy>fail</checksumPolicy>
                </releases>
                <snapshots>
                  <enabled>false</enabled>
                </snapshots>
              </pluginRepository>
            </pluginRepositories>
          </profile>
        </profiles>
        <activeProfiles>
          <activeProfile>strict-checksums</activeProfile>
        </activeProfiles>
      </settings>
    SCH_UCF_DRY: "{{ ansible_check_mode | ternary('1', '0') }}"
    SCH_UCF_FOREIGN: "{{ (accept_user_config_overwrite | default(false) | bool) | ternary('keep', 'refuse') }}"
  register: sch_ucf_maven
  check_mode: false
  changed_when: "'changed' in (sch_ucf_maven.stdout_lines | default([]))"
  when: mvn_check.rc == 0

- name: Note that settings.xml is outside $HOME, in the passwd home
  ansible.builtin.set_fact:
    sch_home_notes: >-
      {{ (sch_home_notes | default([])) + ["maven: $HOME is '" ~ ansible_facts.env.HOME ~ "' but the passwd home is '" ~ maven_user_home_resolved ~ "' — settings.xml goes to " ~ maven_user_home_resolved ~ "/.m2, where maven looks, not under $HOME."] }}
  when:
    - mvn_check.rc == 0
    - sch_passwd_apart | bool

- name: Record skipped protection — no passwd home the maven settings.xml could go to
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['maven settings.xml — uid ' ~ (sch_passwd_uid | default('?', true)) ~ ' has no passwd home it can write (passwd says: ' ~ (sch_passwd_entry | default('', true) or 'nothing') ~ '), so settings.xml was written to ' ~ maven_user_home_resolved ~ '/.m2, under $HOME. Maven takes its home from the passwd entry, not $HOME, so it may not read it. Give the account a home it can write, and re-apply.'] }}
  when:
    - mvn_check.rc == 0
    - sch_passwd_home | default('', true) | length == 0
    - sch_passwd_kept_out | length == 0
    - not (sch_passwd_at_home | bool)

- name: Record skipped protection — root by way of sudo or doas, with another account's HOME
  # Reached only where files/user-config.sh let root write under that HOME (one
  # no other account controls): maven run as root reads root's passwd home.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ["maven settings.xml — this is root reached by sudo or doas from " ~ sch_passwd_kept_out ~ ", and $HOME (" ~ ansible_facts.env.HOME ~ ") is not root's passwd home (" ~ (sch_passwd_home | default('', true) or sch_passwd_entry) ~ "), so settings.xml was written to " ~ maven_user_home_resolved ~ "/.m2, which maven run as root does not read. Run this as " ~ sch_passwd_kept_out ~ ", not as root, and re-apply."] }}
  when:
    - mvn_check.rc == 0
    - sch_passwd_kept_out | length > 0

- name: Record skipped protection — neither mvn nor a JDK
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['maven settings.xml — neither mvn nor a JDK (java on PATH, or $JAVA_HOME/bin/java) was found, so no settings were deployed. Installing either later will NOT pick up this hardening; re-run the role.'] }}
  when: mvn_check.rc != 0
