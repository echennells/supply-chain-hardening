---
# System-wide supply chain environment variables
# Deployed to /etc/profile.d/ so they apply to ALL users, ALL shells,
# ALL login types — interactive, non-interactive, agent-spawned.
# Config files deployed unconditionally — harmless if the tool isn't
# installed yet, ready the instant it is.

- name: Record skipped protection — UV_EXCLUDE_NEWER needs an absolute cutoff
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['UV_EXCLUDE_NEWER — uv_exclude_newer_env
         is on, but uv_exclude_newer is pinned to ' ~ (sch_uv_cutoff | string) ~ ', which is
         not an absolute RFC 3339 instant (a date is read in local time, and a span is
         a hard error on uv 0.9.16 and older in an env var), so it was not exported. A
         project''s own exclude-newer still outranks the host cutoff. Pin an instant such
         as 2026-10-19T00:00:00Z to export it.'] }}
  when:
    - uv_exclude_newer_env | default(false) | bool
    - sch_uv_env_cutoff | length == 0
  tags: [shell]

# NPM_CONFIG_MIN_RELEASE_AGE and NPM_CONFIG_ALLOW_GIT depend on the npm found
# (sch_npm_writes_min_release_age in defaults/main.yml). This file renders on
# every run, so one scoped away from npm (--tags pnpm) asks the same npms itself
# rather than flip a variable on a host whose npm warns about it.
- name: Find the npm versions the npm variables depend on
  ansible.builtin.import_tasks: npm_versions.yml
  tags: [shell]

- name: Deploy system-wide supply chain env vars
  become: true
  ansible.builtin.template:
    src: supply-chain-env.sh.j2
    dest: /etc/profile.d/supply-chain-hardening.sh
    mode: "0644"
    owner: root
    group: root
  tags: [shell]

# /etc/environment is parsed by TWO consumers with different grammars:
# pam_env (tolerant: accepts a bare KEY=) and, on systemd hosts where
# /usr/lib/environment.d/*.conf symlinks to it, systemd-environment-d-generator
# (strict: rejects an empty-value KEY= as "invalid syntax" and logs a warning
# at every login). GOPRIVATE/GONOPROXY/GOINSECURE default to "" (empty is
# equivalent to unset for Go), which emitted bare `GOPRIVATE=` lines and
# per-login journal noise. Build the block from KEY=VALUE pairs and drop any
# whose value is empty so neither parser complains — the dropped vars are
# exactly the ones for which empty means unset anyway.
- name: Assemble /etc/environment lines
  ansible.builtin.set_fact:
    sch_environment_pairs:
      - "NPM_CONFIG_IGNORE_SCRIPTS={{ npm_ignore_scripts | lower }}"
      - "NPM_CONFIG_AUDIT={{ npm_audit | lower }}"
      - "NPM_CONFIG_SAVE_EXACT={{ npm_save_exact | lower }}"
      - "NPM_CONFIG_FUND={{ npm_fund | lower }}"
      - "NPM_CONFIG_UPDATE_NOTIFIER={{ npm_update_notifier | lower }}"
      # Empty where the npm found would warn about it (see above), so the
      # reject() below drops it.
      - "NPM_CONFIG_MIN_RELEASE_AGE={{ npm_minimum_release_age_days if sch_npm_writes_min_release_age | bool else '' }}"
      - "NPM_CONFIG_ALLOW_GIT={{ 'none' if sch_npm_writes_allow_git | bool else '' }}"
      - "pnpm_config_minimum_release_age={{ pnpm_minimum_release_age_minutes }}"
      # A JSON array, never empty: "[]" for no exclusions (see defaults/main.yml).
      - "pnpm_config_minimum_release_age_exclude={{ sch_pnpm_exclude_json }}"
      - "PYTHONDONTWRITEBYTECODE={{ python_dont_write_bytecode | int }}"
      - "PIP_DISABLE_PIP_VERSION_CHECK={{ pip_disable_version_check | int }}"
      - "UV_LINK_MODE=copy"
      - "GOSUMDB={{ go_sumdb }}"
      - "GOPROXY={{ go_proxy }}"
      # Empty when goflags_mod is "" (the default), so the reject() below drops it.
      - "GOFLAGS={{ ('-mod=' ~ goflags_mod) if goflags_mod | length > 0 else '' }}"
      - "GOPRIVATE={{ go_private }}"
      - "GONOPROXY={{ go_noproxy }}"
      - "GOINSECURE={{ go_insecure }}"
      - "GOTOOLCHAIN=local"
      - "COMPOSER_SKIP_SCRIPTS=pre-install-cmd,post-install-cmd,pre-update-cmd,post-update-cmd,pre-status-cmd,post-status-cmd,pre-autoload-dump,post-autoload-dump,post-root-package-install,post-create-project-cmd,pre-archive-cmd,post-archive-cmd,pre-package-install,post-package-install,pre-package-update,post-package-update,pre-package-uninstall,post-package-uninstall,init,command,pre-file-download,post-file-download,pre-command-run,pre-pool-create"
      - "COMPOSER_POLICY_COOLDOWN_PERIOD={{ composer_cooldown_seconds }}"
      - "COMPOSER_POLICY_COOLDOWN_BLOCK=1"
      - "BUNDLE_COOLDOWN={{ bundler_cooldown_days }}"
      - "POETRY_SOLVER_MIN_RELEASE_AGE={{ poetry_min_release_age_days }}"
      - "DOTNET_NUGET_SIGNATURE_VERIFICATION=true"
  tags: [shell]
- name: Deploy to /etc/environment for non-login shells
  become: true
  ansible.builtin.blockinfile:
    path: /etc/environment
    marker: "# {mark} SUPPLY CHAIN HARDENING (managed by ansible)"
    create: true
    mode: "0644"
    block: "{{ sch_environment_pairs | reject('match', '.*=$') | join('\n') }}"
  tags: [shell]
