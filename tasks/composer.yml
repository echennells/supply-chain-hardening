---
# Composer (PHP) supply chain hardening.
# Config deployed unconditionally; the rendered tier matches the detected
# Composer version (or falls back to a safe baseline when Composer isn't
# installed at apply time).
#
# NOTE on script blocking: composer has NO host-wide config-file or env-var
# mechanism to disable script execution. COMPOSER_NO_SCRIPTS is a made-up
# name (composer ignores it); "scripts-are-disabled" is not in composer's
# JSON schema. The only real primitives are --no-scripts (CLI flag) and
# COMPOSER_SKIP_SCRIPTS=<event,list> (MEASURED: honoured from composer
# 2.8.0 — silently ignored on 2.2.6 and 2.7.1, honoured on 2.8.12+; this
# comment previously said 2.9 and that number was wrong. Requires
# enumerating every event name). The /usr/local/bin/composer wrapper below
# is the primary layer; the env var is the backup for callers that bypass
# it, and it buys nothing at all on composer 2.2-2.7 — recorded in
# skipped_protections there rather than left to read as coverage.
#
# Tier breakdown (see README → Limitations for distro-version mapping):
#   Composer ≥ 2.9   : allow-plugins + audit (abandoned + block-insecure + block-abandoned)
#   Composer 2.7-2.8 : allow-plugins + audit (abandoned only)
#   Composer < 2.7   : allow-plugins only (audit key added in 2.7.0)
#   Not installed    : safe baseline; re-run role after install to upgrade tier
#
# Two further thresholds, both MEASURED across composer 2.0.14 → 2.10.3 and
# both handled in the templates rather than here:
#   < 2.2.15 : "allow-plugins": false is a HARD FATAL (array_merge TypeError,
#              exit 255 on every command but --version). Ubuntu 22.04 ships
#              2.2.6. composer-config.json.j2 emits {} — the empty allowlist,
#              same protection — below 2.2.15 and when the version is unknown.
#   <= 2.1   : --no-scripts is not an application-level option; only
#              install/update/require/remove/dump-autoload declare it.
#              composer-wrapper.sh.j2 injects it unconditionally from 2.2.0
#              and per-subcommand below that. --no-plugins IS global that far
#              back and is always injected.

- name: Detect installed Composer version (empty if not installed)
  # Pull the X.Y.Z out of `composer --version` output:
  #   "Composer version 2.7.1 2024-02-09 15:26:28"
  # sed -n + /p only prints when the pattern matches, so any pre-version
  # warning lines (e.g. "Do not run Composer as root!") are skipped.
  # `command -v composer` short-circuits when Composer isn't on PATH —
  # `exit 0` then leaves stdout empty, which the template treats as "unknown
  # version, use safe baseline".
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      command -v composer >/dev/null 2>&1 || exit 0
      composer --version --no-ansi 2>/dev/null \
        | sed -nE 's/^Composer version ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' \
        | head -1
    executable: /bin/bash
  register: composer_version_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Set composer_detected_version fact
  ansible.builtin.set_fact:
    composer_detected_version: "{{ composer_version_check.stdout | default('') | trim }}"

- name: Warn when Composer is installed but below 2.9 (audit block-* keys inert)
  # block-insecure and block-abandoned require Composer ≥ 2.9.0 (2025-11).
  # The template omits them on older Composer so the config.json stays valid.
  # Surfacing the warning here is the user-visible signal that those specific
  # protections didn't apply on this host — everything else still does.
  ansible.builtin.debug:
    msg: >-
      Composer {{ composer_detected_version }} detected. The audit.block-insecure
      and audit.block-abandoned settings require Composer >= 2.9 and will not be
      written. Other hardening (secure-http, allow-plugins, preferred-install)
      still applies on this host.
  when:
    - composer_detected_version | length > 0
    - composer_detected_version is version('2.9.0', '<')

- name: Record skipped protection — COMPOSER_SKIP_SCRIPTS inert (Composer < 2.8)
  # MEASURED: COMPOSER_SKIP_SCRIPTS is honoured from composer 2.8.0 — silently
  # ignored on 2.2.6 (Ubuntu 22.04) and 2.7.1 (Ubuntu 24.04), honoured on
  # 2.8.12+. shell_env.yml writes the var on every host, so without this record
  # the run reports a belt-and-suspenders layer that does nothing here.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['COMPOSER_SKIP_SCRIPTS — Composer ' ~ composer_detected_version ~ ' ignores it (MEASURED: honoured from 2.8.0). The env-var backup layer in /etc/environment and /etc/profile.d is inert on this host, so the /usr/local/bin/composer wrapper is the ONLY layer blocking composer scripts; `php composer.phar` callers that bypass the wrapper are not covered. Upgrade Composer to >= 2.8 to close this.'] }}
  when:
    - composer_detected_version | length > 0
    - composer_detected_version is version('2.8.0', '<')

- name: Create composer config directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/composer"
    state: directory
    mode: "0755"

- name: Deploy hardened composer config.json (tier matches detected version)
  ansible.builtin.template:
    src: composer-config.json.j2
    dest: "{{ ansible_env.HOME }}/.config/composer/config.json"
    mode: "0644"

# /root coverage for `sudo composer …`. Composer has no /etc/composer system
# path, and sudo flips HOME to /root, so the per-user write above misses the
# sudo invocation path. Writing to /root/.config/composer/ closes that.
# When the role itself is run as root, the dest below is identical to the
# per-user dest — the task becomes an idempotent re-render of the same file.
- name: Create /root composer config directory (sudo coverage)
  become: true
  ansible.builtin.file:
    path: /root/.config/composer
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy hardened composer config.json to /root (sudo coverage)
  become: true
  ansible.builtin.template:
    src: composer-config.json.j2
    dest: /root/.config/composer/config.json
    owner: root
    group: root
    mode: "0644"

# --- /usr/local/bin/composer wrapper (primary layer) ---
# Composer has no host-wide config-file or env-var way to disable script
# execution. The wrapper at the discovered composer path injects
# --no-scripts and --no-plugins on every invocation. /etc/profile.d/ and
# /etc/environment also set COMPOSER_SKIP_SCRIPTS=<event,list> as
# belt-and-suspenders for `php composer.phar` callers that bypass the
# wrapper but inherit the system env (PAM-loaded shells only); the
# env-var layer also catches composer-real invocations in those shells
# — by design. Documented bypass for both layers:
#   COMPOSER_SKIP_SCRIPTS= /usr/local/bin/composer-real install
#
# Self-update caveat: `composer self-update` overwrites the wrapper.
# Detection below sees a fresh real binary at the wrap location and
# re-wraps on the next role apply. Same pattern as deno's wrapper.

- name: Find current composer path for wrapping
  ansible.builtin.shell:
    cmd: |
      for p in /usr/local/bin/composer /usr/bin/composer; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      command -v composer 2>/dev/null
    executable: /bin/bash
  register: composer_binary_path
  changed_when: false
  check_mode: false
  failed_when: false
  when: composer_path_wrapper | bool

- name: Determine whether current composer binary is our wrapper or the real binary
  ansible.builtin.shell:
    cmd: |
      if grep -q 'supply-chain-hardening' '{{ composer_binary_path.stdout }}' 2>/dev/null; then
        echo is_wrapper
      else
        echo is_real
      fi
    executable: /bin/bash
  register: composer_binary_kind
  changed_when: false
  check_mode: false
  when:
    - composer_path_wrapper | bool
    - composer_binary_path is defined
    - composer_binary_path.rc == 0
    - composer_binary_path.stdout | length > 0

- name: Check whether a composer-real backup exists (from prior wrapper run)
  ansible.builtin.stat:
    path: "{{ composer_binary_path.stdout }}-real"
  register: composer_real_backup
  when:
    - composer_path_wrapper | bool
    - composer_binary_path is defined
    - composer_binary_path.rc == 0
    - composer_binary_path.stdout | length > 0

- name: Rename real composer to composer-real (refresh backup if self-update overwrote wrapper)
  # No gate on `not composer_real_backup.stat.exists`: if composer
  # self-update overwrote our wrapper, the existing backup is stale and
  # the freshly-installed binary is what we want to preserve. Overwriting
  # a stale backup with the current binary is the correct semantics.
  become: true
  ansible.builtin.command:
    cmd: "mv {{ composer_binary_path.stdout }} {{ composer_binary_path.stdout }}-real"
  when:
    - composer_path_wrapper | bool
    - composer_binary_path is defined
    - composer_binary_path.rc == 0
    - composer_binary_path.stdout | length > 0
    - composer_binary_kind.stdout == 'is_real'
  changed_when: true

- name: Deploy composer wrapper at the discovered composer path
  become: true
  ansible.builtin.template:
    src: composer-wrapper.sh.j2
    dest: "{{ composer_binary_path.stdout }}"
    owner: root
    group: root
    mode: "0755"
  vars:
    composer_real_path: "{{ composer_binary_path.stdout }}-real"
  when:
    - composer_path_wrapper | bool
    - composer_binary_path is defined
    - composer_binary_path.rc == 0
    - composer_binary_path.stdout | length > 0

- name: Record skipped protection — wrapper --no-scripts is subcommand-gated (Composer <= 2.1)
  # MEASURED (composer 2.0.14 → 2.10.3): --no-scripts became an
  # application-level option in 2.2.0. On 2.0/2.1 only install, update,
  # require, remove and dump-autoload declare it, and injecting it anywhere
  # else makes `composer show`, `composer config` and `composer diagnose` die
  # with `The "--no-scripts" option does not exist.` The wrapper therefore
  # gates the injection on those hosts — which means the subcommands that are
  # NOT in that list run without it. Same record when the version could not be
  # detected, because the wrapper then renders the same safe baseline.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['composer wrapper --no-scripts (partial) — Composer ' ~ (composer_detected_version | default('', true) | default('<undetected>', true)) ~ ' does not accept --no-scripts as a global option (it became one in 2.2.0), so the wrapper injects it only for install/update/require/remove/dump-autoload. create-project, run-script and exec run WITHOUT it on this host. --no-plugins is unaffected. Upgrade Composer to >= 2.2 and re-run to make the injection unconditional.'] }}
  when:
    - composer_path_wrapper | bool
    - composer_binary_path is defined
    - composer_binary_path.rc | default(1) == 0
    - composer_binary_path.stdout | default('') | length > 0
    - composer_detected_version | length == 0
      or composer_detected_version is version('2.2.0', '<')

- name: Restore original composer binary when wrapper is disabled
  become: true
  ansible.builtin.command:
    cmd: "mv {{ composer_binary_path.stdout }}-real {{ composer_binary_path.stdout }}"
  when:
    - not (composer_path_wrapper | bool)
    - composer_binary_path is defined
    - composer_binary_path.rc == 0
    - composer_binary_path.stdout | length > 0
    - composer_binary_kind is defined
    - composer_binary_kind.stdout == 'is_wrapper'
    - composer_real_backup is defined
    - composer_real_backup.stat.exists
  changed_when: true
