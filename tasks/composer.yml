---
# Composer (PHP) supply chain hardening.
# Config deployed unconditionally; the rendered tier matches the detected
# Composer version (or falls back to a safe baseline when Composer isn't
# installed at apply time).
#
# NOTE on script blocking: composer has NO host-wide config-file or env-var
# mechanism to disable script execution. COMPOSER_NO_SCRIPTS is a made-up
# name (composer ignores it); "scripts-are-disabled" is not in composer's
# JSON schema. The only real primitives are --no-scripts (CLI flag) and
# COMPOSER_SKIP_SCRIPTS=<event,list> (MEASURED: honoured from composer
# 2.8.6 — ignored on 2.2.6, 2.7.1 and 2.8.0-2.8.5, honoured on 2.8.6+; this
# comment previously said 2.9 and that number was wrong. Requires
# enumerating every event name). The composer wrapper below (at the
# discovered path: /usr/local/bin/composer or /usr/bin/composer) is the
# primary layer; the env var is the backup for callers that bypass
# it, and it buys nothing at all on composer 2.2-2.7 — recorded in
# skipped_protections there rather than left to read as coverage.
#
# Tier breakdown (see README → Limitations for distro-version mapping):
#   Composer ≥ 2.9   : allow-plugins + audit (abandoned + block-insecure + block-abandoned)
#   Composer 2.7-2.8 : allow-plugins + audit (abandoned only)
#   Composer < 2.7   : allow-plugins only (audit key added in 2.7.0)
#   Not installed    : safe baseline; re-run role after install to upgrade tier
#
# The publish-age gate (config.policy.cooldown) is written on EVERY tier:
#   Composer >= 2.11 : enforced
#   Composer < 2.11  : ignored with exit 0 (MEASURED 2.0.9 → 2.10.3), recorded in
#                      skipped_protections below, and activates on upgrade
# No distro release this role declares ships 2.11, so on a stock host this gate
# is a GAP until Composer is upgraded: docs/composer-bundler-cooldown-by-distro.md.
#
# Two further thresholds, both MEASURED across composer 2.0.14 → 2.10.3 and
# both handled in the templates rather than here:
#   < 2.2.15 : "allow-plugins": false is a HARD FATAL (array_merge TypeError,
#              exit 255 on every command but --version). Ubuntu 22.04 ships
#              2.2.6. composer-config.json.j2 emits {} — the empty allowlist,
#              same protection — below 2.2.15 and when the version is unknown.
#   <= 2.1   : --no-scripts is not an application-level option; only
#              install/update/require/remove/dump-autoload/create-project
#              (and reinstall, 2.1) declare it. composer-wrapper.sh.j2
#              injects it on every invocation from 2.2.0 (except a script run
#              by name) and per command below, under any alias or unique
#              prefix of the name. --no-plugins IS global that far back and
#              is always injected.

- name: Detect installed Composer version (empty if not installed)
  # Pull the X.Y.Z out of `composer --version` output:
  #   "Composer version 2.7.1 2024-02-09 15:26:28"   (upstream phar)
  #   "Composer 2.2.6 2022-02-04 17:00:38"           (Debian/Ubuntu apt)
  # The apt build omits the word "version". Anchoring on it made
  # detection fail on EVERY apt composer, which silently downgraded the
  # wrapper and suppressed the skipped_protections records.
  # sed -n + /p only prints when the pattern matches, so any pre-version
  # warning lines (e.g. "Do not run Composer as root!") are skipped.
  # `command -v composer` short-circuits when Composer isn't on PATH —
  # `exit 0` then leaves stdout empty, which the template treats as "unknown
  # version, use safe baseline".
  # --no-plugins and chdir /: composer boots the project in its working
  # directory even for --version, and activates the plugins that project allows
  # (MEASURED on 2.11.2, action/harden.sh run inside a checkout). Ansible runs
  # this in whatever directory the play was started from, or the remote home.
  ansible.builtin.shell:
    chdir: /
    cmd: |
      set -o pipefail
      command -v composer >/dev/null 2>&1 || exit 0
      composer --version --no-ansi --no-plugins 2>/dev/null \
        | sed -nE 's/^Composer (version )?([0-9]+\.[0-9]+\.[0-9]+).*$/\2/p' \
        | head -1
    executable: /bin/bash
  register: composer_version_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Set composer_detected_version fact
  ansible.builtin.set_fact:
    composer_detected_version: "{{ composer_version_check.stdout | default('') | trim }}"

- name: Record skipped protection — audit blocking unavailable (Composer < 2.9)
  # block-insecure and block-abandoned require Composer ≥ 2.9.0 (2025-11), and
  # the audit key itself 2.7.0. The template omits them on older Composer so the
  # config.json stays valid. This was a debug message that scrolled past; the
  # end-of-run summary is where a skipped protection has to appear, and the
  # verifier already reports it as a toolchain GAP.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Composer audit blocking — Composer ' ~ composer_detected_version ~ (' has no audit config at all (audit.* added in 2.7.0)' if composer_detected_version is version('2.7.0', '<') else ' supports only audit.abandoned, not audit.block-insecure / block-abandoned (added in 2.9.0)') ~ ', so a package with a known advisory still installs. Other hardening (secure-http, allow-plugins, preferred-install) still applies. See docs/composer-bundler-cooldown-by-distro.md'] }}
  when:
    - composer_detected_version | length > 0
    - composer_detected_version is version('2.9.0', '<')

- name: Record skipped protection — COMPOSER_SKIP_SCRIPTS inert (Composer < 2.8.6)
  # MEASURED: COMPOSER_SKIP_SCRIPTS is honoured from composer 2.8.6 (2.8.4 and 2.8.5
  # ran every script with it set; 2.8.6 logged "Skipped script listeners") — silently
  # ignored on 2.2.6 (Ubuntu 22.04) and 2.7.1 (Ubuntu 24.04), honoured on
  # 2.8.12+. shell_env.yml writes the var on every host, so without this record
  # the run reports a belt-and-suspenders layer that does nothing here.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['COMPOSER_SKIP_SCRIPTS — Composer ' ~ composer_detected_version ~ ' ignores it (MEASURED: honoured from 2.8.6; 2.8.5 ignores it). The env-var backup layer in /etc/environment and /etc/profile.d is inert on this host, so the composer wrapper is the ONLY layer blocking composer scripts; composer-real and `php composer.phar` callers that bypass the wrapper are not covered. Upgrade Composer to >= 2.8.6 to close this.'] }}
  when:
    - composer_detected_version | length > 0
    - composer_detected_version is version('2.8.6', '<')

- name: Record skipped protection — publish-age gate inert (Composer < 2.11)
  # MEASURED (2.0.9 → 2.11.1): config.policy.cooldown is ignored with exit 0
  # below 2.11.0, and `composer config --list` echoes it back on those versions
  # too, so neither the file nor a readback shows the gap. Only this does.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['Composer publish-age gate — Composer ' ~ composer_detected_version ~ ' ignores config.policy.cooldown (MEASURED: added in 2.11.0). The key is written and activates on upgrade; until then new releases resolve immediately. See docs/composer-bundler-cooldown-by-distro.md'] }}
  when:
    - composer_detected_version | length > 0
    - composer_detected_version is version('2.11.0', '<')

- name: Deploy hardened composer config.json (tier matches detected version)
  # JSON has no comment for a marker, so this one is judged by its lines: ours when
  # some version of this project has written every one of them (files/user-config.sh,
  # ucf_old_file). Anything else, a repository with credentials in it for one,
  # stopped the play in preflight, unless accept_user_config_overwrite=true, which
  # copies it first. MEASURED at 860a91c: it was replaced on every apply with no
  # check, and --diff printed what was in it. auth.json is not touched.
  #
  # ~/.config/composer, or ~/.composer where only that one is there: making the
  # first hid the second, and the tokens in its auth.json, from composer (MEASURED,
  # 2.11.2). The script resolves it (ucf_composer_base).
  ansible.builtin.script: user-config.sh replace composer
  args:
    executable: /bin/bash
  environment:
    # A leading x, which the script takes off: ansible-core before 2.19 turns a
    # string that starts with { into a dict.
    SCH_UCF_BODY: "{{ lookup('ansible.builtin.template', 'composer-config.json.j2', template_vars={'sch_body_prefix': 'x'}) }}"
    SCH_UCF_DRY: "{{ ansible_check_mode | ternary('1', '0') }}"
    SCH_UCF_FOREIGN: "{{ (accept_user_config_overwrite | default(false) | bool) | ternary('keep', 'refuse') }}"
  register: sch_ucf_composer
  check_mode: false
  changed_when: "'changed' in (sch_ucf_composer.stdout_lines | default([]))"

# /root coverage for `sudo composer …`. Composer has no /etc/composer system
# path, and sudo flips HOME to /root, so the per-user write above misses the
# sudo invocation path. Writing to root's own home closes that. Root's file is
# root's own configuration: one that is not exactly what this project last wrote
# is left alone, and the summary says so, as for root's ~/.yarnrc.yml.
# When the role itself is run as root, this is the file written above.
- name: Deploy hardened composer config.json to /root (sudo coverage)
  become: true
  ansible.builtin.script: user-config.sh replace composer
  args:
    executable: /bin/bash
  environment:
    HOME: /root
    SCH_UCF_BODY: "{{ lookup('ansible.builtin.template', 'composer-config.json.j2', template_vars={'sch_body_prefix': 'x'}) }}"
    SCH_UCF_DRY: "{{ ansible_check_mode | ternary('1', '0') }}"
    SCH_UCF_FOREIGN: "refuse"
    SCH_UCF_ROOT: "1"
  register: sch_ucf_composer_root
  check_mode: false
  changed_when: "'changed' in (sch_ucf_composer_root.stdout_lines | default([]))"
  failed_when: sch_ucf_composer_root.rc | default(2) not in [0, 1, 42]

# ECH-169. ~/.config/composer is NOT where composer reads its global config on
# most hosts. MEASURED: composer's home is /root/.composer (or ~/.composer, or
# $XDG_CONFIG_HOME/composer) depending on version, XDG and whether a legacy
# ~/.composer already exists — writing 888 there makes `composer config` report 888;
# writing it to ~/.config/composer leaves composer on its default. The writes above
# are the safe baseline used when composer is absent at apply time; when composer IS
# installed, ALSO write to the directory it actually reads.
#
# Worked out by composer's own rule (ucf_composer_home in files/user-config.sh, which
# says what it was compared with), not by asking composer: `composer config --global
# home` writes config.json, auth.json, .htaccess and a cache directory into the home
# it is asked about, under --check too (MEASURED at 860a91c).
- name: Deploy hardened composer config.json to composer's real home (invoking user)
  ansible.builtin.script: user-config.sh replace composer-home
  args:
    executable: /bin/bash
  environment:
    SCH_UCF_BODY: "{{ lookup('ansible.builtin.template', 'composer-config.json.j2', template_vars={'sch_body_prefix': 'x'}) }}"
    SCH_UCF_DRY: "{{ ansible_check_mode | ternary('1', '0') }}"
    SCH_UCF_FOREIGN: "{{ (accept_user_config_overwrite | default(false) | bool) | ternary('keep', 'refuse') }}"
  register: sch_ucf_composer_home
  check_mode: false
  changed_when: "'changed' in (sch_ucf_composer_home.stdout_lines | default([]))"
  when: composer_detected_version | length > 0

- name: Deploy hardened composer config.json to root's real composer home (sudo coverage)
  become: true
  ansible.builtin.script: user-config.sh replace composer-home
  args:
    executable: /bin/bash
  environment:
    HOME: /root
    SCH_UCF_BODY: "{{ lookup('ansible.builtin.template', 'composer-config.json.j2', template_vars={'sch_body_prefix': 'x'}) }}"
    SCH_UCF_DRY: "{{ ansible_check_mode | ternary('1', '0') }}"
    SCH_UCF_FOREIGN: "refuse"
    SCH_UCF_ROOT: "1"
  register: sch_ucf_composer_home_root
  check_mode: false
  changed_when: "'changed' in (sch_ucf_composer_home_root.stdout_lines | default([]))"
  failed_when: sch_ucf_composer_home_root.rc | default(2) not in [0, 1, 42]
  when: composer_detected_version | length > 0

- name: Record skipped protection — root's own composer config.json
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + [
           ('Composer sudo coverage — ' ~ (item.stdout_lines | select('match', 'path ') | map('regex_replace', '^path ', '') | first | default('the composer config.json of root')) ~ (' is not exactly what this project last wrote, so it was left alone (it may hold a repository and its credentials).' if item.rc == 42 else ' could not be written: ' ~ (item.stdout_lines | select('match', 'error: ') | map('regex_replace', '^error: ', '') | join('; ')) ~ '.') ~ ' `sudo composer` reads that file, not the settings this role writes. Move it aside and re-apply.')
         ] }}
  loop: "{{ [sch_ucf_composer_root, sch_ucf_composer_home_root] }}"
  loop_control:
    label: "{{ item.rc | default('skipped') }}"
  when: item.rc | default(0) != 0

# --- composer wrapper at the discovered path (primary layer) ---
# Composer has no host-wide config-file or env-var way to disable script
# execution. The wrapper at the discovered composer path (/usr/local/bin/composer
# for the upstream installer, /usr/bin/composer for the distro package) injects
# --no-plugins on every invocation and --no-scripts on every invocation except
# a script run by name (see the template header). /etc/profile.d/ and
# /etc/environment also set COMPOSER_SKIP_SCRIPTS=<event,list> as
# belt-and-suspenders for `php composer.phar` callers that bypass the
# wrapper but inherit the system env (PAM-loaded shells only); the
# env-var layer also catches composer-real invocations in those shells
# — by design. Documented bypass for both layers, with the real binary next to
# the wrapper (/usr/local/bin/composer-real or /usr/bin/composer-real):
#   COMPOSER_SKIP_SCRIPTS= <wrapper path>-real install
#
# Package-manager caveat: `apt-get install --reinstall composer` (or an upgrade)
# writes the stock /usr/bin/composer back over the wrapper. MEASURED on 2.7.1:
# the verifier then reports GAP on the wrapper and lifecycle rows, and the next
# apply re-wraps. dpkg-divert would survive package operations; not done yet.
#
# Re-install caveat: writing a new composer.phar to the wrap location (re-running
# the upstream installer, or `install composer.phar /usr/local/bin/composer`)
# replaces the wrapper. Detection below sees a fresh real binary there and
# re-wraps on the next role apply. Same pattern as deno's wrapper.
# `composer self-update` is different: it replaces the file it runs from,
# composer-real, so the wrapper survives (MEASURED, 2.8.8 -> 2.9.5 through the
# wrapper). Re-apply anyway, so the version-tiered settings follow.

# The three read-only probes below run whether or not composer_path_wrapper is
# on: composer_path_wrapper=false has to find the wrapper an earlier apply left
# and put composer-real back (the restore task at the end). Gating them on the
# switch left the restore reading registers of skipped tasks, which have no rc
# or stdout. MEASURED on 6c77f4e: a re-apply with composer_path_wrapper=false
# failed the play there with "'dict object' has no attribute 'rc'", and the
# wrapper stayed in place.
- name: Find current composer path for wrapping
  ansible.builtin.shell:
    cmd: |
      for p in /usr/local/bin/composer /usr/bin/composer; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      command -v composer 2>/dev/null
    executable: /bin/bash
  register: composer_binary_path
  changed_when: false
  check_mode: false
  failed_when: false

- name: Determine whether current composer binary is our wrapper or the real binary
  ansible.builtin.shell:
    cmd: |
      if {{ sch_is_wrapper_sh }} '{{ composer_binary_path.stdout }}' 2>/dev/null; then
        echo is_wrapper
      else
        echo is_real
      fi
    executable: /bin/bash
  register: composer_binary_kind
  changed_when: false
  check_mode: false
  when:
    - composer_binary_path.rc | default(1) == 0
    - composer_binary_path.stdout | default('') | length > 0

- name: Check whether a composer-real backup exists (from prior wrapper run)
  ansible.builtin.stat:
    path: "{{ composer_binary_path.stdout }}-real"
  register: composer_real_backup
  when:
    - composer_binary_path.rc | default(1) == 0
    - composer_binary_path.stdout | default('') | length > 0

- name: Rename real composer to composer-real (refresh backup if a re-install overwrote wrapper)
  # No gate on `not composer_real_backup.stat.exists`: if a re-install
  # overwrote our wrapper, the existing backup is stale and
  # the freshly-installed binary is what we want to preserve. Overwriting
  # a stale backup with the current binary is the correct semantics.
  become: true
  ansible.builtin.command:
    cmd: "mv {{ composer_binary_path.stdout }} {{ composer_binary_path.stdout }}-real"
  when:
    - composer_path_wrapper | bool
    - composer_binary_path.rc | default(1) == 0
    - composer_binary_path.stdout | default('') | length > 0
    - composer_binary_kind.stdout | default('') == 'is_real'
  changed_when: true

- name: Deploy composer wrapper at the discovered composer path
  become: true
  ansible.builtin.template:
    src: composer-wrapper.sh.j2
    dest: "{{ composer_binary_path.stdout }}"
    owner: root
    group: root
    mode: "0755"
  vars:
    composer_real_path: "{{ composer_binary_path.stdout }}-real"
  when:
    - composer_path_wrapper | bool
    - composer_binary_path.rc | default(1) == 0
    - composer_binary_path.stdout | default('') | length > 0

- name: Record skipped protection — wrapper --no-scripts is subcommand-gated (Composer <= 2.1)
  # MEASURED (composer 2.0.14 → 2.10.3): --no-scripts became an
  # application-level option in 2.2.0. On 2.0/2.1 only install, update,
  # require, remove, dump-autoload, create-project and reinstall (2.1.14's
  # `composer list --format=json`; 2.0.14 has no reinstall) declare it, and
  # injecting it anywhere else makes `composer show`, `composer config` and
  # `composer diagnose` die with `The "--no-scripts" option does not exist.`
  # The wrapper therefore gates the injection on those hosts — which means the
  # subcommands that are NOT in that list run without it. Same record when the
  # version could not be detected, because the wrapper then renders the same
  # safe baseline.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['composer wrapper --no-scripts (partial) — Composer ' ~ (composer_detected_version | default('', true) | default('<undetected>', true)) ~ ' does not accept --no-scripts as a global option (it became one in 2.2.0), so the wrapper injects it only for the commands that declare it here (install, update, require, remove, dump-autoload, create-project, reinstall, under any alias or abbreviation). Every other command, exec included, runs WITHOUT it on this host (a script run by name runs on every version, on purpose). --no-plugins is unaffected. Upgrade Composer to >= 2.2 and re-run to cover every command.'] }}
  when:
    - composer_path_wrapper | bool
    - composer_binary_path is defined
    - composer_binary_path.rc | default(1) == 0
    - composer_binary_path.stdout | default('') | length > 0
    - composer_detected_version | length == 0
      or composer_detected_version is version('2.2.0', '<')

- name: Restore original composer binary when wrapper is disabled
  # composer_path_wrapper=false: the documented way back (defaults/main.yml).
  # Puts composer-real back at the path the wrapper held. The env-var layer
  # (COMPOSER_SKIP_SCRIPTS) is left as it is.
  become: true
  ansible.builtin.command:
    argv: [mv, -f, "{{ composer_binary_path.stdout }}-real", "{{ composer_binary_path.stdout }}"]
  when:
    - not (composer_path_wrapper | bool)
    - composer_binary_path.rc | default(1) == 0
    - composer_binary_path.stdout | default('') | length > 0
    - composer_binary_kind.stdout | default('') == 'is_wrapper'
    - composer_real_backup.stat.exists | default(false)
  changed_when: true
