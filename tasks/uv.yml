---
# uv / Python supply chain hardening
# Config deployed unconditionally; pip-redirect wrappers ONLY deployed when uv
# is actually present — otherwise the wrapper would recurse into itself and
# brick pip system-wide. See tests/bats/22-pip-wrapper-safety.bats.

- name: Determine uv user config directory
  # uv's user config is $XDG_CONFIG_HOME/uv/uv.toml, falling back to
  # $HOME/.config/uv/uv.toml ONLY when XDG_CONFIG_HOME is unset. Resolve it
  # from uv's environment rather than hardcoding $HOME/.config.
  # MEASURED: uv.toml at $HOME/.config/uv with XDG_CONFIG_HOME pointed
  # elsewhere -> uv reports `no_build: None`, i.e. it read nothing of ours,
  # while the verifier (sharing the same wrong assumption) still said OK.
  # docs/design-principles.md Axis 5, "Assumed canonical config homes".
  # NOT MEASURED, per uv's documentation only: UV_CONFIG_FILE / --config-file
  # names an explicit uv.toml that overrides the discovered user config. We do
  # not write to it (it is a caller-owned path); a host that sets it is not
  # covered by the file we deploy here.
  ansible.builtin.set_fact:
    uv_config_dir: >-
      {{
        ansible_env.XDG_CONFIG_HOME ~ '/uv'
        if ansible_env.XDG_CONFIG_HOME is defined and ansible_env.XDG_CONFIG_HOME | length > 0
        else ansible_env.HOME ~ '/.config/uv'
      }}

- name: Create uv config directory
  ansible.builtin.file:
    path: "{{ uv_config_dir }}"
    state: directory
    mode: "0755"

- name: Deploy hardened uv.toml
  ansible.builtin.template:
    src: uv.toml.j2
    dest: "{{ uv_config_dir }}/uv.toml"
    mode: "0644"

- name: Create system-wide uv config directory
  become: true
  ansible.builtin.file:
    path: /etc/uv
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy hardened /etc/uv/uv.toml (system-wide; covers sudo and non-deploying users)
  # uv's documented system config path on Linux/macOS. Without it,
  # `sudo uv pip install` (HOME=/root) and other-user invocations miss
  # exclude-newer (age gate) and no-build (wheels-only), the two
  # protections that block fresh malicious releases and setup.py
  # execution respectively.
  #
  # IMPORTANT: do NOT pair this with UV_NO_SYSTEM_CONFIG=1 in
  # /etc/environment or /etc/profile.d/. uv 0.11.16+ honors that env
  # var by skipping this file entirely — and PAM-loaded shells (login,
  # interactive sudo with env_reset) will see the env var, defeating
  # this fallback in exactly the contexts it exists for.
  become: true
  ansible.builtin.template:
    src: uv.toml.j2
    dest: /etc/uv/uv.toml
    owner: root
    group: root
    mode: "0644"

- name: Deploy the safe build escape-hatch (supply-chain-allow-build)
  # ECH-192. no-build=true blocks EVERY source build, including an editable
  # install of the operator's OWN trusted source. uv's built-in overrides are
  # footguns: --no-config drops all config, and --config-file / UV_CONFIG_FILE
  # REPLACE discovery, silently dropping the other four hardened settings. This
  # helper is the safe-by-construction path: it mirrors the hardened uv.toml,
  # flips ONLY no-build, and scopes that to one command. Deployed unconditionally
  # alongside the config (ready when uv arrives); it self-checks for a hardened
  # uv.toml at runtime and refuses non-uv commands.
  become: true
  ansible.builtin.copy:
    src: supply-chain-allow-build
    dest: /usr/local/bin/supply-chain-allow-build
    owner: root
    group: root
    mode: "0755"

- name: Find uv binary path
  # Check the canonical install location first. `bash -lc` (login shell) was
  # the previous approach but it's fragile: the uv installer adds PATH only
  # to ~/.bashrc, and login shells source ~/.bash_profile (not ~/.bashrc).
  # On real hosts where the user follows the official installer, a login
  # shell may have empty PATH for ~/.local/bin and `command -v uv` returns
  # nothing — pip wrappers then silently don't deploy.
  #
  # SYSTEM paths are searched BEFORE $HOME/.local/bin: the value found here is
  # baked into a SYSTEM-WIDE wrapper (/usr/local/bin/pip). Baking a home path
  # when a root-owned system uv also exists breaks every non-deploying,
  # non-root user who cannot traverse that home (0750/0700 is common on
  # hardened hosts) — see the wrapper's own runtime fallback below (#ECH-191).
  ansible.builtin.shell:
    cmd: |
      for p in /usr/local/bin/uv /usr/bin/uv "$HOME/.local/bin/uv"; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v uv 2>/dev/null
    executable: /bin/bash
  register: uv_binary_path
  changed_when: false
  check_mode: false
  failed_when: false

- name: Deploy pip wrapper to /usr/local/bin (system-wide, delegates to uv)
  become: true
  ansible.builtin.copy:
    dest: /usr/local/bin/pip
    mode: "0755"
    owner: root
    group: root
    content: |
      #!/bin/sh
      # Managed by ansible-supply-chain-security
      # Belt-and-suspenders: resolve a reachable uv (see the loop below) and
      # refuse to run if none is found, rather than recursing into ourselves
      # and bricking pip.
      UV='{{ uv_binary_path.stdout }}'
      # RUN-PROBE. Record that this wrapper actually executed.
      #
      # Free on a real invocation (SCH_WRAPPER_PROBE is unset, so this is one test).
      # supply-chain-verify sets it to a temp file, invokes the tool, and reads back
      # which wrappers ran.
      #
      # It replaces inferring "did our wrapper run" from PATH position, which CANNOT
      # tell a bypassed wrapper from one chained behind another wrap. MEASURED: with
      # an Aikido safe-chain shim first on PATH the wrapper ran on every call while
      # the verifier reported "shadowed and never runs". Every version manager
      # (asdf, mise, volta, nodenv, pyenv) is shim-first and delegates the same way.
      #
      # The value is caller-controlled, so it is only ever a redirect target. Never
      # interpolate it into a command.
      if [ -n "${SCH_WRAPPER_PROBE:-}" ]; then
        printf '%s\n' "$0" >> "$SCH_WRAPPER_PROBE" 2>/dev/null || true
      fi
      # ECH-191: this wrapper is SYSTEM-WIDE (/usr/local/bin, every account uses
      # it) but $UV was resolved in the DEPLOYING user's context. If uv lives in
      # that user's ~/.local/bin and their home is not traversable by others
      # (0750/0700 is common on hardened hosts), every other non-root user hits
      # the guard below and loses pip entirely. Resolve uv for THIS caller:
      # prefer a root-owned system copy, then the deploy-time path, then the
      # caller's PATH. Preferring the system copy also keeps a root `sudo pip`
      # from execing an unprivileged user's uv. Resolving `uv` (never `pip`)
      # cannot recurse into this wrapper.
      for _c in /usr/local/bin/uv /usr/bin/uv "$UV" "$(command -v uv 2>/dev/null)"; do
        if [ -n "$_c" ] && [ -x "$_c" ]; then UV="$_c"; break; fi
      done
      if [ -z "$UV" ] || [ ! -x "$UV" ]; then
        echo "[supply-chain-hardening] error: uv not found in /usr/local/bin, /usr/bin, the deploy-time path, or PATH; refusing to recurse" >&2
        exit 127
      fi
      echo "[supply-chain-hardening] pip redirected through uv" >&2
      exec "$UV" pip "$@"
  when: uv_binary_path.rc == 0 and uv_binary_path.stdout | length > 0

- name: Deploy pip3 wrapper to /usr/local/bin (system-wide, delegates to uv)
  become: true
  ansible.builtin.copy:
    dest: /usr/local/bin/pip3
    mode: "0755"
    owner: root
    group: root
    content: |
      #!/bin/sh
      # Managed by ansible-supply-chain-security
      UV='{{ uv_binary_path.stdout }}'
      # RUN-PROBE. Record that this wrapper actually executed.
      #
      # Free on a real invocation (SCH_WRAPPER_PROBE is unset, so this is one test).
      # supply-chain-verify sets it to a temp file, invokes the tool, and reads back
      # which wrappers ran.
      #
      # It replaces inferring "did our wrapper run" from PATH position, which CANNOT
      # tell a bypassed wrapper from one chained behind another wrap. MEASURED: with
      # an Aikido safe-chain shim first on PATH the wrapper ran on every call while
      # the verifier reported "shadowed and never runs". Every version manager
      # (asdf, mise, volta, nodenv, pyenv) is shim-first and delegates the same way.
      #
      # The value is caller-controlled, so it is only ever a redirect target. Never
      # interpolate it into a command.
      if [ -n "${SCH_WRAPPER_PROBE:-}" ]; then
        printf '%s\n' "$0" >> "$SCH_WRAPPER_PROBE" 2>/dev/null || true
      fi
      # ECH-191: see the pip wrapper above. $UV was resolved in the DEPLOYING
      # user's context but this is SYSTEM-WIDE; if it points into a home other
      # users cannot traverse they lose pip3. Prefer a root-owned system copy,
      # then the deploy-time path, then the caller's PATH. Resolving `uv` (never
      # `pip3`) cannot recurse into this wrapper.
      for _c in /usr/local/bin/uv /usr/bin/uv "$UV" "$(command -v uv 2>/dev/null)"; do
        if [ -n "$_c" ] && [ -x "$_c" ]; then UV="$_c"; break; fi
      done
      if [ -z "$UV" ] || [ ! -x "$UV" ]; then
        echo "[supply-chain-hardening] error: uv not found in /usr/local/bin, /usr/bin, the deploy-time path, or PATH; refusing to recurse" >&2
        exit 127
      fi
      echo "[supply-chain-hardening] pip3 redirected through uv" >&2
      exec "$UV" pip "$@"
  when: uv_binary_path.rc == 0 and uv_binary_path.stdout | length > 0

- name: Install uv-managed tools
  # NON-FATAL BY DESIGN. An optional scanner failing to install must never
  # abort the play: the config-file layer is the load-bearing protection and
  # every include after this one would be skipped. Measured consequence of the
  # old behavior: on stock Ubuntu 22.04 / Debian 12 the Go tool install killed
  # 11 downstream includes, including the entire env-var layer. The failure is
  # recorded below instead, so it is reported rather than fatal or silent.
  # Use the absolute uv path we already discovered, not bare `uv`. Ansible's
  # connection environment doesn't include ~/.local/bin (uv installer's
  # default location); the installer only adds it to ~/.bashrc, which
  # ansible never sources. Bare `uv tool install` then exits 127 and aborts
  # the whole play, taking down every downstream task group. Container CI
  # passes because the Dockerfile prepends /root/.local/bin to PATH — but
  # fresh hosts following the official installer instructions don't.
  ansible.builtin.command:
    # Pinned: an unpinned `uv tool install` takes the newest release at apply
    # time, which is the same always-newest exposure the role's age gates exist
    # to close for users. PyPI provides integrity; the pin is the other half.
    # Looped over name/version pairs so `creates:` still names the binary
    # rather than the versioned requirement string.
    cmd: "{{ uv_binary_path.stdout }} tool install {{ item.name }}=={{ item.version }}"
    creates: "{{ omit if refresh_tools | bool else ansible_env.HOME + '/.local/bin/' + item.name }}"
  loop:
    - { name: uv-secure, version: "{{ uv_secure_version }}" }
    - { name: pip-audit, version: "{{ pip_audit_version }}" }
  when: uv_binary_path.rc == 0 and uv_binary_path.stdout | length > 0
  register: uv_tools_install
  failed_when: false

- name: Record skipped protection — uv-managed tools (install failed)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['uv-managed audit tools (uv-secure / pip-audit) — install failed. Python dependency scanning is not set up.'] }}
  when:
    - uv_tools_install is defined
    - uv_tools_install.rc | default(0) != 0
