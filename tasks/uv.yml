---
# uv / Python supply chain hardening
# Config deployed unconditionally; pip-redirect wrappers ONLY deployed when uv
# is actually present — otherwise the wrapper would recurse into itself and
# brick pip system-wide. See tests/bats/22-pip-wrapper-safety.bats.

- name: Determine uv user config directory
  # uv's user config is $XDG_CONFIG_HOME/uv/uv.toml, falling back to
  # $HOME/.config/uv/uv.toml ONLY when XDG_CONFIG_HOME is unset. Resolve it
  # from uv's environment rather than hardcoding $HOME/.config.
  # MEASURED: uv.toml at $HOME/.config/uv with XDG_CONFIG_HOME pointed
  # elsewhere -> uv reports `no_build: None`, i.e. it read nothing of ours,
  # while the verifier (sharing the same wrong assumption) still said OK.
  # docs/design-principles.md Axis 5, "Assumed canonical config homes".
  # NOT MEASURED, per uv's documentation only: UV_CONFIG_FILE / --config-file
  # names an explicit uv.toml that overrides the discovered user config. We do
  # not write to it (it is a caller-owned path); a host that sets it is not
  # covered by the file we deploy here.
  ansible.builtin.set_fact:
    uv_config_dir: >-
      {{
        ansible_env.XDG_CONFIG_HOME ~ '/uv'
        if ansible_env.XDG_CONFIG_HOME is defined and ansible_env.XDG_CONFIG_HOME | length > 0
        else ansible_env.HOME ~ '/.config/uv'
      }}

- name: Create uv config directory
  ansible.builtin.file:
    path: "{{ uv_config_dir }}"
    state: directory
    mode: "0755"

- name: Deploy hardened uv.toml
  # Replaced whole, but only a file that is exactly what this project last wrote
  # (files/user-config.sh, user_cfg_class). Anything else stopped the play in
  # preflight, unless accept_user_config_overwrite=true, which copies it first.
  ansible.builtin.script: user-config.sh replace uv
  args:
    executable: /bin/bash
  environment:
    SCH_UCF_PATH: "{{ uv_config_dir }}/uv.toml"
    SCH_UCF_BODY: "{{ lookup('ansible.builtin.template', 'uv.toml.j2') }}"
    SCH_UCF_DRY: "{{ ansible_check_mode | ternary('1', '0') }}"
    SCH_UCF_FOREIGN: "{{ (accept_user_config_overwrite | default(false) | bool) | ternary('keep', 'refuse') }}"
  register: sch_ucf_uv
  check_mode: false
  changed_when: "'changed' in (sch_ucf_uv.stdout_lines | default([]))"

- name: Create system-wide uv config directory
  become: true
  ansible.builtin.file:
    path: /etc/uv
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy hardened /etc/uv/uv.toml (system-wide; covers sudo and non-deploying users)
  # uv's documented system config path on Linux/macOS. Without it,
  # `sudo uv pip install` (HOME=/root) and other-user invocations miss
  # exclude-newer (age gate) and no-build (wheels-only), the two
  # protections that block fresh malicious releases and setup.py
  # execution respectively.
  #
  # IMPORTANT: do NOT pair this with UV_NO_SYSTEM_CONFIG=1 in
  # /etc/environment or /etc/profile.d/. uv 0.11.16+ honors that env
  # var by skipping this file entirely — and PAM-loaded shells (login,
  # interactive sudo with env_reset) will see the env var, defeating
  # this fallback in exactly the contexts it exists for.
  become: true
  ansible.builtin.template:
    src: uv.toml.j2
    dest: /etc/uv/uv.toml
    owner: root
    group: root
    mode: "0644"

- name: Deploy the safe build escape-hatch (supply-chain-allow-build)
  # ECH-192. no-build=true blocks EVERY source build, including an editable
  # install of the operator's OWN trusted source. uv's built-in overrides are
  # footguns: --no-config drops all config, and --config-file / UV_CONFIG_FILE
  # REPLACE discovery, silently dropping the other four hardened settings. This
  # helper is the safe-by-construction path: it mirrors the hardened uv.toml,
  # flips ONLY no-build, and scopes that to one command. Deployed unconditionally
  # alongside the config (ready when uv arrives); it self-checks for a hardened
  # uv.toml at runtime and refuses non-uv commands.
  become: true
  ansible.builtin.copy:
    src: supply-chain-allow-build
    dest: /usr/local/bin/supply-chain-allow-build
    owner: root
    group: root
    mode: "0755"

- name: Find uv binary path
  # Check the canonical install location first. `bash -lc` (login shell) was
  # the previous approach but it's fragile: the uv installer adds PATH only
  # to ~/.bashrc, and login shells source ~/.bash_profile (not ~/.bashrc).
  # On real hosts where the user follows the official installer, a login
  # shell may have empty PATH for ~/.local/bin and `command -v uv` returns
  # nothing — pip wrappers then silently don't deploy.
  #
  # SYSTEM paths are searched BEFORE $HOME/.local/bin: the value found here is
  # baked into a SYSTEM-WIDE wrapper (/usr/local/bin/pip). Baking a home path
  # when a root-owned system uv also exists breaks every non-deploying,
  # non-root user who cannot traverse that home (0750/0700 is common on
  # hardened hosts) — see the wrapper's own runtime fallback below (#ECH-191).
  ansible.builtin.shell:
    cmd: |
      for p in /usr/local/bin/uv /usr/bin/uv "$HOME/.local/bin/uv"; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v uv 2>/dev/null
    executable: /bin/bash
  register: uv_binary_path
  changed_when: false
  check_mode: false
  failed_when: false

- name: Deploy pip and pip3 wrappers to /usr/local/bin (system-wide, delegate to uv)
  # One template for both names (they differed only in the name they print).
  # The wrapper re-resolves uv for each caller and runs only a uv that caller
  # owns or that root owns with nothing above it writable by anyone else. The
  # baked deploy-time path stays as one candidate, for the deploying user's own
  # contexts with no ~/.local/bin on PATH (cron). See the template for the
  # measurements behind it (ECH-191, VM#2).
  become: true
  ansible.builtin.template:
    src: pip-wrapper.sh.j2
    dest: "/usr/local/bin/{{ pip_wrapper_name }}"
    mode: "0755"
    owner: root
    group: root
  loop: [pip, pip3]
  loop_control:
    loop_var: pip_wrapper_name
  when: uv_binary_path.rc == 0 and uv_binary_path.stdout | length > 0

- name: Look for pip wrappers an earlier apply left in place (no uv on this run)
  # The uv lookup above is per-user (it includes $HOME/.local/bin), but the
  # wrappers are system-wide. When another account, or this one before uv was
  # removed, applied the role with uv present, /usr/local/bin/pip is still our
  # wrapper, so "the wrappers were not deployed and pip runs the real pip"
  # would be false (MEASURED: a second sudo user applying on a host root had
  # hardened got that entry while /usr/local/bin/pip was the wrapper). Prints
  # which wrapper it is, then the uv path that apply baked in. This version's
  # wrapper (sch_trusted) runs only a uv the caller or root owns; an earlier
  # version's runs any uv it can execute. The entry below describes the one
  # that is there: it described only the earlier one, so after a second
  # account with no uv applied, it said the wrapper runs the first account's
  # uv while `pip` refused that uv with exit 126 (MEASURED, Ubuntu 26.04).
  ansible.builtin.shell:
    cmd: |
      for f in /usr/local/bin/pip /usr/local/bin/pip3; do
        grep -qx '# Managed by ansible-supply-chain-security' "$f" 2>/dev/null || continue
        if grep -q '^sch_trusted()' "$f"; then echo owner-checked; else echo any-owner; fi
        sed -nE "s/^UV='(.*)'$/\1/p" "$f" | head -1
        exit 0
      done
      exit 1
    executable: /bin/bash
  register: pip_wrapper_left
  changed_when: false
  check_mode: false
  failed_when: false
  when: not (uv_binary_path.rc == 0 and uv_binary_path.stdout | length > 0)

- name: Record skipped protection — pip / pip3 wrapper (uv absent)
  # The wrappers are deployed only when uv exists (they exec it; without it they
  # would refuse every pip call). The summary used to say nothing when they were
  # skipped, and pip.yml's age-gate entry even claimed "the deployed
  # /usr/local/bin/pip already does" route installs through uv. MEASURED on the
  # VM matrix: no stock image ships uv, so no wrapper on any of them.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['pip / pip3 wrapper — this run found no uv, so it did not deploy /usr/local/bin/pip or /usr/local/bin/pip3. ' ~ (('The wrappers an earlier apply left there are still in place and were not updated: ' ~ (('each runs the first uv that the caller owns, or that root owns where no other account can replace it, trying /usr/local/bin/uv, /usr/bin/uv, the ' ~ ((pip_wrapper_left.stdout_lines + ['', ''])[1] | trim | default('<none>', true)) ~ ' recorded at that apply, PATH, then ~/.local/bin/uv of the account running pip. It refuses every pip command, with exit 126 when each uv it finds belongs to another account or sits where one could replace it, and with exit 127 when it finds none. ') if (pip_wrapper_left.stdout_lines + [''])[0] == 'owner-checked' else ('they are from an earlier version of this role, and each runs the first uv it can execute (/usr/local/bin/uv, /usr/bin/uv, the ' ~ ((pip_wrapper_left.stdout_lines + ['', ''])[1] | trim | default('<none>', true)) ~ ' recorded at that apply, then PATH) whoever owns it, so root and other accounts can end up running a uv that another account can replace. It refuses every pip command (exit 127) when it finds none. '))) if pip_wrapper_left.rc | default(1) == 0 else ('`pip install` runs the real pip, with neither uv age gate (exclude-newer) nor uv no-build. ' ~ ('/etc/pip.conf only-binary still refuses a sdist resolved from an index, but a sdist named by path or URL still runs its setup.py (tests/bats/48-caller-context-coverage.bats), and ' if pip_only_binary | bool else '') ~ 'the pip age gate needs pip 26.0. ')) ~ 'Install uv and re-apply.'] }}
  when: not (uv_binary_path.rc == 0 and uv_binary_path.stdout | length > 0)

- name: Detect installed uv tools (uv-managed versions, or copies uv does not manage)
  # `creates:` checked only that a binary existed, so bumping uv_secure_version
  # or pip_audit_version never reinstalled anything unless refresh_tools was
  # set. `uv tool list` prints "<name> v<version>" per tool (MEASURED uv
  # 0.13.9), and `uv tool install name==<other>` replaces the version uv
  # installed. It does NOT replace an executable it did not install (pipx,
  # `pip install --user`): it fails with "Executable already exists", rc=2. The
  # probe therefore also looks where the install writes (`uv tool dir --bin`)
  # and reports such a copy as "foreign", which the install leaves alone, as
  # `creates:` did. Same probe as zizmor in tasks/github.yml.
  ansible.builtin.shell:
    cmd: |
      uv='{{ uv_binary_path.stdout }}'
      bin=$("$uv" tool dir --bin 2>/dev/null) || bin="$HOME/.local/bin"
      list=$("$uv" tool list 2>/dev/null)
      for name in uv-secure pip-audit; do
        ver=$(printf '%s\n' "$list" | awk -v n="$name" '$1 == n { sub(/^v/, "", $2); print $2; exit }')
        if [ -n "$ver" ]; then
          echo "$name uv $ver"
        elif [ -e "$bin/$name" ] || [ -L "$bin/$name" ]; then
          echo "$name foreign $bin/$name"
        fi
      done
    executable: /bin/bash
  register: uv_tools_installed
  changed_when: false
  check_mode: false
  failed_when: false
  when: uv_binary_path.rc == 0 and uv_binary_path.stdout | length > 0

- name: Note an existing uv-secure / pip-audit that uv does not manage (left in place)
  ansible.builtin.debug:
    msg: >-
      {{ item.split(' ', 2)[2] }} was not installed by `uv tool`, so the role
      leaves it as it is and does not install its pinned version over it.
  loop: "{{ uv_tools_installed.stdout_lines | default([]) | select('match', '[^ ]+ foreign ') | list }}"

- name: Install uv-managed tools
  # NON-FATAL BY DESIGN. An optional scanner failing to install must never
  # abort the play: the config-file layer is the load-bearing protection and
  # every include after this one would be skipped. Measured consequence of the
  # old behavior: on stock Ubuntu 22.04 / Debian 12 the Go tool install killed
  # 11 downstream includes, including the entire env-var layer. The failure is
  # recorded below instead, so it is reported rather than fatal or silent.
  # Use the absolute uv path we already discovered, not bare `uv`. Ansible's
  # connection environment doesn't include ~/.local/bin (uv installer's
  # default location); the installer only adds it to ~/.bashrc, which
  # ansible never sources. Bare `uv tool install` then exits 127 and aborts
  # the whole play, taking down every downstream task group. Container CI
  # passes because the Dockerfile prepends /root/.local/bin to PATH — but
  # fresh hosts following the official installer instructions don't.
  ansible.builtin.command:
    # Pinned: an unpinned `uv tool install` takes the newest release at apply
    # time, which is the same always-newest exposure the role's age gates exist
    # to close for users. PyPI provides integrity; the pin is the other half.
    # Looped over name/version pairs so the skip test can compare each pin with
    # the version `uv tool list` reported above.
    # umask go-w: see "Install lockfile-lint globally" in tasks/npm.yml.
    # MEASURED under umask 0000: ~/.local/bin, which uv creates here and which
    # is on the user's PATH, was left 0777.
    cmd: "sh -c 'umask go-w && exec \"$@\"' sch-umask {{ uv_binary_path.stdout }} tool install {{ item.name }}=={{ item.version }}"
  loop:
    - { name: uv-secure, version: "{{ uv_secure_version }}" }
    - { name: pip-audit, version: "{{ pip_audit_version }}" }
  when:
    - uv_binary_path.rc == 0 and uv_binary_path.stdout | length > 0
    - uv_tools_installed.stdout_lines | default([]) | select('match', item.name ~ ' foreign ') | list | length == 0
    - refresh_tools | bool or (item.name ~ ' uv ' ~ item.version) not in (uv_tools_installed.stdout_lines | default([]))
  # A failed install changed nothing, so it must not report `changed`: with
  # failed_when: false and no changed_when, a persistently failing install broke
  # idempotency on every re-apply.
  register: uv_tools_install
  changed_when: uv_tools_install.rc | default(1) == 0
  failed_when: false

- name: Record skipped protection — uv-managed tools (install failed)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['uv-secure / pip-audit (optional audit tools; nothing in the role runs them, so no install is blocked either way) — install failed, so the Python dependency scanners are not available to run by hand.'] }}
  when:
    # A looped task registers `results`, one entry per item, and no top-level
    # rc, so the old `uv_tools_install.rc | default(0) != 0` was always false
    # and a failed install was never recorded.
    - uv_tools_install is defined
    - >-
      uv_tools_install.results | default([]) | selectattr('rc', 'defined')
      | rejectattr('rc', 'equalto', 0) | list | length > 0
