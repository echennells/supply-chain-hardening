---
# Podman container supply chain hardening
# Deploys policy.json for registry restriction and installs cosign.
# Unlike Docker env vars, policy.json is daemon-level enforcement.
#
# Optional flags:
#   podman_disable_docker: true  — stops and disables Docker
#   podman_docker_compat: true   — symlinks docker.sock to podman socket

- name: Install podman and fuse-overlayfs (Debian/Ubuntu)
  # NON-FATAL BY DESIGN — see the same note in tasks/go.yml. podman is opt-in,
  # so a failure here is worth reporting loudly, but five includes sit after
  # this one (npq, socket, github, shell_env, verify) and shell_env carries the
  # entire env-var layer. An unavailable package must not cost those.
  become: true
  ansible.builtin.apt:
    name:
      - podman
      - fuse-overlayfs
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'
  register: podman_install
  failed_when: false

- name: Record skipped protection — podman (install failed)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['podman — requested via podman_enabled=true but the package install FAILED. Container registry policy is not enforced; any policy.json deployed below has no runtime to enforce it.'] }}
  when:
    - podman_install is defined
    - podman_install is failed or podman_install.rc | default(0) != 0

- name: Create containers config directory
  become: true
  ansible.builtin.file:
    path: /etc/containers
    state: directory
    mode: "0755"

- name: Deploy container image policy (registry allowlist)
  become: true
  ansible.builtin.template:
    src: containers-policy.json.j2
    dest: /etc/containers/policy.json
    mode: "0644"

- name: Deploy container registries config (registry restriction)
  become: true
  ansible.builtin.template:
    src: containers-registries.conf.j2
    dest: /etc/containers/registries.conf
    mode: "0644"

- name: Map ansible_architecture to cosign release naming
  ansible.builtin.set_fact:
    cosign_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'arm', 'ppc64le': 'ppc64le', 's390x': 's390x'}[ansible_architecture] | default('') }}"

- name: Install cosign for image signature verification
  # NON-FATAL BY DESIGN. This reaches out to GitHub releases at apply time, so
  # it fails on any host without egress, behind a proxy, or during a GitHub
  # blip. cosign is a manual verification helper — losing it must never take
  # out the env-var layer deployed by shell_env.yml further down.
  become: true
  ansible.builtin.get_url:
    # Pinned tag + digest. This previously fetched `releases/latest/` with no
    # checksum at all: the signature-verification tool arrived from a mutable
    # ref, unverified, and was made executable. get_url refuses to write the
    # file when the digest does not match, so a substituted artifact now fails
    # closed. Bump cosign_version and the digests together — the values come
    # from the release's cosign_checksums.txt.
    url: "https://github.com/sigstore/cosign/releases/download/{{ cosign_version }}/cosign-linux-{{ cosign_arch }}"
    checksum: "{{ cosign_checksums[cosign_arch] }}"
    dest: /usr/local/bin/cosign
    mode: "0755"
  when:
    - ansible_system == 'Linux'
    - cosign_arch | length > 0
  register: cosign_install
  failed_when: false

- name: Record skipped protection — cosign (download failed)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['cosign — download from GitHub releases failed (no egress, proxy, or upstream blip). Manual container image signature verification is not available.'] }}
  when:
    - cosign_install is defined
    - cosign_install is failed

- name: Notify when cosign install was skipped (unsupported platform)
  ansible.builtin.debug:
    msg: >-
      Skipping cosign install: no prebuilt binary for {{ ansible_system }}/{{ ansible_architecture }}.
      Container image signature verification via cosign will not be available. The rest of the
      podman hardening (policy.json registry allowlist, registries.conf) still applies — those are
      enforced by podman itself, not by cosign. Install cosign manually from
      https://github.com/sigstore/cosign/releases if you need it.
  when: ansible_system != 'Linux' or cosign_arch | length == 0

- name: Detect systemd (linger and user socket only apply on systemd hosts)
  ansible.builtin.stat:
    path: /run/systemd/system
  register: systemd_present

- name: Check if linger is already enabled
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ ansible_user_id }}"
  register: linger_state
  when: systemd_present.stat.exists

- name: Enable linger for deploy user (rootless socket survives reboot)
  become: true
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user_id }}"
  when:
    - systemd_present.stat.exists
    - not linger_state.stat.exists
  changed_when: true

- name: Enable user podman socket
  ansible.builtin.systemd:
    name: podman.socket
    scope: user
    state: started
    enabled: true
  when: systemd_present.stat.exists

# --- Optional: disable Docker ---

- name: Disable Docker daemon
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - docker.service
    - docker.socket
  when: podman_disable_docker | bool
  failed_when: false  # docker may not be installed — disabling a non-existent unit is fine

# --- Optional: Docker CLI compatibility ---

- name: Deploy tmpfiles.d for docker.sock symlink (survives reboot)
  become: true
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/podman-docker-compat.conf
    mode: "0644"
    content: |
      L /run/docker.sock - - - - /run/user/{{ ansible_user_uid }}/podman/podman.sock
  when: podman_docker_compat | bool

- name: Create docker.sock symlink now
  become: true
  ansible.builtin.file:
    src: "/run/user/{{ ansible_user_uid }}/podman/podman.sock"
    dest: /run/docker.sock
    state: link
    force: true
  when: podman_docker_compat | bool
