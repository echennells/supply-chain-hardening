---
# npm supply chain hardening
# Config files deployed unconditionally — ready when npm arrives

- name: Find the npm versions the npmrc keys depend on
  ansible.builtin.import_tasks: npm_versions.yml

- name: Merge the hardened settings into .npmrc (per-user)
  # Merged, never replaced: this is where `npm login` keeps its token. MEASURED
  # (d738db8, issue 48): the template task that was here dropped every line of the
  # user's on every apply, and turned a 0600 file into 0644. files/user-config.sh
  # puts the settings in a marked block at the top, keeps every other line, and
  # ends the file 0600. A line of the user's for one of these settings would win
  # over the block, so it is taken out, after a copy; the end-of-run report names
  # the key. Never the line: no diff is produced here, so --diff prints none.
  #
  # Template-driven so npm_ignore_scripts / npm_audit / npm_save_exact /
  # npm_fund / npm_update_notifier actually control behavior. Previously
  # this content was hardcoded inline, which made those variables
  # misleading: setting npm_ignore_scripts=false did nothing for the
  # config files (only the env var). The template now makes the variable
  # names match what they actually do.
  ansible.builtin.script: user-config.sh npmrc
  args:
    executable: /bin/bash
  environment:
    SCH_UCF_PATH: "{{ ansible_facts.env.HOME }}/.npmrc"
    SCH_UCF_BODY: "{{ lookup('ansible.builtin.template', 'npmrc.j2') }}"
    SCH_UCF_DRY: "{{ ansible_check_mode | ternary('1', '0') }}"
    SCH_UCF_FOREIGN: "{{ (accept_user_config_overwrite | default(false) | bool) | ternary('keep', 'refuse') }}"
  register: sch_ucf_npmrc
  check_mode: false
  changed_when: "'changed' in (sch_ucf_npmrc.stdout_lines | default([]))"

- name: Merge the hardened settings into /etc/npmrc (npm's global config on apt and RHEL npm)
  # The per-user ~/.npmrc above only protects the user the role ran against.
  # `sudo npm install` flips $HOME to /root and misses it; so does any other
  # account. /etc/npmrc is npm's global config where npm's builtin npmrc redirects
  # `globalconfig` here: Debian's and Ubuntu's apt npm (/usr/share/npm/npmrc) and
  # RHEL's nodejs-npm (/usr/lib/node_modules_22/npm/npmrc, MEASURED on RHEL 10.3). On
  # NodeSource, nvm, fnm, volta, asdf, Homebrew and the official node images npm's
  # globalconfig is {prefix}/etc/npmrc (e.g. /usr/etc, /usr/local/etc) and this file
  # is never read (ECH-149); the "Resolve npm's real global config path" tasks after
  # npm detection below write that one too. This file is written whatever npm is
  # here, so it is in place when npm arrives. pnpm does not read it on any of these
  # (measured, see templates/etc-npmrc.j2).
  #
  # Merged, never replaced, the same way as ~/.npmrc (files/user-config.sh, ucf_npmrc
  # npm-global): this project's block at the top, every other line kept. A line that
  # sets one of the block's keys is taken out after a copy next to the file (0600),
  # and the summary names the key. MEASURED on Azure VMs (2026-11-28): RHEL 9.9's and
  # 10.3's nodejs-npm ship this file (prefix=/usr/local, python=, update-notifier=false);
  # the preflight stopped on it as "often a corporate registry", and with
  # accept_etc_overwrite=true the template that was here replaced it, after which
  # `npm config get prefix` was /usr and global installs went under /usr. Replacing a
  # corporate registry and token here would send installs to the public registry.
  # The file keeps its owner and mode (one that is not there is 0644 root:root), and
  # root merges only into a /etc/npmrc that is root's, is no link and that no other
  # account can write (ucf_no_root); anything else is left as it is and listed in the
  # summary. No line of the file is printed, and no diff is produced, so --diff prints
  # none either.
  become: true
  ansible.builtin.command:
    cmd: /bin/bash -s -- npmrc npm-global
    stdin: "{{ lookup('ansible.builtin.file', 'user-config.sh') }}"
  environment:
    SCH_UCF_PATH: /etc/npmrc
    SCH_UCF_BODY: "{{ lookup('ansible.builtin.template', 'etc-npmrc.j2') }}"
    SCH_UCF_DRY: "{{ ansible_check_mode | ternary('1', '0') }}"
    SCH_UCF_ROOT: "1"
  register: sch_ucf_etc_npmrc
  check_mode: false
  changed_when: "'changed' in (sch_ucf_etc_npmrc.stdout_lines | default([]))"
  failed_when: sch_ucf_etc_npmrc.rc | default(2) not in [0, 1]

- name: Record skipped protection — /etc/npmrc
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + [
           "npm's global config — " ~ (sch_ucf_etc_npmrc.stdout_lines | select('match', 'error: ') | map('regex_replace', '^error: ', '') | join('; ') | default('/etc/npmrc could not be written', true))
           ~ ". It is npm's global config on Debian's, Ubuntu's and RHEL's own npm, what `sudo npm` and every other account read there; your own ~/.npmrc is not affected."
         ] }}
  when: sch_ucf_etc_npmrc.rc | default(0) != 0

- name: Check if npm is installed
  # Check canonical locations across the most common Node install methods
  # before falling back to a PATH search. Plain `which npm` from ansible's
  # connection environment misses npm when the user installed Node via nvm,
  # fnm, volta, asdf, etc. — those tools add PATH only through ~/.bashrc.
  # Coverage: system (apt/dnf), volta, asdf, nodenv, nvm, fnm.
  #
  # In the one order the role takes "the npm" in: the block marked "the npm" is the same
  # in tasks/npm_versions.yml and in ucf_npm (files/user-config.sh, where the reasons
  # are), and tests/ci/14 compares them. /usr/local/bin/npm first, as on every PATH:
  # `npm install -g npm@latest` puts the npm people run there wherever npm's prefix is
  # /usr/local (RHEL's stock /etc/npmrc sets it; SLES), over the distro's older
  # /usr/bin/npm. Probing /usr/bin first judged that one instead (MEASURED: RHEL 9.9,
  # RHEL 10.3 and SLES 16 with npm 12.2.3 in /usr/local and 10.9.9 in /usr/bin: the run
  # said npm 10.9.9 had no age gate). Our own wrapper there: the npm it wraps.
  ansible.builtin.shell:
    cmd: |
      # >>> the npm
      npm=""
      if [ -x /usr/local/bin/npm ]; then
        if {{ sch_is_wrapper_sh }} /usr/local/bin/npm 2>/dev/null; then
          # >>> wrapped npm
          npm=/usr/local/lib/node_modules/npm/bin/npm-cli.js
          if [ ! -x "$npm" ] || {{ sch_is_wrapper_sh }} "$npm" 2>/dev/null; then
            npm=$(sed -n "s/^REAL_NPM='\(.*\)'\$/\1/p" /usr/local/bin/npm | head -n 1)
            if [ -z "$npm" ] || [ ! -x "$npm" ] || {{ sch_is_wrapper_sh }} "$npm" 2>/dev/null; then npm=""; fi
          fi
          # <<< wrapped npm
        else
          npm=/usr/local/bin/npm
        fi
      fi
      if [ -z "$npm" ]; then
        for p in /usr/bin/npm /usr/local/bin/npm "$HOME/.volta/bin/npm" "$HOME/.asdf/shims/npm" "$HOME/.nodenv/shims/npm" \
                 "$HOME"/.nvm/versions/node/*/bin/npm "${FNM_DIR:-$HOME/.local/share/fnm}"/node-versions/*/installation/bin/npm \
                 "$HOME"/.local/share/fnm/node-versions/*/installation/bin/npm "$HOME"/.fnm/node-versions/*/installation/bin/npm; do
          if [ -x "$p" ]; then npm=$p; break; fi
        done
      fi
      [ -n "$npm" ] || npm=$(PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v npm 2>/dev/null) || npm=""
      # <<< the npm
      [ -n "$npm" ] || exit 1
      echo "$npm"
    executable: /bin/bash
  register: npm_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Detect the npm version (min-release-age needs npm 11.10.0)
  # The npmrc templates write min-release-age unless the npm found would warn
  # about it on every command (11.2.0 to 11.9.0, see npm_versions.yml), so below
  # 11.2.0 it activates the day npm is upgraded and otherwise on the next apply.
  # Below 11.10.0 npm echoes the key back from
  # `npm config get` and enforces nothing, so without this record the summary
  # was silent about a missing age gate on every stock distro npm (MEASURED on
  # the VM matrix: Ubuntu 22.04 8.5.1, 24.04/26.04 and Debian 12/13 9.2.0,
  # NodeSource 22 10.9.9).
  ansible.builtin.command: "{{ npm_check.stdout }} --version"
  register: npm_version_check
  changed_when: false
  check_mode: false
  failed_when: false
  when: npm_check.rc == 0 and npm_check.stdout | length > 0

- name: Record skipped protection — npm age gate (npm < 11.10.0)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['npm publish-age gate — npm ' ~ (npm_version_check.stdout | trim) ~ ' does not implement min-release-age (added in npm 11.10.0; older npm echoes the key back and enforces nothing). ' ~ ('The key is written and activates on upgrade' if sch_npm_writes_min_release_age | bool else 'npm 11.2.0 to 11.9.0 warns about the key on every command, so it is left out of the npmrc files and the environment: upgrade npm, then re-apply') ~ '; until then `npm install` accepts a release published seconds ago. See docs/npm-cooldown-by-distro.md'] }}
  when:
    - npm_version_check.stdout is defined
    - npm_version_check.stdout | trim is match('^[0-9]+[.][0-9]+[.][0-9]+$')
    - npm_version_check.stdout | trim is version('11.10.0', '<')

- name: Resolve npm's real global config path (globalconfig is prefix-relative, not /etc/npmrc)
  # ECH-149. npm's `globalconfig` defaults to {prefix}/etc/npmrc. That is
  # /etc/npmrc ONLY on Debian/Ubuntu apt npm; on NodeSource, nvm, fnm, volta,
  # asdf, Homebrew and the official node images it resolves to /usr/etc/npmrc,
  # /usr/local/etc/npmrc, etc., and the /etc/npmrc written above is never read.
  # Ask npm where it actually reads global config. The path is prefix-relative
  # and identical for every user on the host (it is not $HOME-derived), so
  # resolving it once as the invoking user also fixes the sudo / other-user
  # path. (A host that sets NPM_CONFIG_GLOBALCONFIG to a per-user override is
  # out of scope — we harden npm's real default global config location.)
  #
  # The invoking user's own settings are out of the way for it: a prefix= or
  # globalconfig= in ~/.npmrc or the environment is not where the other accounts'
  # npm reads (ucf_npm_global in files/user-config.sh). Prints the path, unless it
  # is /etc/npmrc, and "as user" or "as root", who writes it.
  ansible.builtin.script: user-config.sh path npm-global
  args:
    executable: /bin/bash
  register: npm_globalconfig
  changed_when: false
  check_mode: false
  failed_when: false
  when: npm_check.rc == 0

- name: Merge the hardened settings into npm's resolved global config (non-apt layouts)
  # Closes the sudo / other-user gap on every layout where globalconfig is not
  # /etc/npmrc. Idempotent no-op on Debian apt (guarded out above).
  #
  # npm-recognised keys only: this is the file npm reads as its global config, and
  # npm warns `Unknown global config` about a pnpm-only key (minimum-release-age*)
  # on every command (ECH-196, measured npm 11.19). pnpm 9 and 10 read this path as
  # their global config too (measured), so ignore-scripts reaches a `sudo pnpm` or
  # another user's here, and the age gate does not.
  #
  # Merged, never replaced, as /etc/npmrc above is (ucf_npmrc npm-global). MEASURED
  # (d738db8, NodeSource's /usr/etc/npmrc): when it was replaced, a registry and a
  # token in it were gone after an apply. In the user's home, or a prefix that is the
  # user's (linuxbrew), it is written as the user. Root writes it only where no other
  # account controls the path, whatever the path is: no link in it, and every part of
  # it root's and writable by root alone (ucf_no_root, judged by the process that
  # writes). Anywhere else it is left alone, and the summary says so.
  become: "{{ 'as root' in (npm_globalconfig.stdout_lines | default([])) }}"
  ansible.builtin.command:
    cmd: /bin/bash -s -- npmrc npm-global
    stdin: "{{ lookup('ansible.builtin.file', 'user-config.sh') }}"
  environment:
    SCH_UCF_PATH: "{{ npm_globalconfig.stdout_lines | first }}"
    SCH_UCF_BODY: "{{ lookup('ansible.builtin.template', 'npmrc.j2') }}"
    SCH_UCF_DRY: "{{ ansible_check_mode | ternary('1', '0') }}"
    SCH_UCF_ROOT: "{{ ('as root' in npm_globalconfig.stdout_lines) | ternary('1', '0') }}"
  register: sch_ucf_npm_global
  check_mode: false
  changed_when: "'changed' in (sch_ucf_npm_global.stdout_lines | default([]))"
  failed_when: sch_ucf_npm_global.rc | default(2) not in [0, 1]
  when:
    - npm_check.rc == 0
    - npm_globalconfig.stdout_lines | default([]) | length > 0

- name: Record skipped protection — npm's global config
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + [
           "npm's global config — " ~ (sch_ucf_npm_global.stdout_lines | select('match', 'error: ') | map('regex_replace', '^error: ', '') | join('; ') | default(npm_globalconfig.stdout_lines | first, true))
           ~ '. It is what `sudo npm` and every other account get their npm settings from; your own ~/.npmrc is not affected.'
           ~ (" If an earlier version of this role made it root's, move it aside as yourself (`mv -- " ~ (npm_globalconfig.stdout_lines | first | dirname | quote) ~ ' ' ~ ((npm_globalconfig.stdout_lines | first | dirname) ~ '.old') | quote ~ '`, which needs no root) and re-apply.'
              if 'as user' in npm_globalconfig.stdout_lines else '')
         ] }}
  when:
    - sch_ucf_npm_global is not skipped
    - sch_ucf_npm_global.rc | default(0) != 0

- name: Check that root can run npm (a per-user Node is invisible to become)
  # Same reason as tasks/socket.yml: the install runs as root, root's PATH is
  # sudo's secure_path, and a per-user Node (fnm, nvm, volta, asdf) is not on it.
  # Running the user's npm as root would let root execute files the user can
  # edit, so skip and say why rather than record a bare "install failed".
  become: true
  ansible.builtin.shell:
    cmd: |
      # Found by root AND owned by root. Where sudoers sets no secure_path, root
      # keeps the applying user's PATH and finds the per-user npm after all;
      # running that as root would execute files the user can edit.
      npm_path=$(command -v npm) || exit 1
      for p in "$npm_path" "$(command -v node)"; do
        [ -n "$p" ] || continue
        real=$(readlink -f "$p")
        [ "$(stat -c %u "$real" 2>/dev/null)" = 0 ] || { echo "$real"; exit 3; }
      done
    executable: /bin/bash
  register: npm_root_for_lockfile_lint
  changed_when: false
  check_mode: false
  failed_when: false
  when: npm_check.rc == 0

- name: Detect the lockfile-lint version the install below would replace (reinstall when the pin moves)
  # A presence check (`which lockfile-lint`) used to gate the install, so
  # bumping lockfile_lint_version never reinstalled anything, and unlike the
  # `creates:` guards elsewhere not even refresh_tools did. The probe reads the
  # install TARGET: the package.json under `npm root -g` of the npm that root
  # runs, in the same become context as the install. Not whichever
  # lockfile-lint comes first on the caller's PATH: with an nvm/fnm global of
  # another version ahead of the system one (a local connection inherits the
  # caller's PATH), that probe never matched the pin and every apply reinstalled
  # the system copy (MEASURED: changed=1 on every re-apply). Not by running
  # `lockfile-lint --version` either: that needs a Node the tool supports, and a
  # probe that fails every time would reinstall on every apply.
  become: true
  ansible.builtin.shell:
    cmd: |
      root=$(npm root -g 2>/dev/null) || exit 0
      f="$root/lockfile-lint/package.json"
      [ -f "$f" ] || exit 0
      sed -nE 's/^ *"version": *"([^"]+)".*/\1/p' "$f" | head -1
    executable: /bin/bash
  register: lockfile_lint_installed
  changed_when: false
  check_mode: false
  failed_when: false
  when: npm_root_for_lockfile_lint.rc | default(1) == 0

- name: Check for a lockfile-lint on the caller's PATH (when root has no npm to install one)
  # Only consulted for the "npm is per-user" record below: as before, a
  # lockfile-lint the user installed themselves (an nvm/fnm global) is
  # available to run, so there is nothing to report.
  ansible.builtin.command: which lockfile-lint
  register: lockfile_lint_on_path
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - npm_check.rc == 0
    - npm_root_for_lockfile_lint.rc | default(0) != 0

- name: Install lockfile-lint globally
  # NON-FATAL BY DESIGN. An optional scanner failing to install must never
  # abort the play: the config-file layer is the load-bearing protection and
  # every include after this one would be skipped. Measured consequence of the
  # old behavior: on stock Ubuntu 22.04 / Debian 12 the Go tool install killed
  # 11 downstream includes, including the entire env-var layer. The failure is
  # recorded below instead, so it is reported rather than fatal or silent.
  # become: root — `npm install -g` writes the global prefix (/usr/local on apt
  # npm), unwritable by a non-root apply, so the install silently failed on
  # every non-root host (recorded as a gap). sfw/npq install the same way.
  become: true
  # --ignore-scripts: the role blocks lifecycle scripts for user installs; do the
  # same for its own tools. lockfile-lint is a pure-JS CLI with no required
  # postinstall. Universal npm CLI flag across versions. See tasks/socket.yml.
  #
  # `umask 022` around the install: npm creates the package tree with the
  # umask it inherits, and Ansible sets none. MEASURED (6c77f4e, the role
  # applied as root under `umask 0000`, the default of GitLab's Docker
  # executor): /usr/local/lib/node_modules and the lockfile-lint, npq and sfw
  # trees in it were left 0777, so any account could replace code root runs.
  # Fixed 022 rather than the caller's mask plus go-w, as for the sfw warm in
  # tasks/socket.yml: these trees must stay readable by every account, and sudo
  # merges a caller's 077 into its own. The per-user installs (uv tool, cargo,
  # go) use `umask go-w` instead, which keeps a stricter mask.
  ansible.builtin.command: sh -c 'umask 022 && exec "$@"' sch-umask npm install -g --ignore-scripts lockfile-lint@{{ lockfile_lint_version }}
  # A failed install changed nothing (see the other optional tool installs).
  changed_when: lockfile_lint_install.rc | default(1) == 0
  when:
    - npm_check.rc == 0
    - npm_root_for_lockfile_lint.rc | default(1) == 0
    - refresh_tools | bool or (lockfile_lint_installed.stdout | default('') | trim) != lockfile_lint_version
  register: lockfile_lint_install
  failed_when: false

- name: Record skipped protection — lockfile-lint (install failed)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['lockfile-lint (optional audit tool; nothing in the role runs it, so no install is blocked either way) — install failed, so the lockfile URL/integrity linter is not available to run by hand.'] }}
  when:
    - lockfile_lint_install is defined
    - lockfile_lint_install.rc | default(0) != 0

- name: Record skipped protection — lockfile-lint (npm is per-user)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['lockfile-lint (optional audit tool; nothing in the role runs it, so no install is blocked either way) — not installed: ' ~ (('root would run ' ~ (npm_root_for_lockfile_lint.stdout | trim) ~ ', which root does not own (sudo kept the PATH of whoever applied the role), and the role does not run a user-writable program as root') if npm_root_for_lockfile_lint.rc == 3 else ('the only npm found is ' ~ (npm_check.stdout | trim) ~ ', which root cannot run (a per-user Node such as fnm, nvm, volta or asdf)')) ~ '. lockfile-lint installs system-wide, so it needs a system-wide Node.'] }}
  when:
    - npm_root_for_lockfile_lint is defined
    - npm_root_for_lockfile_lint.rc is defined
    - npm_root_for_lockfile_lint.rc != 0
    - lockfile_lint_on_path.rc | default(1) != 0
