---
# npm supply chain hardening
# Config files deployed unconditionally — ready when npm arrives

- name: Deploy hardened .npmrc (per-user)
  # Template-driven so npm_ignore_scripts / npm_audit / npm_save_exact /
  # npm_fund / npm_update_notifier actually control behavior. Previously
  # this content was hardcoded inline, which made those variables
  # misleading: setting npm_ignore_scripts=false did nothing for the
  # config files (only the env var). The template now makes the variable
  # names match what they actually do.
  ansible.builtin.template:
    src: npmrc.j2
    dest: "{{ ansible_env.HOME }}/.npmrc"
    mode: "0644"

- name: Deploy hardened /etc/npmrc (correct on Debian/Ubuntu apt npm; harmless baseline elsewhere)
  # The per-user ~/.npmrc above only protects the user the role ran against.
  # `sudo npm install` flips $HOME to /root and misses it; so does any other
  # account. /etc/npmrc is npm's global config ONLY on Debian/Ubuntu apt npm,
  # whose builtin /usr/share/npm/npmrc redirects `globalconfig` here. On
  # NodeSource, nvm, fnm, volta, asdf, Homebrew and the official node images
  # npm's globalconfig is {prefix}/etc/npmrc (e.g. /usr/etc, /usr/local/etc)
  # and this file is never read — so the sudo / other-user path gets no
  # config-file coverage there (ECH-149). The "Resolve npm's real global
  # config path" tasks after npm detection below deploy to the actual path on
  # those layouts. This file is kept unconditionally because it is correct on
  # apt hosts, is also read by pnpm as its lowest-priority layer, and is
  # harmless where inert.
  become: true
  ansible.builtin.template:
    src: etc-npmrc.j2
    dest: /etc/npmrc
    owner: root
    group: root
    mode: "0644"

- name: Check if npm is installed
  # Check canonical locations across the most common Node install methods
  # before falling back to a PATH search. Plain `which npm` from ansible's
  # connection environment misses npm when the user installed Node via nvm,
  # fnm, volta, asdf, etc. — those tools add PATH only through ~/.bashrc.
  # Coverage: system (apt/dnf), volta, asdf, nodenv, nvm, fnm.
  ansible.builtin.shell:
    cmd: |
      for p in /usr/bin/npm /usr/local/bin/npm "$HOME/.volta/bin/npm" "$HOME/.asdf/shims/npm" "$HOME/.nodenv/shims/npm"; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "$HOME"/.nvm/versions/node/*/bin/npm; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      for p in "$HOME"/.local/share/fnm/node-versions/*/installation/bin/npm; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$PATH" command -v npm 2>/dev/null
    executable: /bin/bash
  register: npm_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Resolve npm's real global config path (globalconfig is prefix-relative, not /etc/npmrc)
  # ECH-149. npm's `globalconfig` defaults to {prefix}/etc/npmrc. That is
  # /etc/npmrc ONLY on Debian/Ubuntu apt npm; on NodeSource, nvm, fnm, volta,
  # asdf, Homebrew and the official node images it resolves to /usr/etc/npmrc,
  # /usr/local/etc/npmrc, etc., and the /etc/npmrc written above is never read.
  # Ask npm where it actually reads global config. The path is prefix-relative
  # and identical for every user on the host (it is not $HOME-derived), so
  # resolving it once as the invoking user also fixes the sudo / other-user
  # path. (A host that sets NPM_CONFIG_GLOBALCONFIG to a per-user override is
  # out of scope — we harden npm's real default global config location.)
  ansible.builtin.command: "{{ npm_check.stdout }} config get globalconfig"
  register: npm_globalconfig
  changed_when: false
  check_mode: false
  failed_when: false
  when: npm_check.rc == 0

- name: Ensure npm's resolved global config directory exists
  # {prefix}/etc may not exist yet (e.g. /usr/etc on NodeSource). Skipped when
  # globalconfig resolves to /etc/npmrc (already deployed) or to an empty /
  # relative value.
  become: true
  ansible.builtin.file:
    path: "{{ (npm_globalconfig.stdout | trim) | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - npm_check.rc == 0
    - npm_globalconfig is defined
    - npm_globalconfig.stdout | default('') | trim | length > 0
    - (npm_globalconfig.stdout | trim) is match('^/')
    - (npm_globalconfig.stdout | trim) != '/etc/npmrc'

- name: Deploy hardened npmrc to npm's resolved global config path (non-apt layouts)
  # Closes the sudo / other-user gap on every layout where globalconfig is not
  # /etc/npmrc. Idempotent no-op on Debian apt (guarded out above).
  become: true
  ansible.builtin.template:
    src: etc-npmrc.j2
    dest: "{{ npm_globalconfig.stdout | trim }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - npm_check.rc == 0
    - npm_globalconfig is defined
    - npm_globalconfig.stdout | default('') | trim | length > 0
    - (npm_globalconfig.stdout | trim) is match('^/')
    - (npm_globalconfig.stdout | trim) != '/etc/npmrc'

- name: Check if lockfile-lint is already installed
  ansible.builtin.command: which lockfile-lint
  register: lockfile_lint_check
  changed_when: false
  check_mode: false
  failed_when: false
  when: npm_check.rc == 0

- name: Install lockfile-lint globally
  # NON-FATAL BY DESIGN. An optional scanner failing to install must never
  # abort the play: the config-file layer is the load-bearing protection and
  # every include after this one would be skipped. Measured consequence of the
  # old behavior: on stock Ubuntu 22.04 / Debian 12 the Go tool install killed
  # 11 downstream includes, including the entire env-var layer. The failure is
  # recorded below instead, so it is reported rather than fatal or silent.
  # become: root — `npm install -g` writes the global prefix (/usr/local on apt
  # npm), unwritable by a non-root apply, so the install silently failed on
  # every non-root host (recorded as a gap). sfw/npq install the same way.
  become: true
  ansible.builtin.command: npm install -g lockfile-lint@{{ lockfile_lint_version }}
  changed_when: true
  when:
    - npm_check.rc == 0
    - lockfile_lint_check.rc != 0
  register: lockfile_lint_install
  failed_when: false

- name: Record skipped protection — lockfile-lint (install failed)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['lockfile-lint — install failed. Lockfile URL/integrity linting is not set up.'] }}
  when:
    - lockfile_lint_install is defined
    - lockfile_lint_install.rc | default(0) != 0
