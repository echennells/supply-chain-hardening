---
# Gradle supply chain hardening

- name: Check for gradle, or a JDK a ./gradlew build would run on
  # Most gradle builds never touch a `gradle` on PATH: they run the project's
  # ./gradlew, which downloads its own distribution into the gradle user home
  # and runs it on the host's java. That distribution loads init.d from the
  # same gradle user home. Gating on `which gradle` alone (CMP 4.5) left
  # such hosts with no init script at all. MEASURED (8281a6b, JDK 21 on PATH,
  # no gradle or mvn): the apply reported "gradle is not installed", deployed
  # nothing, and a 1.+ plugin resolved and ran under gradle 8.14.3.
  # A wrapper cannot start without java, so java on PATH or $JAVA_HOME/bin/java
  # is the trigger; a host with neither cannot run a gradle build yet.
  ansible.builtin.shell:
    cmd: |
      for t in gradle java; do command -v "$t" && exit 0; done
      if [ -n "${JAVA_HOME:-}" ] && [ -x "$JAVA_HOME/bin/java" ]; then
        echo "$JAVA_HOME/bin/java"; exit 0
      fi
      exit 1
    executable: /bin/bash
  register: gradle_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Look up the passwd home, which gradle reads when GRADLE_USER_HOME is unset
  ansible.builtin.import_tasks: passwd_home.yml

- name: Resolve the gradle user home that gradle itself will read
  # WHERE GRADLE ACTUALLY LOOKS.
  #
  # Gradle resolves its user home as $GRADLE_USER_HOME, and when that is unset
  # as <user.home>/.gradle — where user.home is a JVM system property that on
  # Linux comes from the PASSWD ENTRY, not from $HOME. MEASURED (gradle 8.14.3
  # on openjdk-21, linux-arm64): with HOME=/tmp/.../fakehome,
  # System.getProperty("user.home") was still /home/vscode and gradle loaded
  # NO init script from fakehome/.gradle. Again on gradle 8.14.8 (temurin
  # 21.0.13.1), as root with HOME=/tmp/h: the init script in /root/.gradle ran.
  #
  # This task used to write to `ansible_facts.env.HOME`, i.e. the HOME of ansible's
  # connection. On any host where that differs from the passwd home — a
  # container run with `-u <uid>`, OpenShift's arbitrary-uid pattern, sudo -E,
  # or a connection plugin that sets its own HOME — the init script was
  # written, was correct, and was never read.
  #
  # Note this is NOT the same shape of fix as uv/bun/cargo (design-principles
  # Axis 5): resolving `${GRADLE_USER_HOME:-$HOME/.gradle}` is still wrong,
  # because the DEFAULT itself is passwd-derived, not $HOME-derived. So:
  #   1. $GRADLE_USER_HOME from the target's own environment wins, as always;
  #   2. otherwise the passwd home of this uid (tasks/passwd_home.yml), the
  #      entry the JVM reads. Not `ansible_facts.user_dir`, which this used to take:
  #      ansible looks that up by the name in $LOGNAME or $USER, so it named
  #      another account's home whenever those did. These tasks do not
  #      `become`, so the lookup and the JVM describe the same uid;
  #   3. `ansible_facts.env.HOME` when this uid has no passwd home it can write.
  #      That case is recorded below, since the JVM may not look there.
  # Nothing, recorded below, for a root that sudo or doas reached with another
  # account's HOME (tasks/passwd_home.yml): root's home is not the one meant,
  # and root writing into that account's home would leave it a ~/.gradle it
  # cannot write.
  #
  # The action (action/harden.sh) additionally EXPORTS GRADLE_USER_HOME so the
  # ambiguity cannot come back. The role deliberately does not: its env layer
  # is system-wide (/etc/profile.d + /etc/environment, see tasks/shell_env.yml)
  # and is read by EVERY account on the host, so pinning one user's absolute
  # gradle home there would point root and every other user at this user's
  # ~/.gradle. Writing into the home gradle resolves on its own is the half of
  # the fix that is correct for a long-lived multi-user host, and it is also
  # the half that survives a build which never loads the env layer at all
  # (container CMD, systemd — Axis 2).
  ansible.builtin.set_fact:
    gradle_user_home_resolved: >-
      {{ ansible_facts.env.GRADLE_USER_HOME | default('', true)
      or ('' if sch_passwd_kept_out | length > 0
          else ((sch_passwd_home | default('', true) or ansible_facts.env.HOME) ~ '/.gradle')) }}
  when: gradle_check.rc == 0

- name: Note that the init script is outside $HOME, in the passwd home
  # The run summary (tasks/main.yml) prints it: the file is where the JVM looks,
  # but someone checking $HOME, or keeping only $HOME, would not find it there.
  ansible.builtin.set_fact:
    sch_home_notes: >-
      {{ (sch_home_notes | default([])) + ["gradle: $HOME is '" ~ ansible_facts.env.HOME ~ "' but the passwd home is '" ~ sch_passwd_home ~ "' — the init script goes to " ~ gradle_user_home_resolved ~ "/init.d, where the JVM looks, not under $HOME."] }}
  when:
    - gradle_check.rc == 0
    - ansible_facts.env.GRADLE_USER_HOME | default('', true) | length == 0
    - sch_passwd_apart | bool

- name: Create Gradle init.d directory
  # Only when it is not there: a mode on an existing directory changed it on every
  # apply (MEASURED at d738db8: tasks/bun.yml turned a 0750 home into 0755).
  ansible.builtin.shell:
    cmd: umask 022 && mkdir -p -- {{ (gradle_user_home_resolved ~ '/init.d') | quote }}
    creates: "{{ (gradle_user_home_resolved ~ '/init.d') }}"
    executable: /bin/bash
  when:
    - gradle_check.rc == 0
    - gradle_user_home_resolved | length > 0

- name: Deploy Gradle init script to enforce HTTPS-only repositories
  ansible.builtin.copy:
    dest: "{{ gradle_user_home_resolved }}/init.d/supply-chain-security.gradle"
    mode: "0644"
    content: |
      // Managed by ansible-supply-chain-security
      // Reject any HTTP (non-HTTPS) repository in EVERY scope gradle fetches
      // from, not just project repositories (ECH-171). buildscript{} and the
      // settings pluginManagement{} fetch and EXECUTE plugin / build-classpath
      // code at CONFIGURATION time — exactly the install-time-admission threat
      // this project scopes itself to — so leaving them on plaintext http was a
      // silent hole. MEASURED (gradle 8.14.3): before this, an http repo in
      // buildscript{}, pluginManagement{} or an ivy{} block was accepted while
      // only a project maven{} http repo was refused. Ivy repos are now covered
      // alongside Maven (the old check matched MavenArtifactRepository only).
      def rejectHttp = { repo ->
          if ((repo instanceof MavenArtifactRepository || repo instanceof IvyArtifactRepository)
                  && repo.url != null && repo.url.scheme == 'http') {
              throw new GradleException("Insecure HTTP repository blocked: ${repo.url}")
          }
      }

      // Settings-level repositories: pluginManagement (plugin resolution) and
      // the centralized dependencyResolutionManagement (gradle 6.8+).
      // beforeSettings is gradle 6+. Guarded by respondsTo() rather than a
      // version tier: an init script is CODE, and calling a method this gradle
      // lacks is a hard error that fails EVERY build (design-principles Axis 3).
      // An older gradle keeps the project + buildscript coverage below.
      // Refuse dynamic / changing version selectors (1.+, latest.release,
      // -SNAPSHOT): parity with action/harden.sh, which has emitted these two
      // since it was written while this file emitted only the HTTP refusal.
      //
      // Applied to EVERY configuration gradle resolves code from, not only to
      // project configurations (CMP 4.6). A plugin is resolved into a SCRIPT
      // classpath: plugins{} and buildscript{} in a build script resolve into
      // that project's buildscript.configurations, and the same blocks in
      // settings.gradle into the settings script's. allprojects{configurations}
      // reaches none of them. MEASURED (gradle 8.14.3 and 9.1.0, file:// repo):
      // with only project configurations covered, `id '...' version '1.+'` in
      // plugins{}, a 1.+ buildscript classpath entry, and both forms in
      // settings.gradle all resolved and the plugin's code RAN, while a 1.+
      // project dependency was refused.
      //
      // When this fires gradle reports "Resolution strategy disallows usage
      // of dynamic versions" (or "... of changing versions"); that refusal
      // comes from this file.
      //
      // Guarded by respondsTo() rather than by a version tier. An init
      // script is CODE, not a key/value file: a method this gradle does not
      // implement is a hard evaluation error that fails EVERY build on the
      // host, not a silently-ignored key (design-principles Axis 3). Asking
      // the object what it implements needs no version number at all and
      // cannot brick a distro gradle old enough to lack the methods.
      def refuseDynamic = { conf ->
          def rs = conf.resolutionStrategy
          if (rs.metaClass.respondsTo(rs, 'failOnDynamicVersions')) {
              rs.failOnDynamicVersions()
          }
          if (rs.metaClass.respondsTo(rs, 'failOnChangingVersions')) {
              rs.failOnChangingVersions()
          }
      }

      if (gradle.metaClass.respondsTo(gradle, 'beforeSettings')) {
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories.all(rejectHttp)
              if (settings.metaClass.respondsTo(settings, 'getDependencyResolutionManagement')) {
                  settings.dependencyResolutionManagement.repositories.all(rejectHttp)
              }
              // settings plugins{} / buildscript{}: the settings script classpath
              if (settings.metaClass.respondsTo(settings, 'getBuildscript')) {
                  settings.buildscript.configurations.all(refuseDynamic)
              }
          }
      }

      allprojects {
          // project repositories AND the buildscript (plugin) classpath
          repositories.all(rejectHttp)
          buildscript.repositories.all(rejectHttp)

          // project dependencies, and the plugin classpath plugins{} and
          // buildscript{} resolve into
          configurations.all(refuseDynamic)
          buildscript.configurations.all(refuseDynamic)
      }
  when:
    - gradle_check.rc == 0
    - gradle_user_home_resolved | length > 0

- name: Record skipped protection — no passwd home the gradle init script could go to
  # Feeds the end-of-run summary in main.yml. Reached when the target sets no
  # GRADLE_USER_HOME and this uid has no passwd home it can write: the script
  # was written under ansible's HOME, which gradle reads only when the JVM
  # falls back to $HOME (tasks/passwd_home.yml: java 21 does for a passwd home
  # of "/", java 17 does not). Not when that HOME is the passwd entry itself:
  # the script is then where the JVM looks.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['gradle init script — uid ' ~ (sch_passwd_uid | default('?', true)) ~ ' has no passwd home it can write (passwd says: ' ~ (sch_passwd_entry | default('', true) or 'nothing') ~ '), so the script was written to ' ~ gradle_user_home_resolved ~ ', under $HOME. The JVM takes its home from the passwd entry, not $HOME, so gradle may not load it. Set GRADLE_USER_HOME on the target, or give the account a home it can write, and re-apply.'] }}
  when:
    - gradle_check.rc == 0
    - ansible_facts.env.GRADLE_USER_HOME | default('', true) | length == 0
    - sch_passwd_home | default('', true) | length == 0
    - sch_passwd_kept_out | length == 0
    - not (sch_passwd_at_home | bool)

- name: Record skipped protection — root by way of sudo or doas, with another account's HOME
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ["gradle init script — not written: this is root reached by sudo or doas from " ~ sch_passwd_kept_out ~ ", and $HOME (" ~ ansible_facts.env.HOME ~ ") is not root's passwd home (" ~ (sch_passwd_home | default('', true) or sch_passwd_entry) ~ "). Run this as " ~ sch_passwd_kept_out ~ ", not as root, and re-apply."] }}
  when:
    - gradle_check.rc == 0
    - gradle_user_home_resolved | length == 0

- name: Record skipped protection — neither gradle nor a JDK
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['gradle init script — neither gradle nor a JDK (java on PATH, or $JAVA_HOME/bin/java) was found, so no init script was deployed. Installing either later will NOT pick up this hardening; re-run the role.'] }}
  when: gradle_check.rc != 0
