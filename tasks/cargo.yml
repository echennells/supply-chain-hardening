---
# Cargo/Rust supply chain hardening
# Config deployed unconditionally; auditing tools only install if cargo exists.

- name: Resolve CARGO_HOME (NOT necessarily ~/.cargo)
  # Cargo reads its config from $CARGO_HOME, which defaults to ~/.cargo but is
  # explicitly set on a great many real hosts — the official rust Docker images
  # use /usr/local/cargo, and shared CI runners commonly point it at a cache
  # volume. Hardcoding ~/.cargo deploys a config file the tool will never read:
  # present on disk, correct in content, completely inert.
  #
  # Measured consequence: on an image with CARGO_HOME=/usr/local/cargo, a
  # cooldown.toml written to /root/.cargo is never read and the gate runs with
  # no window configured.
  ansible.builtin.shell:
    cmd: 'echo "${CARGO_HOME:-$HOME/.cargo}"'
    executable: /bin/bash
  register: cargo_home_check
  changed_when: false
  check_mode: false

- name: Set cargo_home fact
  ansible.builtin.set_fact:
    cargo_home: "{{ cargo_home_check.stdout | trim }}"

- name: Create cargo config directory
  ansible.builtin.file:
    path: "{{ cargo_home }}"
    state: directory
    mode: "0755"

- name: Deploy hardened cargo config.toml
  ansible.builtin.template:
    src: cargo-config.toml.j2
    dest: "{{ cargo_home }}/config.toml"
    mode: "0644"

- name: Deploy publish-age gate config at $CARGO_HOME/cooldown.toml
  # THE load-bearing cargo protection. Cargo runs build.rs at compile time
  # with full user privileges and has no --ignore-scripts, so refusing to
  # RESOLVE a too-new version is the only control that prevents execution
  # rather than detecting it afterwards.
  #
  # $CARGO_HOME/cooldown.toml is cargo-cooldown's weakest config precedence
  # level, which is exactly why it goes here: it is the only level that
  # applies to every project on the host without per-repo opt-in.
  ansible.builtin.template:
    src: cargo-cooldown.toml.j2
    dest: "{{ cargo_home }}/cooldown.toml"
    mode: "0644"
  when: cargo_cooldown_enforce | bool

- name: Create /root cargo config directory (sudo coverage)
  # Mirrors the composer /root pattern. A build run under sudo reads root's
  # CARGO_HOME, not the invoking user's, so without this the gate silently
  # does not apply to `sudo cargo build`.
  become: true
  ansible.builtin.file:
    path: /root/.cargo
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: cargo_cooldown_enforce | bool

- name: Deploy publish-age gate config to /root (sudo coverage)
  become: true
  ansible.builtin.template:
    src: cargo-cooldown.toml.j2
    dest: /root/.cargo/cooldown.toml
    owner: root
    group: root
    mode: "0644"
  when: cargo_cooldown_enforce | bool

- name: Check if cargo is installed
  # Check the canonical rustup install location first. rustup (the dominant
  # cargo installer) puts the binary at ~/.cargo/bin/cargo and adds PATH only
  # via ~/.cargo/env (sourced from ~/.bashrc and ~/.profile). Plain `which
  # cargo` from ansible's connection environment may not see ~/.cargo/bin
  # on non-interactive / automated runs where .bashrc isn't sourced.
  ansible.builtin.shell:
    cmd: |
      for p in "$HOME/.cargo/bin/cargo" /usr/local/bin/cargo /usr/bin/cargo; do
        if [ -x "$p" ]; then
          echo "$p"
          exit 0
        fi
      done
      PATH="$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin:$PATH" command -v cargo 2>/dev/null
    executable: /bin/bash
  register: cargo_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Check for a C linker (cargo install needs one; the old prebuilt did not)
  # MEASURED: stock ubuntu:24.04 and debian:12 ship no cc, gcc, clang or ld, and
  # a rustup-provisioned host looks the same — rustup installs a toolchain, not
  # a linker. Every Rust build ends in `cc`, so without this probe the build
  # below dies with "linker `cc` not found" and failed_when:false swallows it
  # into a silently missing age gate.
  #
  # Probe, do not install: pulling build-essential onto every managed host is a
  # larger change than this role is entitled to make. Report the gap instead.
  ansible.builtin.shell:
    cmd: 'command -v cc || command -v gcc || command -v clang'
    executable: /bin/bash
  register: cargo_cc_check
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - cargo_check.rc == 0
    - cargo_cooldown_enforce | bool

- name: Record skipped protection — no C linker for the gate backend
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['cargo publish-age gate — no C linker (cc/gcc/clang) on this host, so cargo-cooldown cannot be built from source. Install build-essential and re-apply, or set cargo_cooldown_enforce=false. The wrapper degrades to --locked only.'] }}
  when:
    - cargo_check.rc == 0
    - cargo_cooldown_enforce | bool
    - cargo_cc_check is defined
    - cargo_cc_check.rc | default(1) != 0

- name: Detect the rustc version (the gate backend needs >= 1.91.1 to build)
  # cargo-cooldown 0.3.4 has MSRV 1.91.1. Distro cargo is older on every current
  # LTS — Ubuntu 24.04 ships 1.75.0, Debian 12 older still — so on those hosts
  # the source build cannot succeed. Detect it and skip cleanly, instead of
  # spending a minute compiling dependencies only to die on the MSRV check and
  # get swallowed by failed_when:false.
  #
  # This is what makes cargo_cooldown_enforce=true honest: it stays the default,
  # but on a too-old toolchain it degrades to --locked with a recorded reason
  # rather than a wasted build and a silent gap.
  ansible.builtin.shell:
    cmd: "{{ cargo_check.stdout | dirname }}/rustc --version 2>/dev/null | awk '{print $2}'"
    executable: /bin/bash
  register: cargo_rustc_version
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - cargo_check.rc == 0
    - cargo_cooldown_enforce | bool

- name: Decide whether rustc is too old for the gate backend
  # Only "too old" when we POSITIVELY read a version below the MSRV. An
  # unreadable version falls through to attempting the build (which then fails
  # gracefully via the health check) rather than skipping on a guess.
  ansible.builtin.set_fact:
    cargo_rustc_too_old: >-
      {{ (cargo_rustc_version.stdout | default('') | trim) | length > 0
         and (cargo_rustc_version.stdout | trim) is version('1.91.1', '<') }}
  when:
    - cargo_check.rc == 0
    - cargo_cooldown_enforce | bool

- name: Record skipped protection — rustc too old for the gate backend
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['cargo publish-age gate — rustc ' ~ (cargo_rustc_version.stdout | trim) ~ ' is below cargo-cooldown 0.3.4 MSRV 1.91.1, so the backend cannot be built from source. Expected on distro cargo (Ubuntu 24.04 = 1.75.0). Use a rustup toolchain >= 1.91.1 and re-apply, or set cargo_cooldown_enforce=false. The wrapper degrades to --locked only.'] }}
  when:
    - cargo_check.rc == 0
    - cargo_cooldown_enforce | bool
    - cargo_rustc_too_old | default(false) | bool

- name: Detect the installed cargo-cooldown version (idempotence on the PIN, not the file)
  # `creates:` alone checks only that the binary exists, so bumping
  # cargo_cooldown_version would be inert — the pin could never be updated.
  # Compare the installed version against the pin instead.
  ansible.builtin.shell:
    cmd: "{{ cargo_home }}/bin/cargo-cooldown --version 2>/dev/null | awk '{print $NF}'"
    executable: /bin/bash
  register: cargo_cooldown_installed
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - cargo_check.rc == 0
    - cargo_cooldown_enforce | bool

- name: Install the publish-age gate backend (pinned, from source)
  # Replaces a `curl -L .../main/install-from-binstall-release.sh | bash`
  # bootstrap that fetched an installer from a MUTABLE BRANCH with no checksum,
  # which downloaded a release tarball and piped it to tar unverified, which
  # then installed four unverified prebuilt binaries — one of which the wrapper
  # execs on every cargo build.
  #
  # Pinning that chain would not have fixed it. MEASURED: 0 of the 4 crates
  # declare [package.metadata.binstall].signing, and binstall has no code path
  # that consumes the .sha256 / SHA256SUMS files three of them do publish. A
  # fully-pinned bootstrap still yields unverified binaries.
  #
  # `cargo install --locked` builds from crates.io, whose .crate checksum cargo
  # verifies, using the crate's own published Cargo.lock so the transitive tree
  # is pinned too. Measured 1m53s. The old ~15min figure covered all four tools,
  # and cargo-audit is the slow one.
  #
  # Bonus, measured: the published prebuilt needs GLIBC_2.39 and dies in the
  # loader on Debian 12 (glibc 2.36). A source build links against local glibc,
  # so on bookworm the gate works there instead of failing in the loader.
  #
  # NON-FATAL: an optional backend failing to build must never abort the play.
  ansible.builtin.command:
    cmd: "{{ cargo_check.stdout | dirname }}/cargo install --locked cargo-cooldown@{{ cargo_cooldown_version }}"
  environment:
    PATH: "{{ cargo_home }}/bin:{{ ansible_env.PATH }}"
  when:
    - cargo_check.rc == 0
    - cargo_cooldown_enforce | bool
    - cargo_cc_check is defined
    - cargo_cc_check.rc | default(1) == 0
    - not (cargo_rustc_too_old | default(false) | bool)
    - refresh_tools | bool or (cargo_cooldown_installed.stdout | default('') | trim) != cargo_cooldown_version
  register: cargo_tools_install
  changed_when: cargo_tools_install.rc | default(1) == 0
  failed_when: false

- name: Install optional cargo auditing tools (opt-in — this role never invokes them)
  # cargo-audit and cargo-vet are detection tools. Nothing in this role runs
  # them — grep for their names across tasks/ and templates/ returns no
  # invocation. Installing them by default put binaries on every host
  # that no code path uses, and was the sole reason the role needed a
  # `curl | bash` bootstrap. Enable this and wire them into CI yourself.
  ansible.builtin.command:
    cmd: "{{ cargo_check.stdout | dirname }}/cargo install --locked {{ item.key }}@{{ item.value }}"
    creates: "{{ omit if refresh_tools | bool else cargo_home + '/bin/' + item.key }}"
  environment:
    PATH: "{{ cargo_home }}/bin:{{ ansible_env.PATH }}"
  loop: "{{ cargo_audit_versions | dict2items }}"
  when:
    - cargo_check.rc == 0
    - cargo_audit_tools | bool
    - cargo_cc_check is not defined or cargo_cc_check.rc | default(0) == 0
  failed_when: false

- name: Record skipped protection — publish-age gate backend (build failed)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['cargo publish-age gate — cargo-cooldown failed to build from source, so `cargo build` is NOT age-gated. The wrapper degrades to --locked, which only protects projects with a committed Cargo.lock and does nothing for `cargo update`.'] }}
  when:
    - cargo_tools_install is defined
    - cargo_tools_install.rc | default(0) != 0

# --- cargo PATH wrapper ---
#
# Deployed LAST, after the auditing tools are installed. Deploying it earlier
# would route this role's own `cargo install` calls through a wrapper whose
# cooldown backend does not exist yet.
#
# Ownership differs from the other wrappers on purpose. bun/composer/deno wrap
# system paths and are root-owned. Cargo usually lives at ~/.cargo/bin/cargo,
# installed and updated by rustup running AS THE USER — root-owning it there
# would break `rustup update` with EACCES. So we only escalate when the
# discovered binary is outside the user's home.

- name: Decide whether wrapping this cargo path needs root
  # NOTE: `startswith` is a Python str method reached through Jinja, NOT an
  # Ansible filter. Writing it as `| startswith(...)` raises "Could not load
  # 'startswith'" and aborts the play.
  #
  # Not gated on cargo_path_wrapper: the restore path needs the same answer
  # when the wrapper is being turned off, and would otherwise fall back to
  # become: true and escalate unnecessarily against a user-owned ~/.cargo.
  ansible.builtin.set_fact:
    cargo_wrap_become: "{{ not (cargo_check.stdout | default('')).startswith(ansible_env.HOME) }}"
  when:
    - cargo_check.rc == 0
    - cargo_check.stdout | default('') | length > 0

- name: Determine whether current cargo binary is our wrapper or the real binary
  # NOT gated on cargo_path_wrapper. The restore task below needs this fact
  # precisely when the wrapper has been turned OFF, and gating it on the same
  # var left cargo_binary_kind undefined in that case — so the restore
  # condition could never match and `cargo_path_wrapper=false` silently did
  # nothing. The documented off-switch was dead code.
  ansible.builtin.shell:
    cmd: |
      if grep -q 'supply-chain-hardening' '{{ cargo_check.stdout }}' 2>/dev/null; then
        echo is_wrapper
      else
        echo is_real
      fi
    executable: /bin/bash
  register: cargo_binary_kind
  changed_when: false
  check_mode: false
  when:
    - cargo_check.rc == 0
    - cargo_check.stdout | default('') | length > 0

- name: Prepare cargo-real (an argv[0]-safe backup of the real cargo)
  # WHY THIS IS NOT JUST `mv cargo cargo-real`
  #
  # rustup is the dominant cargo installer and its cargo is a SYMLINK to the
  # rustup binary, which dispatches on the name it was invoked as. A file named
  # cargo-real is not a valid proxy name, so calling it yields:
  #
  #   error: unknown proxy name: 'cargo-real'; valid proxy names are 'rustc',
  #   'rustdoc', 'cargo', ...
  #
  # The wrapper's own `exec -a cargo` handles ITS call, but that is not enough:
  # cargo tells subcommands where it lives via $CARGO, so cargo-cooldown then
  # runs `cargo-real locate-project` and hits the same wall. Measured: a real
  # `cargo build` through the wrapper failed with exactly that error, while the
  # stubbed cargo-cooldown used in earlier tests never invoked cargo and so
  # never revealed it.
  #
  # So cargo-real must work when invoked BY ANY NAME, by whoever. On rustup
  # hosts it becomes a two-line shim that restores argv[0]=cargo before
  # exec'ing rustup. On a non-rustup cargo (a genuine binary) a plain rename is
  # correct and we keep it.
  #
  # No gate on "backup absent": if `rustup update` replaced our wrapper with a
  # fresh cargo, the existing backup is stale and the binary now at this path
  # is the one worth preserving. Same semantics as the composer/bun wrappers.
  become: "{{ cargo_wrap_become | default(true) | bool }}"
  ansible.builtin.shell:
    cmd: |
      set -e
      CARGO_PATH='{{ cargo_check.stdout }}'
      REAL="${CARGO_PATH}-real"
      TARGET=$(readlink -f "$CARGO_PATH")
      if [ "$(basename "$TARGET")" = "rustup" ]; then
        printf '#!/bin/bash\n# supply-chain-hardening: argv[0] shim for the rustup cargo proxy.\n# rustup dispatches on the name it is invoked as, so a file called\n# cargo-real is rejected as an unknown proxy. Restore argv[0]=cargo.\nexec -a cargo "%s" "$@"\n' "$TARGET" > "$REAL"
        chmod 0755 "$REAL"
        echo shim
      else
        mv "$CARGO_PATH" "$REAL"
        echo moved
      fi
    executable: /bin/bash
  register: cargo_real_prep
  when:
    - cargo_path_wrapper | bool
    - cargo_check.rc == 0
    - cargo_check.stdout | default('') | length > 0
    - cargo_binary_kind.stdout | default('') == 'is_real'
  changed_when: true

- name: Deploy cargo wrapper at the discovered cargo path
  become: "{{ cargo_wrap_become | default(true) | bool }}"
  ansible.builtin.template:
    src: cargo-wrapper.sh.j2
    dest: "{{ cargo_check.stdout }}"
    mode: "0755"
  vars:
    cargo_real_path: "{{ cargo_check.stdout }}-real"
  when:
    - cargo_path_wrapper | bool
    - cargo_check.rc == 0
    - cargo_check.stdout | default('') | length > 0

- name: Restore real cargo (when cargo_path_wrapper=false toggled after prior wrap)
  # Mirror of the prepare step. If the backup is our rustup shim, the original
  # state was a SYMLINK to rustup, so restore that and drop the shim — moving
  # the shim into place would work but would silently leave role-managed code
  # behind on a host that explicitly opted out.
  become: "{{ cargo_wrap_become | default(true) | bool }}"
  ansible.builtin.shell:
    cmd: |
      set -e
      CARGO_PATH='{{ cargo_check.stdout }}'
      REAL="${CARGO_PATH}-real"
      if grep -q 'argv\[0\] shim for the rustup cargo proxy' "$REAL" 2>/dev/null; then
        TARGET=$(grep -o 'exec -a cargo "[^"]*"' "$REAL" | sed 's/.*"\(.*\)"/\1/')
        ln -sfn "$TARGET" "$CARGO_PATH"
        rm -f "$REAL"
      else
        mv "$REAL" "$CARGO_PATH"
      fi
    executable: /bin/bash
  when:
    - not (cargo_path_wrapper | bool)
    - cargo_check.rc == 0
    - cargo_check.stdout | default('') | length > 0
    - cargo_binary_kind.stdout | default('') == 'is_wrapper'
  changed_when: true

- name: Check the publish-age gate backend is present and runnable
  # One probe, reporting only. An earlier version of this also QUARANTINED a
  # non-runnable binary — moved it aside so `command -v` would fail and the
  # wrapper would degrade. That machinery existed for one specific failure
  # mode: cargo-binstall fetched a PREBUILT binary chosen by target triple,
  # and the published cargo-cooldown needs GLIBC_2.39, so on Debian 12
  # (glibc 2.36) it installed fine and died in the loader.
  #
  # The binstall path is gone — the backend is now built from source with
  # `cargo install --locked`, linking against local glibc — so that failure
  # mode cannot occur. What remains ("present but will not execute") is either
  # corruption or tampering by someone who already has code execution, which
  # this role does not defend against (docs/design-principles.md, "Scope").
  #
  # The wrapper needs no help here: its own `command -v cargo-cooldown` guard
  # degrades to --locked and warns on every invocation when the binary is
  # missing. So report the state and let the wrapper handle it.
  ansible.builtin.shell:
    cmd: |
      BIN='{{ cargo_home }}/bin/cargo-cooldown'
      [ -x "$BIN" ] || { echo absent; exit 0; }
      "$BIN" --version >/dev/null 2>&1 && echo works || echo broken
    executable: /bin/bash
  register: cargo_cooldown_health
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - cargo_path_wrapper | bool
    - cargo_cooldown_enforce | bool

- name: Record skipped protection — publish-age gate not available
  # Only fire when a more specific reason (rustc too old, no C linker) has NOT
  # already been recorded — otherwise one gap gets reported twice and the
  # end-of-run "N protections not applied" count is inflated.
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['cargo publish-age gate — cargo-cooldown is ' ~ (cargo_cooldown_health.stdout | default('') | trim) ~ ', so `cargo build` is NOT age-gated. The wrapper degrades to --locked, which protects projects with a committed Cargo.lock and does nothing for `cargo update`. Needs rustc >= 1.91.1 and a C linker to build.'] }}
  when:
    - cargo_path_wrapper | bool
    - cargo_cooldown_enforce | bool
    - cargo_cooldown_health is defined
    - cargo_cooldown_health.stdout | default('') | trim in ['absent', 'broken']
    - not (cargo_rustc_too_old | default(false) | bool)
    - cargo_cc_check.rc | default(0) == 0

- name: Record skipped protection — cargo hardening (cargo absent)
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['cargo publish-age gate and --locked enforcement — cargo is not installed, so the wrapper was not deployed.'] }}
  when:
    - cargo_path_wrapper | bool
    - cargo_check.rc != 0
