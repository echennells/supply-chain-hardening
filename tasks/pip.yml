---
# pip is redirected to uv via system-wide wrappers (see uv.yml)
# This task deploys pip.conf as a fallback in case the real pip binary
# is invoked directly (bypassing the wrapper) — e.g. on hosts without uv.

# --- python_safe_path tier ------------------------------------------------
# PYTHONSAFEPATH landed in python 3.11. Below that it is accepted silently and
# does nothing, which is the "accepted and inert" shape this repo keeps hitting
# (npm min-release-age, composer block-insecure, bun ignoreScripts). Detect and
# record rather than let the env layer imply a protection that is not there.
- name: Detect the python3 version (PYTHONSAFEPATH needs 3.11+)
  ansible.builtin.command: python3 -c 'import sys;print("%d.%d" % sys.version_info[:2])'
  register: python_version_check
  changed_when: false
  check_mode: false
  failed_when: false
  when: python_safe_path | bool

- name: Record skipped protection — PYTHONSAFEPATH inert on this python
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['PYTHONSAFEPATH — python ' ~
         (python_version_check.stdout | default('?') | trim) ~
         ' ignores it (needs 3.11+). A file in the working directory can still
         shadow a stdlib module; python_safe_path=true had no effect.'] }}
  when:
    - python_safe_path | bool
    - python_version_check.rc | default(1) == 0
    - (python_version_check.stdout | default('0.0') | trim) is version('3.11', '<')

- name: Record skipped protection — PYTHONSAFEPATH requested but python3 absent
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['PYTHONSAFEPATH — python3 is not
         installed, so python_safe_path=true was not verified against a real
         interpreter.'] }}
  when:
    - python_safe_path | bool
    - python_version_check.rc | default(1) != 0

# --- pip native age-gate tier ---------------------------------------------
# `--uploaded-prior-to` landed in pip 26.0 (2026-01-30). We deploy the key
# UNCONDITIONALLY (see the long note in defaults/main.yml: it is accepted and
# silently ignored on every pre-26 pip, MEASURED across ten versions), so this
# probe exists only to REPORT the gap, never to create it by suppressing the
# key. Suppressing on an old system pip would also strand every uv / pipx /
# venv python on the host, any of which can run pip 26.
- name: Detect whether this python3's pip implements --uploaded-prior-to
  # The support discriminator is the HELP TEXT, not a config readback:
  # `pip config list` echoes the key back on EVERY version, including pips that
  # ignore it entirely, so a readback alone is a false-OK trap.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      python3 -m pip install --help 2>/dev/null | grep -q -- '--uploaded-prior-to' \
        && python3 -m pip --version 2>/dev/null | awk '{print $2}' \
        || { python3 -m pip --version 2>/dev/null | awk '{print "UNSUPPORTED:"$2}'; }
    executable: /bin/bash
  register: pip_age_gate_support
  changed_when: false
  check_mode: false
  failed_when: false
  when: pip_age_gate | bool

- name: Record skipped protection — pip native age gate not implemented by this pip
  ansible.builtin.set_fact:
    skipped_protections: >-
      {{ (skipped_protections | default([])) + ['pip native age gate — python3 -m pip is ' ~
         (pip_age_gate_support.stdout | default('') | trim | regex_replace('^UNSUPPORTED:', '')) ~
         ', which does not implement --uploaded-prior-to (added in pip 26.0). The key is
         deployed and inert on this interpreter, so `python3 -m pip install` is NOT
         age-gated here; uv-routed installs still are. NOTE: no apt-shipped pip carries
         this flag (MEASURED: Ubuntu 22.04=22.0.2, 24.04=24.0, 26.04=25.1.1,
         Debian 12=23.0.1), so upgrading the distro will not close it. What does: route
         installs through uv (the deployed /usr/local/bin/pip already does), or use a
         uv-managed interpreter or a python:3.13+ image, whose pip is 26.x and reads
         this same /etc/pip.conf.'] }}
  when:
    - pip_age_gate | bool
    - pip_age_gate_support is defined
    - (pip_age_gate_support.stdout | default('') | trim) is match('^UNSUPPORTED:')

- name: Create pip config directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/pip"
    state: directory
    mode: "0755"

- name: Deploy hardened pip.conf as fallback
  ansible.builtin.template:
    src: pip.conf.j2
    dest: "{{ ansible_env.HOME }}/.config/pip/pip.conf"
    mode: "0644"

- name: Deploy hardened /etc/pip.conf (system-wide; covers sudo and non-deploying users)
  # pip's config search order is global (/etc/pip.conf) → user
  # (~/.config/pip/pip.conf) → site (venv). Without the system file,
  # `sudo pip install` (HOME=/root) and other-user invocations see no
  # hardening — bypassing the only-binary=:all: protection that blocks
  # setup.py execution.
  become: true
  ansible.builtin.template:
    src: pip.conf.j2
    dest: /etc/pip.conf
    owner: root
    group: root
    mode: "0644"
