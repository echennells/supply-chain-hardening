[defaults]
inventory = inventories/hosts.yml
host_key_checking = False
retry_files_enabled = False
# The role reads facts as ansible_facts.<name>. Injecting them as top-level
# variables too (ansible_env, ...) is deprecated and off by default from
# ansible-core 2.24; off here already, so a run from this directory fails on
# any such read.
inject_facts_as_vars = False
