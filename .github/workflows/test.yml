name: Test Supply Chain Hardening

on:
  # feat/** and fix/** included deliberately. This workflow is the ONLY thing
  # that builds tests/Dockerfile and runs the 375-test role suite; the other
  # workflows filter on action/** and cover the CI action only. With main-only
  # triggers a branch could change 12 role tasks, verify.sh.j2 and 6 bats files
  # and see nothing but green - which is how a verifier that aborted on an
  # unbound variable, and therefore did not run at all on hosts, reached a
  # branch tip. Coverage that does not fire reads exactly like coverage.
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    name: "Test (Node ${{ matrix.node-version }})"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build test container (Node ${{ matrix.node-version }})
        run: docker build -t supply-chain-test --build-arg NODE_VERSION=${{ matrix.node-version }} -f tests/Dockerfile .

      - name: Run tests
        run: docker run --rm supply-chain-test
