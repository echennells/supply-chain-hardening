name: Test Supply Chain Hardening

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    name: "Test (Node ${{ matrix.node-version }})"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build test container (Node ${{ matrix.node-version }})
        run: docker build -t supply-chain-test --build-arg NODE_VERSION=${{ matrix.node-version }} -f tests/Dockerfile .

      - name: Run tests
        run: docker run --rm supply-chain-test
