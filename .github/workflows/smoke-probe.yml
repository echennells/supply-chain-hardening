name: smoke probe
on:
  push:
    branches: ['probe/**']

permissions:
  contents: read

jobs:
  # Two jobs per tool: the first runs the attack, the second is what it showed. Maven
  # Central rate-limits GitHub's shared runner addresses, and a run it refused with
  # a 429 says nothing about the hardening. Both jobs used to blame the hardening for
  # that (jobs 138217056780 and 138043538056). Such a run now leaves the second job
  # SKIPPED, neither a pass nor a fail, with a NOT TESTED warning on the first. What
  # counts as which: tests/smoke/verdict.sh, tested on those logs in
  # tests/ci/13-central-429.bats.
  action-maven-https-only-attempt:
    name: 'Action: maven on an HTTP-only repository (the attempt; the next job is the verdict)'
    runs-on: ubuntu-24.04
    outputs:
      verdict: ${{ steps.attempt.outputs.verdict }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: ./action
        with:
          ecosystems: maven

      # Behavioral: the action's settings.xml has
      #   <mirrorOf>external:http:*</mirrorOf> + <blocked>true</blocked>
      # which should cause Maven to refuse any HTTP-only repo at resolve time.
      # Build a pom that declares an HTTP-only repo + attempts to resolve from it.
      - name: mvn on a project with an HTTP-only repository
        id: attempt
        run: |
          mkdir -p /tmp/maven-victim && cd /tmp/maven-victim
          cat > pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>victim</groupId>
            <artifactId>victim</artifactId>
            <version>1.0</version>
            <packaging>pom</packaging>
            <repositories>
              <repository>
                <id>http-repo</id>
                <url>http://repo.example.com/maven2</url>
              </repository>
            </repositories>
            <!-- A dependency that exists on NO public repo, so Maven is
                 forced to consult http-repo and hit the blocked mirror.
                 Without this the pom declared an HTTP repo that nothing
                 ever needed: dependency:resolve had nothing to resolve,
                 fetched its own plugin from central over HTTPS, and exited
                 0 — the mirror was never exercised at all. -->
            <dependencies>
              <dependency>
                <groupId>com.example.nowhere</groupId>
                <artifactId>only-on-http</artifactId>
                <version>1.0</version>
              </dependency>
            </dependencies>
          </project>
          EOF
          rc=0
          mvn -B dependency:resolve > "$RUNNER_TEMP/mvn.log" 2>&1 || rc=$?
          tail -30 "$RUNNER_TEMP/mvn.log"
          echo "rc=$rc"
          v=$("$GITHUB_WORKSPACE/tests/smoke/verdict.sh" maven "$rc" "$RUNNER_TEMP/mvn.log")
          echo "$v"
          case "$v" in not-tested*) echo "::warning title=NOT TESTED::maven on an HTTP-only repository: ${v#not-tested }" ;; esac

  action-maven-behavioral-https-only:
    name: 'Action: maven mirror actually blocks HTTP-only repository'
    needs: action-maven-https-only-attempt
    if: needs.action-maven-https-only-attempt.outputs.verdict != 'not-tested'
    runs-on: ubuntu-24.04
    steps:
      - name: maven refused the HTTP-only repository, through the mirror the Action wrote
        env:
          VERDICT: ${{ needs.action-maven-https-only-attempt.outputs.verdict }}
        run: |
          [ "$VERDICT" = blocked ] || { echo "::error::maven did not block the HTTP repo (verdict: ${VERDICT:-none}); its output is in the attempt job"; exit 1; }
          echo "✓ maven blocked the HTTP-only repository via the Action's <blocked> mirror"

  action-gradle-dynamic-version-attempt:
    name: 'Action: gradle on a dynamic version (the attempt; the next job is the verdict)'
    runs-on: ubuntu-24.04
    outputs:
      verdict: ${{ steps.attempt.outputs.verdict }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: ./action
        with:
          ecosystems: gradle

      # Behavioral: ~/.gradle/init.gradle.kts has
      #   resolutionStrategy { failOnDynamicVersions() }
      # which should cause Gradle to reject any dynamic version selector
      # (1.+, latest.release, 1.0-SNAPSHOT, etc.).
      - name: gradle on a dynamic version selector
        id: attempt
        run: |
          mkdir -p /tmp/gradle-victim && cd /tmp/gradle-victim
          cat > settings.gradle.kts <<'EOF'
          rootProject.name = "victim"
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins { java }
          repositories { mavenCentral() }
          dependencies {
            // Dynamic version — must be refused by init script.
            implementation("com.google.guava:guava:33.+")
          }
          // `gradle dependencies` only REPORTS the graph; it marks an
          // unresolved entry "(n)" and still exits 0, so it proved nothing
          // here. Force an actual resolve so failOnDynamicVersions fires and
          // the build genuinely fails.
          tasks.register("resolveAll") {
            doLast { configurations.getByName("compileClasspath").resolve() }
          }
          EOF
          rc=0
          gradle --no-daemon --init-script "$HOME/.gradle/init.gradle.kts" resolveAll > "$RUNNER_TEMP/gradle.log" 2>&1 || rc=$?
          tail -30 "$RUNNER_TEMP/gradle.log"
          echo "rc=$rc"
          v=$("$GITHUB_WORKSPACE/tests/smoke/verdict.sh" gradle "$rc" "$RUNNER_TEMP/gradle.log")
          echo "$v"
          case "$v" in not-tested*) echo "::warning title=NOT TESTED::gradle on a dynamic version: ${v#not-tested }" ;; esac

  action-gradle-behavioral-dynamic-version:
    name: 'Action: gradle init script actually rejects dynamic versions'
    needs: action-gradle-dynamic-version-attempt
    if: needs.action-gradle-dynamic-version-attempt.outputs.verdict != 'not-tested'
    runs-on: ubuntu-24.04
    steps:
      - name: gradle refused the dynamic version, through the init script the Action wrote
        env:
          VERDICT: ${{ needs.action-gradle-dynamic-version-attempt.outputs.verdict }}
        run: |
          [ "$VERDICT" = blocked ] || { echo "::error::gradle did not refuse the dynamic version as the init script does (verdict: ${VERDICT:-none}); its output is in the attempt job"; exit 1; }
          echo "✓ gradle init script blocked dynamic version selector"

