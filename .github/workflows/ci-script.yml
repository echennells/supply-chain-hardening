name: harden.sh unit tests

# Fast feedback for the CI-runner script. The role's bats suite needs a built
# container and the action smoke tests need a full runner per case; this runs
# harden.sh directly against throwaway HOMEs and finishes in seconds, so it
# can gate every push.
#
# macOS is in the matrix for one specific reason: it is the only place the
# BSD `date` fallback for uv's exclude-newer timestamp is exercised. On Linux
# the GNU branch always wins and that code would never run.
#
# agent-shells runs harden.sh and the verifier in containers, in the shells two
# agent runners were measured to start (docs/design-principles.md, "Agent
# runners"), and builds action/examples/Dockerfile. Its cells are in
# tests/ci/agent-shell/run.sh.

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'action/**'
      - 'files/**'
      # Read by the suite: the parity tests compare the role with the script, and
      # 13-central-429 reads the smoke workflow and its verdict script.
      - 'defaults/**'
      - 'tasks/**'
      - 'templates/**'
      - 'tests/ci/**'
      - 'tests/lib/**'
      - 'tests/smoke/**'
      - '.github/workflows/action-smoke.yml'
      - '.github/workflows/ci-script.yml'
  pull_request:
    paths:
      - 'action/**'
      - 'files/**'
      # Read by the suite: the parity tests compare the role with the script, and
      # 13-central-429 reads the smoke workflow and its verdict script.
      - 'defaults/**'
      - 'tasks/**'
      - 'templates/**'
      - 'tests/ci/**'
      - 'tests/lib/**'
      - 'tests/smoke/**'
      - '.github/workflows/action-smoke.yml'
      - '.github/workflows/ci-script.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: "harden.sh (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 was retired: GitHub cancels it with "The configuration
        # 'macos-14-arm64-us-default' is not supported" (2026-11-09).
        # macos-15-intel since 2026-11-24: the Intel Macs differ in where Homebrew
        # puts things and in which tools the image has.
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install bats
        run: npm install -g bats@1.13.0

      - name: Install uv (exercises the ecosystem's own behavioral tests)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run the suite
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # --timing stays: per-test times are what showed that every test running
          # the real, unstubbed cargo took about 15 s on macos-15. cargo there is a
          # rustup proxy, and an unguarded `cargo --version` downloaded a toolchain
          # into each test's fresh HOME until the disk was full (2026-11-10).
          bats --timing --print-output-on-failure tests/ci/

      - name: Shell-check harden.sh and the agent-shell driver
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1090/SC1091: sourced paths are runtime values by design.
          # SC2016: wrapper heredocs intentionally emit literal $VAR, and the
          # driver's single-quoted commands are expanded by the container's shell.
          shellcheck --severity=warning --exclude=SC1090,SC1091,SC2016 action/harden.sh tests/ci/agent-shell/run.sh

  # The Mac of somebody who is not a CI runner (issue 48, item 6): npm 11.5.1, which
  # warns about keys it does not know; Apple's own /usr/bin/bundle (Bundler 1.17.2,
  # where `bundle config get X` is a write); and no JDK, where /usr/bin/javac exists
  # and cannot run. Everything else of the runner's is off PATH.
  persons-mac:
    name: "harden.sh (a person's Mac)"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: npm 11.5.1, Apple's tools, uv, and a javac that cannot run
        run: |
          set -euo pipefail
          npm install -g --silent --prefix "$RUNNER_TEMP/bats" bats@1.13.0
          npm install -g --silent --prefix "$RUNNER_TEMP/npm115" npm@11.5.1
          curl -LsSf https://astral.sh/uv/install.sh | sh
          bin="$RUNNER_TEMP/mac/bin"; mkdir -p "$bin"
          ln -s "$(command -v node)" "$bin/node"
          ln -s "$RUNNER_TEMP/npm115/bin/npm" "$RUNNER_TEMP/npm115/bin/npx" "$bin/"
          ln -s "$RUNNER_TEMP/bats/bin/bats" "$bin/bats"
          ln -s "$HOME/.local/bin/uv" "$bin/uv"
          for t in java javac jar; do
            # The words and the status Apple's stubs have with no JDK installed.
            printf '#!/bin/sh\necho "The operation couldn\xe2\x80\x99t be completed. Unable to locate a Java Runtime." >&2\nexit 1\n' > "$bin/$t"
            chmod +x "$bin/$t"
          done
          echo "MACPATH=$bin:/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"

      - name: What the suite will find
        run: |
          run() { env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" TMPDIR="$TMPDIR" LANG=en_US.UTF-8 PATH="$MACPATH" "$@"; }
          run npm --version
          run bundle --version
          [ "$(run npm --version 2>/dev/null)" = 11.5.1 ]
          [ "$(run sh -c 'command -v bundle')" = /usr/bin/bundle ]
          [[ "$(run bundle --version 2>/dev/null)" == *" 1.17."* ]]
          ! run javac -version
          for t in pnpm yarn bun deno go cargo composer mvn gradle dotnet; do ! run sh -c "command -v $t" || { echo "::error::$t is on PATH: not a person's Mac"; exit 1; }; done

      - name: Run the suite
        run: |
          env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" TMPDIR="$TMPDIR" LANG=en_US.UTF-8 PATH="$MACPATH" \
            bats --timing --print-output-on-failure tests/ci/

      - name: With a sudo that would ask for a password, nothing asks
        run: |
          # -n fails, as it does for a person; any other call is one that prompts.
          mkdir -p "$RUNNER_TEMP/asks"
          printf '#!/bin/sh\ncase "$1" in -n|--version|-V) exit 1 ;; esac\necho "sudo $*" >> "%s"\nexit 1\n' "$RUNNER_TEMP/asked" > "$RUNNER_TEMP/asks/sudo"
          chmod +x "$RUNNER_TEMP/asks/sudo"
          env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" TMPDIR="$TMPDIR" LANG=en_US.UTF-8 PATH="$RUNNER_TEMP/asks:$MACPATH" \
            bats --timing --print-output-on-failure tests/ci/
          if [ -s "$RUNNER_TEMP/asked" ]; then echo "::error::the suite asked for a password:"; sort "$RUNNER_TEMP/asked" | uniq -c | head -20; exit 1; fi

  # VM A (root, HOME=/home/hatch, npm 10.9.4 and bun in a read-only image directory,
  # every command through `bash --norc --noprofile -c "umask 0007; ..."`), a uid with
  # no passwd entry, VM B's replayed shell state, and the shipped example Dockerfile.
  # Each step is one phase of the driver; the container carries over between them.
  agent-shells:
    name: "agent shell (${{ matrix.cell }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cell: [vm-a, uid-without-passwd, replayed-state, image-recipe]
    env:
      CELL: ${{ matrix.cell }}
    steps:
      # The tree goes to docker build as its context and into containers as a
      # bind mount: leave no token in .git/config for either to carry.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up the cell
        run: bash tests/ci/agent-shell/run.sh "$CELL" setup

      - name: What the cell contains
        run: bash tests/ci/agent-shell/run.sh "$CELL" contents

      - name: Run the cell
        run: bash tests/ci/agent-shell/run.sh "$CELL" checks

      - name: Clean up
        if: always()
        run: bash tests/ci/agent-shell/run.sh "$CELL" cleanup
