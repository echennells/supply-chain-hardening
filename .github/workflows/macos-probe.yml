name: macOS probe
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  action:
    name: "Action probe (${{ matrix.runner }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Tools
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install -q oven-sh/bun/bun deno uv composer >/tmp/brew.log 2>&1 || tail -5 /tmp/brew.log
          npm install -g --silent pnpm@latest || true
          for t in node npm pnpm yarn bun deno uv python3 pip3 composer php cargo bundle gem go dotnet mvn gradle sudo; do printf 'PROBE tool | %s %s\n' "$t" "$(command -v $t || echo absent)"; done
          touch "$RUNNER_TEMP/mark"; sudo find "$HOME" -user root -not -path '*/Library/*' 2>/dev/null | sed 's/^/PROBE root-owned before | /' | head -5
      - name: Before
        run: bash .github/probe/mac.sh before
      - uses: ./action
        id: harden
        continue-on-error: true
      - name: After
        if: always()
        run: bash .github/probe/mac.sh after
      - name: Verify
        if: always()
        run: |
          ./action/verify.sh --fail-on=never > /tmp/v.txt 2>&1 || true
          grep -E '^(GAP|WEAK|OK) ' /tmp/v.txt | cut -c1-210 | sed 's/^/PROBE verify | /'; grep RESULT /tmp/v.txt | sed 's/^/PROBE verify | /'
          echo "PROBE outputs | hardened=${{ steps.harden.outputs.ecosystems-hardened }} outcome=${{ steps.harden.outcome }}"
      - name: Root-owned files left in HOME
        if: always()
        run: sudo find "$HOME" -user root -newer "$RUNNER_TEMP/mark" -not -path '*/Library/*' 2>/dev/null | sed 's/^/PROBE root-owned after | /' | head -20
  role:
    name: "Role probe (macos-15)"
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Role
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install -q ansible coreutils uv composer >/tmp/brew.log 2>&1 || tail -5 /tmp/brew.log
          export PATH="$(brew --prefix)/opt/coreutils/libexec/gnubin:$PATH" LC_ALL=en_US.UTF-8
          ./action/harden.sh --preflight 2>&1 | sed 's/^/PROBE preflight | /' | head -60
          touch "$RUNNER_TEMP/mark"
          for i in 1 2; do ansible-playbook site.yml --limit localhost -e accept_etc_overwrite=true -e accept_user_config_overwrite=true > /tmp/apply$i.log 2>&1; echo "PROBE role apply $i | rc=$? $(grep -E '^localhost' /tmp/apply$i.log | tail -1)"; grep -E '^(fatal|failed)|FAILED!|ERROR' /tmp/apply$i.log | cut -c1-400 | sed "s/^/PROBE role apply $i | /" | head -6; grep -B1 -E '^fatal' /tmp/apply$i.log | grep TASK | sed "s/^/PROBE role apply $i | /" | head -4; done
          sed -n '/were NOT applied/,/prerequisite/p' /tmp/apply1.log | cut -c1-1500 | sed 's/^/PROBE role notapplied | /' | head -12
          supply-chain-verify > /tmp/v.txt 2>&1; grep -E '^(GAP|WEAK|OK) ' /tmp/v.txt | cut -c1-170 | sed 's/^/PROBE role verify | /' | head -60
          bash .github/probe/mac.sh role-after
          sudo find "$HOME" -user root -newer "$RUNNER_TEMP/mark" -not -path '*/Library/*' 2>/dev/null | sed 's/^/PROBE role root-owned | /' | head -20
