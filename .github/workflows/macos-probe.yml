name: macOS probe
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  pnpm:
    name: "pnpm (${{ matrix.runner }}, pnpm ${{ matrix.pnpm }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
        pnpm: ['10', '11']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: npm install -g --silent pnpm@${{ matrix.pnpm }} && bash .github/probe/pnpm.sh before
      - uses: ./action
        with:
          ecosystems: pnpm
      - run: bash .github/probe/pnpm.sh after-pnpm-only
      - uses: ./action
      - run: |
          bash .github/probe/pnpm.sh after-all
          ./action/verify.sh --fail-on=never 2>&1 | grep -E 'pnpm' | cut -c1-200 | sed 's/^/PROBE pnpm verify | /'
